id: SUP-11
framework_id: CHK-SUP-011
mechanism_ids:
- mechanism-09
revision: 4
retired: false
area: SUP
purpose: 추가 코드 실행 허용
secondary_purposes: []
question: 지원하는 Python 실행 모드가 달라져도 같은 동적 import 허용 검사가 유지되는가?
scope: null
risk_category: 보안 위협 점검
risk_summary: 모듈 경로를 지정할 수 있는 주체가 실행 모드별 import 검사 차이를 이용해 비승인 코드를 실행시킬 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 선정 동적 import 소비 경로와 실제 지원하는 Python 실행 모드가 있을 때 적용한다. 같은 모듈 선택값·허용 정책을 일반 실행과 지원하는 최적화 모드 등에서 비교한다. 코드 선택 출처별 조사 결과는 CHK-SUP-008·CHK-SUP-009·CHK-SUP-010과 연결한다.
policy_params:
- key: supply_environment_sha256
  type: str
  required: true
- key: supply_normal_target_sha256
  type: str
  required: true
- key: supply_challenge_target_sha256
  type: str
  required: true
- key: supply_normal_prepared_sha256
  type: str
  required: true
- key: supply_challenge_prepared_sha256
  type: str
  required: true
- key: supply_record_source_sha256
  type: str
  required: true
- key: supply_validity_start
  type: str
  required: true
- key: supply_validity_end
  type: str
  required: true
policy_prose:
  policy_to_decide: null
  enterprise_decisions: 필요한 모델 코드·plugin·모드·권한·공급 방식, 승인/변경 절차. auto_map 존재만으로 실행이나 거부를 확정하지 않고 실제 선택되는 코드 출처를 확인한다.
normal_control: 지원한다고 선언한 각 실행 모드가 승인 import 목록으로 기동한다.
challenge_steps:
- 지원 mode별 import 기준선 확보
- 선택 가능한 무해 외부 module 경로를 입력
- 실제 import 또는 거부 위치 확인
required_observations:
- key: supply_boot_sessions
  type: list
- key: supply_boot_violations
  type: list
- key: supply_boot_missing
  type: list
- key: supply_boot_complete
  type: bool
- key: supply_boot_normal_verified
  type: bool
- key: supply_boot_change_applied
  type: bool
- key: supply_boot_record_authenticated
  type: bool
- key: supply_boot_native_consumption
  type: list
- key: supply_boot_change
  type: dict
required_observations_prose:
- mode·entrypoint·module 선택값/import 파일/설정 집행 결과
satisfied_if: 지원하는 각 실행 모드에서 허용하지 않은 외부 모듈 로딩을 거부하고 정상 로딩은 가능하다.
fail_criteria: 지원 mode에서 승인 밖 dynamic import가 허용된다.
unknown_criteria: 지원 mode 목록 또는 실제 import 대상을 확인하지 못했다.
remediation: '- 지원하는 각 실행 모드에서 동적 import를 허용하는 모듈·경로·설정값을 제한한다. 보안 검사를 최적화 옵션으로 제거될 수 있는 assertion과 분리하고 실행 전에 유효성을 검사한다.'
method_and_evidence: 같은 동적 import 경로·허용 목록·승인/비승인 무해 모듈을 고정하고 실제 지원하는 Python 실행 모드만 바꿔 검사·거부·import 결과를 비교한다. 보안 판단이 제거 가능한 assertion에만 의존해 특정 모드에서 사라지는지 확인한다. 각 모드에서 승인 모듈의 정상 로딩도 확인한다.
remaining_setup: 지원 실행 모드 확정과 import 계측
executor: supply_boot
