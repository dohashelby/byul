executor: model_authorization
collection_profile: kubernetes-model-authorization-observation-v1
policy_params:
  - { key: model_environment_sha256, type: str, required: true }
  - { key: model_target_sha256, type: str, required: true }
  - { key: allowed_principal_sha256, type: str, required: true }
  - { key: denied_principal_sha256, type: str, required: true }
  - { key: selected_model_grants, type: "list[str]", required: true }
  - { key: retired_model_revisions, type: "list[str]", required: true }
  - { key: model_validity_start, type: str, required: true }
  - { key: model_validity_end, type: str, required: true }
required_observations:
  - { key: model_use_trials, type: list }
  - { key: configured_model_policy_conflicts, type: list }
  - { key: configured_retired_model_uses, type: list }
  - { key: model_authorization_scope_complete, type: bool }
  - { key: model_retirement_scope_complete, type: bool }
  - { key: final_model_identity_verified, type: bool }
judge:
  plugin: rule_table
  params:
    pass_when_all:
      - { obs: model_use_trials, op: nonempty }
      - { obs: final_model_identity_verified, op: eq, value: true }
      - { obs: model_authorization_scope_complete, op: eq, value: true }
      - { obs: model_retirement_scope_complete, op: eq, value: true }
      - { obs: configured_model_policy_conflicts, op: empty }
      - { obs: configured_retired_model_uses, op: empty }
    fail_when_any:
      - { obs: configured_model_policy_conflicts, op: nonempty,
          when: { obs: final_model_identity_verified, op: eq, value: true } }
      - { obs: configured_retired_model_uses, op: nonempty,
          when: { obs: final_model_identity_verified, op: eq, value: true } }
limitations:
  - "구현 분기: 한 base-model alias에 allowed·denied 자격의 before/challenge/after 요청을 보내고 native assign-request·forward의 configured model/revision과 정책을 대조한다."
  - "미구현 분기: 최종 모델 파일·tensor 정체 근거가 없어 보안 PASS와 보안 FAIL은 현재 도달하지 않는다. 발견한 정책 상충과 퇴역 사용은 후보로만 남는다."
  - "kubernetes 구현만 있다. alias·LoRA·대체 endpoint·퇴역 전후 매핑 변경·기존 요청 회수는 미시험이다. [] 퇴역 목록은 그 시험 미선정이며 퇴역 PASS가 아니다."
