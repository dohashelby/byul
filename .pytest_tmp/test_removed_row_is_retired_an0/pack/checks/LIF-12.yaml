required_observations_prose:
- Gateway·client retry 설정
- attempt ID
- 이전 작업·청구·누적 비용
satisfied_if: 팀 참조에서는 추론 자동 retry 비사용을 실제 설정·경로로 확인한다. 정책을 변경해 사용하는 경우에만 금지 중복 실행·반환·비용 누적이 없는지 판정한다.
fail_criteria: 금지 자동 재시도나 채택한 중복 비용·잔존 한도 위반이 발생한다.
unknown_criteria: 상위 앱의 retry 또는 내부 attempt·비용을 확인하지 못했다.
remediation: 취소 전파·그룹 장애 처리·retry예산과 실제 종료 관측을 연결한다 입력/동시성·queue·출력 대기에 실제 제한을 두고 불필요 debug를 끈다 신뢰할 신원에서 객체 소유권을 연결하고 상태 초기화와 대상 검사를 확인한다
method_and_evidence: 원/새 attempt·실행·출력·누적 비용·종결을 연결한다.
remaining_setup: 실제 caller retry 설정; 자동 retry 사용 환경은 별도 정책
