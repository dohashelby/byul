revision: 5
retired: false
area: SUP
purpose: 실제 사용의 무결성
secondary_purposes: []
question: 각 worker가 배정받은 승인 모델 파일·shard를 실제로 메모리에 올리는가?
scope: null
risk_category: 보안 위협·일반 장애 함께 점검
risk_summary: 공급물·공유 weights 변경권자가 잘못된 shard·모델 세대를 제공하거나 적재 오류가 발생해 비승인·불완전 모델로 응답할 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 기본 worker 적재는 항상 확인한다. 공유·원격 weights를 사용하면 publisher·model·rank·generation·layout·payload 대응을 추가한다.
