id: SUP-01
framework_id: CHK-SUP-001
mechanism_ids:
- mechanism-01
revision: 3
retired: false
area: SUP
purpose: 승인 권한 분리
secondary_purposes: []
question: 파일 제출·저장소 수정 권한과 승인 기록 변경 권한이 분리되어 있는가?
scope: null
risk_category: 보안 위협 점검
risk_summary: 공급물 제출자가 저장소 쓰기 권한으로 승인 기록까지 바꿔 비승인 모델을 서비스에 투입할 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 공급물의 제출·저장·승인 절차가 있는 환경. 승인 도구가 미정이거나 없으면 제외하지 않고 승인 집행점의 미확인으로 남긴다.
policy_params:
- key: approval_record_system
  type: str
  required: true
policy_prose:
  policy_to_decide: null
  enterprise_decisions: 실제 담당자·계정, 모델×환경×작업 허용표, 역할 겸임·독립 검토 규칙, 승인 도구·긴급 권한의 기간과 기록. 기업에 특정 인원수를 강제하지 않는다.
normal_control: 승인 역할은 시험 공급물을 승인하고 제출자는 업로드한다.
challenge_steps:
- 시험 승인 기록의 사본 준비
- 제출자 계정으로 승인 상태·digest 변경 시도
- 승인 역할의 동일 작업과 비교
required_observations: []
required_observations_prose:
- 실제 계정·권한표/저장소 변경 결과/승인 전후 기록과 별도 감사 이벤트
satisfied_if: 비허용 승인 변경이 거부되고 정당한 승인은 가능하다.
fail_criteria: 제출·파일 쓰기권만 가진 계정이 승인 상태나 승인 대상 식별정보를 유효하게 바꾼다.
unknown_criteria: 실제 승인 저장소·권한 집행점 또는 승인 기록 변경 결과를 확인하지 못했다.
remediation: '- 제출자·저장소 수정자와 승인 기록을 변경하는 역할을 분리한다. 승인 상태·대상 식별정보를 바꿀 수 있는 계정을 제한하고 변경 이력을 남긴다.'
method_and_evidence: 허용 역할표를 정하고 제출자·승인자의 쓰기/승인 시도를 대조한다. 역할표·승인 변경 이력을 확보한다.
remaining_setup: 실제 역할 계정과 승인 저장소 사본 선정
executor: null
judge: null
legacy:
  q_ids:
  - Q-R05-01
  scenario_ids:
  - SC-09-01
  subtest_ids:
  - Q-R05-01/SC-09-01
source:
  array: supply_assessment_draft
limitations:
- '승인 기록 체계(신고된 정책 문맥): {approval_record_system}. 값의 등록은 승인 권한·기록 무결성 검증이 아니다. 실제 권한·변경 결과·감사 기록은 별도 증거가 필요하다.'
