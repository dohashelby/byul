id: OBS-11
revision: 1
retired: false
area: OBS
purpose: 증거의 신뢰성
secondary_purposes: []
question: 수집 중단·누락·시간 불확실성을 정상 결과로 처리하지 않는가?
scope: 필수 관측 경로
risk_category: 증거·판정 신뢰성 점검
risk_summary: 수집 장애·시간 불확실성이 숨겨지면 평가자가 증거 없는 상태를 정상으로 판단해 보호 실패를 놓칠 수 있음. 장애 자체를 공격 성공으로 보지 않음.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 필수 관측 경로
policy_params: []
policy_prose:
  policy_to_decide: 필수 기록·수집 기한·시간 오차·장애 대응
  enterprise_decisions: 기록 형식·writer/reader/admin 권한·무결성/변조 탐지 수단, 사건 중요도별 수집 장애 때 운영 유지/제한/중단 절차. 운영 적용 전에 사건별 대응을 확정한다. 미정이면 기본 지속이나 즉시 중단 어느 쪽도 가정하지 않는다.
normal_control: 필수 시험 사건이 정한 수집 기한 안에 도착한다.
challenge_steps:
- 합성 사건 발생
- collector 중단·쓰기 거부 중 하나 주입
- 누락·경보·종속 판정 확인 후 복구
required_observations: []
required_observations_prose:
- 사건 발생 독립 증거
- 수집 상태·시각
- 누락 경보·평가 상태
satisfied_if: 누락·장애가 식별되고 관련 판정에 반영된다. 확인된 필수 기록 누락은 관측 미충족, 종속 시험은 미확인이다.
fail_criteria: 확인된 필수 기록 누락을 정상으로 처리하거나 필요한 경보를 내지 않는다.
unknown_criteria: 기한·시간오차 기준이 없거나 사건 발생 자체를 확인하지 못했다. 관측 누락 확인 시 관측 미충족·종속 시험 미확인이다.
remediation: 필드 최소화·권한/보존·opt-out·송신통제·수집장애 표시를 실제 경로에 적용한다
method_and_evidence: 합성 사건을 발생시키고 collector·권한·저장 장애를 제한적으로 주입해 누락 표시와 경보를 확인한다. 시각/순서 불확실성도 기록한다.
remaining_setup: 필수 사건·수집 기한·시간 동기화·장애 후 복구
