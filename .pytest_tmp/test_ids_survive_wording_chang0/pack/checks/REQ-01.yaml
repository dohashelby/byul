id: REQ-01
revision: 2
retired: false
area: REQ
purpose: 요청·대상 접근 권한
secondary_purposes: []
question: Gateway를 우회한 직통 요청으로 비허용 작업을 수행할 수 없는가? (문구 수정)
scope: 기본
risk_category: 보안 위협 점검
risk_summary: 엔진 주소에 접근 가능한 호출자가 Gateway를 우회해 앞단에서 금지한 추론·관리 작업을 수행할 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  all:
  - fact: gateway
    eq: true
  prose: 사용자→Gateway 경유와 엔진 직통 제한
policy_params:
- key: allowed_callers
  type: list[str]
  required: true
policy_prose:
  policy_to_decide: 직통 허용 주체·망 경계·역할 정책
  enterprise_decisions: 인증 방식·실제 계정, 사용자/조직별 모델·작업 허용표, 직통 허용 주체·목적, 관리 역할, Gateway의 신원 전달·경로 변환과 선택 API. 저장 결과 기능을 쓰면 객체 소유자·조회·취소 권한도 결정한다.
normal_control: 허용 신원은 Gateway 경유로 정상 추론한다.
challenge_steps:
- 실제 route 목록 확보
- 키 없음·오류·허용키로 Gateway와 직통 경로 비교
- handler 실행과 정책 거부를 대조
required_observations:
- key: routes_registered
  type: list[str]
- key: routes_tested
  type: list[str]
- key: direct_outcomes
  type: dict[str, int|outcome]
- key: gateway_outcomes
  type: dict[str, int]
- key: trusted_origin_reachable
  type: bool
required_observations_prose:
- 호출 출발점·경로
- route·인증 범위
- 실제 handler 실행·거부
satisfied_if: 비허용 주체의 작업은 수행되지 않고 허용 요청은 정상 처리된다.
fail_criteria: 비허용 출발점이나 신원이 직통 경로에서 금지 작업을 실행한다.
unknown_criteria: /v1만 확인했거나 /invocations 등 등록 경로·도달성·집행점을 확인하지 못했다.
remediation: 직통 노출 제한과 작업 인가를 함께 적용한다.
method_and_evidence: '동일한 무해 요청을 허용/비허용 신원으로 Gateway·직통에 전달하고 네트워크 거부와 handler 수행 여부를 구분한다. 등록 route 목록을 만들고 /v1과 보호 prefix 밖 /invocations 등 실제 추론 경로에 무키·오키·허용키 요청을 Gateway/직통으로 대조한다. root_path·재작성 전후 실제 handler 수행을 기록한다. 【F39】host None 일반 TCP launcher는 빈 호스트 bind; UDS/배포망 별도. CORS * 자체가 네트워크 접근·인가 우회 증거는 아님. 실제 bind·UDS·Gateway·방화벽·CORS 유효값을 기록하고 허용/비허용 Origin의 브라우저 및 비브라우저 직통 요청을 검사한다. 정상 대조: 허용 앱 경유 요청 정상'
remaining_setup: 격리 endpoint와 허용표; OPTIONS 응답과 실제 작업 실행 구분
executor: direct_route
judge:
  plugin: rule_table
  params:
    pass_when_all:
    - obs: routes_registered
      op: nonempty
    - obs: routes_tested
      op: superset_of
      value_obs: routes_registered
    - obs: direct_outcomes
      op: superset_of
      value_obs: routes_registered
    - obs: direct_outcomes
      op: all_in
      value:
      - 401
      - 403
      - refused
      - timeout
      - unreachable
    - obs: trusted_origin_reachable
      op: eq
      value: true
      when:
        obs: direct_outcomes
        op: any_in
        value:
        - refused
        - timeout
        - unreachable
    fail_when_any:
    - obs: direct_outcomes
      op: any_between
      value:
      - 200
      - 299
    axes:
      functional:
        pass_when_all:
        - obs: gateway_outcomes
          op: superset_of
          value_obs: routes_registered
        - obs: gateway_outcomes
          op: all_in
          value:
          - 200
        fail_when_any:
        - obs: gateway_outcomes
          op: any_in
          value:
          - 401
          - 403
legacy:
  q_ids:
  - Q-C01
  - Q-C07
  scenario_ids:
  - SC-01-01
  subtest_ids:
  - Q-C01/SC-01-01
source:
  array: request_state_assessment_draft
