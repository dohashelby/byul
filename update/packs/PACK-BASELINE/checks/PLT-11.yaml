unknown_criteria: 기존 session과 재연결을 구분하지 못했거나 잔존 정책이 미정이다.
remediation: 실행 계정·상속·mount를 최소화하고 실제 issuer와 session 종료를 연결한다 취소 전파·그룹 장애 처리·retry예산과 실제 종료 관측을 연결한다 복원 묶음 재승인·사본 목록·자산 소유자별 삭제/철회와 재개 검증을 둔다
method_and_evidence: 철회 전 열린 세션의 후속 사용과 종료를 관측한다. 작업 회수는 종결 영역에 연결한다.
