apiVersion: v1
kind: Namespace
metadata:
  name: serving-lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: serving-gateway-backend
  namespace: serving-lab
data:
  backend.json: |
    {
      "schema_version": "runtime-backend/1.0",
      "kind": "vllm",
      "base_url": "http://serving-engine.serving-lab.svc.cluster.local:8000",
      "model_map": {
        "test-model": "backend-test-model"
      },
      "health_path": "/health",
      "models_path": "/v1/models",
      "version_path": "/version",
      "metrics_url": "http://serving-engine.serving-lab.svc.cluster.local:8000/metrics"
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serving-engine
  namespace: serving-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: serving-engine
  template:
    metadata:
      labels:
        app: serving-engine
    spec:
      containers:
        - name: engine
          image: serving-runtime-lab:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "/opt/serving-runtime/deploy/lab/run_fake_engine.py"]
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: serving-engine
  namespace: serving-lab
spec:
  selector:
    app: serving-engine
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serving-gateway
  namespace: serving-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: serving-gateway
  template:
    metadata:
      labels:
        app: serving-gateway
    spec:
      containers:
        - name: gateway
          image: serving-runtime-lab:dev
          imagePullPolicy: IfNotPresent
          workingDir: /opt/serving-runtime
          command: ["serving-runtime"]
          args:
            - mvp
            - --backend
            - vllm
            - --backend-config
            - /etc/lab/backend.json
            - --gateway-port
            - "8080"
            - --data-dir
            - /tmp/data
          volumeMounts:
            - name: backend-config
              mountPath: /etc/lab
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: backend-config
          configMap:
            name: serving-gateway-backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: other-client
  namespace: serving-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: other-client
  template:
    metadata:
      labels:
        app: other-client
    spec:
      containers:
        - name: client
          image: serving-runtime-lab:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-c", "import time; time.sleep(10**9)"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-collector
  namespace: serving-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: serving-observer
  template:
    metadata:
      labels:
        app: serving-observer
    spec:
      containers:
        - name: observer
          image: serving-runtime-lab:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-c", "import time; time.sleep(10**9)"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
