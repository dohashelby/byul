# Observer slot with the bundle's "observer" ServiceAccount (Pod read Role).
# The intent's metrics_collectors label app=serving-observer lets it reach
# only the management listener. As in deploy/lab, the in-cluster collector
# program is not decided; this Pod holds the identity for policy checks.
# Live Hubble/Tetragon collection runs on the AWS host (README.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serving-observer
spec:
  replicas: 1
  selector:
    matchLabels: {app: serving-observer}
  template:
    metadata:
      labels: {app: serving-observer}
    spec:
      serviceAccountName: observer
      securityContext:
        runAsNonRoot: true
        # 10004 is a project choice; appendix I.4 does not name an observer UID
        # and 10003 belongs to the test probe.
        runAsUser: 10004
        runAsGroup: 10004
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: observer
          image: serving-tools
          command: ["python", "-c", "import time; time.sleep(10**9)"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: "50m", memory: 64Mi}
            limits: {memory: 128Mi}
