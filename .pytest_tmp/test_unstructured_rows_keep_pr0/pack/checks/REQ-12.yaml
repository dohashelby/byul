id: REQ-12
revision: 1
retired: false
area: REQ
purpose: 요청·상태·결과 귀속
secondary_purposes: []
question: 취소·연결 종료 뒤 늦은 결과가 다른 요청이나 새 시도에 섞이지 않는가?
scope: 기본+선택 기능
risk_category: 보안 위협·일반 장애 함께 점검
risk_summary: 취소·재시도 상태 처리 오류를 유발·이용하는 호출자에게 이전 작업의 늦은 결과가 잘못 전달되거나 다른 사용자의 결과·작업과 섞일 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 취소/종료 기본; 자동 retry는 활성 시만
policy_params: []
policy_prose:
  policy_to_decide: 취소 의미·늦은 결과 처리·retry 정책
  enterprise_decisions: 결과 독자·공유 관계·허용 응답/오류 필드, 입력 사본 반환 필요성, 취소 확정 시점·늦은 출력 처리, Gateway/SDK/엔진별 재시도, 저장 결과 기능. 결과 수신 권한과 반환 필드 권한을 각각 정한다.
normal_control: 정상 완료 요청과 취소 없는 재요청이 서로 독립 처리된다.
challenge_steps:
- A를 생성 중 취소·연결 종료
- 같은 외부 ID의 새 B 요청
- 늦은 A 결과와 B 결과·작업 상태 대조
required_observations: []
required_observations_prose:
- 내부 attempt ID
- abort 도달
- 늦은 chunk·B 결과·작업 상태
satisfied_if: 취소가 올바른 대상에 적용되고 늦은 결과가 비허용 소비자에게 전달되지 않는다. 실제 자원 회수는 C08에서 판정한다.
fail_criteria: 늦은 A 결과가 B에 섞이거나 B가 A의 취소를 잘못 승계한다.
unknown_criteria: abort 접수만 있고 내부 attempt·늦은 출력·실제 종결을 확인하지 못했다.
remediation: 요청/시도 식별과 출력 종결 규칙을 유지한다.
method_and_evidence: 취소 대상·Core abort·worker finished·출력 폐기/반환을 연결한다. retry 사용 시 이전/새 attempt를 따로 추적한다.
remaining_setup: 안전한 지연 주입과 attempt 식별 계측
