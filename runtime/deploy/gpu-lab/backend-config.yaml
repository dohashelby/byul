apiVersion: v1
kind: ConfigMap
metadata:
  name: serving-gateway-backend
data:
  # The AWS bundle serves the model as "test-model" (engine.yaml.template).
  # The bundle's gateway policy must list test-model in allowed_models.
  backend.json: |
    {
      "schema_version": "runtime-backend/1.0",
      "kind": "vllm",
      "base_url": "http://serving-engine.serving-lab.svc.cluster.local:8000",
      "model_map": {
        "test-model": "test-model"
      },
      "health_path": "/health",
      "models_path": "/v1/models",
      "version_path": "/version",
      "metrics_url": "http://serving-engine.serving-lab.svc.cluster.local:8000/metrics",
      "timeouts": {
        "relay_timeout_s": 60,
        "stream_idle_timeout_s": 30,
        "request_deadline_s": 300
      }
    }
