id: SUP-12
revision: 1
retired: false
area: SUP
purpose: 자료 해석 안전성
secondary_purposes: []
question: 선정 reader가 허용하지 않은 객체·동작을 거부하는가?
scope: null
risk_category: 보안 위협 점검
risk_summary: 파일·메시지를 제공할 수 있는 주체가 reader의 해석·역직렬화 동작을 악용해 허용 밖 코드 실행·객체 접근을 유도할 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 파일 해석/역직렬화
policy_params: []
policy_prose:
  policy_to_decide: null
  enterprise_decisions: 필요한 형식·reader·의존성 판본, 허용 객체·금지 부수 동작과 입력/처리 예산. 다른 형식이 필요하면 정책 변경·승인·재시험한다. 미디어는 현재 텍스트 구성 밖의 선택 기능이다.
normal_control: 고정한 safetensors reader로 정상 checkpoint를 읽는다.
challenge_steps:
- 실제 load_format·파일 패턴·reader 기록
- 불허 형식과 무해 손상 파일을 각각 제공
- fallback·secondary source와 최종 reader 확인
required_observations: []
required_observations_prose:
- 파일 형식·magic·실제 reader
- 거부 또는 fallback 경로
- 실패 후 상태
satisfied_if: 비허용 동작이 발생하지 않고 정상 공급물은 처리된다. PT 선택 자체를 코드 실행 결함으로 판정하지 않는다.
fail_criteria: 불허 reader·형식으로 조용히 fallback하거나 허용하지 않은 부수 동작이 발생한다.
unknown_criteria: 확장자만 보거나 실제 reader·fallback·부수 접근을 관측하지 못했다.
remediation: 필요 형식만 허용하고 reader/의존성을 고정·수정하며 소비 프로세스 권한을 줄인다 대체 공급원에도 같은 승인 검사를 적용하고 불필요 fallback을 차단한다 모델별 인가·실물승인·공유수명·fallback정책을 각각 집행한다 각 실제 hop의 접근권·상대 검증·송신 제한을 적용한다
method_and_evidence: reader·형식·의존성을 고정하고 무해한 정상/비허용 객체 fixture를 대조한다. 실제 torch 판본·reader 옵션을 확인하며 과거 weights_only 취약점을 현재 설치판에 자동 적용하지 않는다.
remaining_setup: 격리 손상 fixture와 파일 읽기 계측; 공유 weight/replay는 별도 consumer 조건
