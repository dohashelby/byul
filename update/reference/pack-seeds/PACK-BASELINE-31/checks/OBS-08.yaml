id: OBS-08
framework_id: CHK-OBS-008
mechanism_ids:
- mechanism-09
revision: 5
retired: false
area: OBS
purpose: 자료 해석 안전성
secondary_purposes: []
question: 재실행 도구가 변조된 진단 자료를 거부하고, 자료 해석 시 파일·통신·코드 실행 권한을 승인 범위로 제한하는가?
scope: 조건부; replay parser
risk_category: 보안 위협 점검
risk_summary: 진단 파일 변경권자가 변조 자료를 승인된 고권한 replay reader에 읽혀 허용 밖 코드 실행·자료 접근을 유도할 수 있음. 실제 consumer 확인 필요.
review_order: conditional_when_selected
impact: null
applies_when:
  prose: replay/역직렬화 consumer가 진단 자료를 소비할 때 적용한다. 단순 로그 보관과 구분한다.
policy_params:
- key: replay_allowed
  type: bool
  required: true
policy_prose:
  policy_to_decide: 자료 신뢰·실행 범위
  enterprise_decisions: 자료별 독자·반출 목적·범위·승인, 진단 실행 역할·격리 환경과 parser/입력 신뢰 범위.
normal_control: 승인 출처의 합성 진단 자료가 허용 reader로 처리된다.
challenge_steps:
- 별도 사본에 무해 구조·출처 표식 변경
- replay consumer로 제출
- 검증·reader·부수 접근 확인
required_observations: []
required_observations_prose:
- 자료 출처·digest/parser·reader 선택/거부·부수 접근
satisfied_if: 비허용 자료 실행·고권한 부수 동작을 막는다. 공급물 해석 점검과 증거를 공유한다.
fail_criteria: 비승인 자료를 허용 밖 reader로 해석하거나 금지 부수 동작이 발생한다.
unknown_criteria: 외부 consumer·입력형식·실제 reader를 알 수 없다.
remediation: '- replay에 사용할 진단 자료의 출처·식별정보·형식과 reader를 제한한다. 변조 자료를 사용 전에 거부하고 해석 프로세스의 파일·통신·코드 실행 권한을 승인 범위로 제한한다.'
method_and_evidence: '같은 승인 실행 역할과 실제 replay consumer를 고정하고 정상 합성 자료와 무해한 변조·출처/구조 변경 자료를 비교한다. digest·검증·최종 parser/reader·거부·객체 생성과 파일/통신/코드 부수 동작을 대조하고 실행 계정의 허용 권한 범위를 확인한다. 【F24】외부 replay 도구의 실제 배치·실행 계정·입력형식·reader 도달이 전제다. 누가 실행할 수 있는지는 CHK-OBS-007, 일반 파일·메시지 reader의 동일 해석 경로는 CHK-SUP-012와 증거를 공유한다. 근거 원문: [F24](https://github.com/mg-princess/serving-security-framework/blob/8a0c7fe42446ff0d3a1f58e2a18cf3069d5c714e/data/checklist.json#L33733).'
remaining_setup: 기본 비사용 여부와 실제 reader를 먼저 확인한다. 3.3 자료 해석 안전성의 CHK-SUP-012와 근거를 공유하고, replay의 읽기·실행 인가는 CHK-OBS-007에서 별도로 판정한다. Q-R05-07·Q-C11은 도출 근거로 유지한다.
