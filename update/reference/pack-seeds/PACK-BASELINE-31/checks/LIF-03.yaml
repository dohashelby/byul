id: LIF-03
framework_id: CHK-LIF-003
mechanism_ids:
- mechanism-07
revision: 4
retired: false
area: LIF
purpose: 자원 예산·공정성
secondary_purposes: []
question: 처리 비용이 큰 요청과 동시 부하의 단계별·요청별·누적 예산을 제한하면서 정상 요청도 처리할 수 있는가?
scope: 기본 요청·동시성·공정성; 미디어·metadata·child는 실제 수용 기능
risk_category: 보안 위협 점검
risk_summary: 일반 호출자가 비싼 요청·많은 child·우선순위·동시 요청을 이용해 GPU·KV·대기열을 독점하고 다른 사용자의 처리를 막을 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 기본 요청 길이·출력·동시성·대기열·공정성과 요청별/전체 예산을 확인한다. metadata·child 옵션은 수용할 때 추가한다. 이미지·오디오 등 미디어를 실제 수용하면 다운로드·base64 해제·decode·전처리 중 사용 단계의 비용과, 같은 요청의 복수 미디어·실제 재시도를 포함한 누적 비용을 추가 확인한다.
policy_params: []
policy_prose:
  policy_to_decide: 요청 예산·동시성·공정성·성능 기준
  enterprise_decisions: 모델·GPU·부하·공정성·정상 기능/성능 요구, 초과 시 거부/중단/정리 방식, 취득 retry 허용과 부분 자료 처리.
normal_control: 정상 소량 요청이 정한 지연·처리율을 만족한다. 미디어를 지원하는 경로에서는 허용 크기와 처리 비용의 정상 미디어·복수 미디어 요청이 단계별·요청별·누적 예산 안에서 완료되며 병행 정상 요청의 처리 기회가 유지된다.
challenge_steps:
- 요청별/전체 부하·queue/KV·시간·메모리 예산과 집행 위치를 고정하고 기존 입력/생성 개수·동시성·priority 변형을 작은 부하로 대조
- 미디어 수용 시 실제 다운로드·base64 해제·decode·전처리 단계와 계측 단위·허용 오버헤드·누적 기준을 기록
- Content-Length·인코딩 길이 등으로 위반을 미리 알 수 있는 입력은 비싼 decode/후속 처리 전 거부를 대조하고, 길이 불명 stream은 실제 읽기·누적 제한에 따른 중단과 후속 소비 차단을 별도 대조
- 정상 미디어와 단일 항목의 인코딩/decoded 크기·동일 요청 복수 항목/재시도 누적량 중 하나만 늘린 작은 경계 fixture를 제출하고 초과 감지·거부/중단·처리 도달 여부를 관측
- 정상 대조 요청을 병행해 단계·요청·전체 비용/지연·admission/queue·거부·완료·회복을 기록한다. 예산 회복의 임시 자원 관측을 공유하며 일반 작업·참조/그룹 회수 판정은 CHK-LIF-010·CHK-LIF-011에 연결
required_observations: []
required_observations_prose:
- 요청 비용·동시성·n/queue·KV·거부·완료와 정상 대조 지연/처리율
- 실제 미디어 입력 경로·decoder/전처리 backend·유효 제한값·집행 단계와 budget 객체/요청 연결, 계측 단위·허용 오버헤드·누적 기준
- 예상 크기와 실제 수신·인코딩·decoded/중간 결과 크기·시간·CPU/RAM 및 관련 GPU 비용, 단일 항목·동일 요청 복수 항목/재시도 누적 사용량과 실제 읽은 chunk 수/크기
- 사전 거부 또는 streaming 중단의 실제 지점, 후속 decode/소비의 도달/미도달, 해당 요청의 예산 회복·병행/후속 정상 요청 결과; 일반 작업·참조/그룹 회수 관측은 CHK-LIF-010·CHK-LIF-011과 공유
satisfied_if: 정의한 계측 단위·허용 오버헤드·누적 기준에 따라 단계별·요청별/전체 예산과 정상 서비스·공정성 요구를 지킨다. 미디어를 수용하면 같은 요청의 복수 항목/실제 재시도 누적 비용을 포함한다. 크기 정보로 이미 위반을 알 수 있으면 비싼 decode/후속 처리 전에 거부하고, 길이 불명 stream은 실제 읽기·누적 제한으로 중단해 후속 소비를 막는다. 제한 설정이나 단위 mock 결과를 실제 선정 경로의 비용·누적 집행 전체로 확대하지 않는다.
fail_criteria: 정의한 계측 단위·허용 오버헤드·누적 기준에 따른 단계별·요청별/전체 자원·대기·공정성 요구를 위반하거나, 누적 비용의 누락/초기화로 예산을 우회하거나, 예산 초과 시 채택한 거부·중단을 집행하지 않는다. 한 요청 오류가 허용 범위 밖 서비스 장애를 만드는 경우도 포함한다. 확인된 예산 위반은 이후 계속 처리의 증거 유무와 별개로 미충족으로 기록한다.
unknown_criteria: 부하·정상 성능·단계별/요청별/누적 예산, 계측 단위·허용 오버헤드·집행 위치가 미정이거나 실제 사용량·초과 거부/중단·예산 회복·다른 정상 요청 영향을 확인하지 못했다. 헤더·설정·HTTP 오류나 fake HTTP/decoder 호출 결과만 있고 실제 선정 경로의 비용·후속 소비 근거가 없는 부분은 미확인으로 남긴다. 이미 확인된 예산 위반은 해당 결과의 미충족으로 유지한다.
remediation: '- 입력·출력 크기, 동시 실행·대기열, 처리 시간과 사용자별 자원 사용에 한도를 둔다. 미디어 수용 경로는 사용 단계별 계측 단위·허용 오버헤드와 동일 요청의 복수 항목/재시도를 포함한 누적 예산을 정해 집행한다. 크기 정보로 이미 초과를 알면 비싼 decode/후속 처리 전에 거부하고, 길이 불명 stream은 실제 읽기/누적 제한으로 중단해 후속 소비를 막는다. 예산 회복과 정상 요청의 처리 기회를 확인하고 일반 작업·참조/그룹 회수는 CHK-LIF-010·CHK-LIF-011과 연결한다. 기업 예산값은 실제 환경과 계측을 바탕으로 결정한다.'
method_and_evidence: '합성 고비용 요청과 정상 workload를 섞어 queue·KV·지연·처리량·거부와 요청별/전체 비용을 측정한다. 미디어 수용 시 다운로드·base64 해제·decode·전처리의 사용 단계별 제한·계측 단위·허용 오버헤드와 동일 요청의 복수 항목/실제 재시도 누적 기준을 연결한다. 크기 정보로 위반을 미리 아는 경로는 비싼 decode/후속 처리 전 거부를, 길이 불명 stream은 실제 읽기·누적 제한에 따른 중단과 후속 소비 차단을 대조한다. 정상 미디어와 작은 인코딩/decoded/누적 경계 fixture를 비교해 감지·거부/중단 지점과 실제 비용·병행 정상 요청의 처리 기회를 기록한다. 해당 요청의 예산 회복 관측은 일반 작업·참조/그룹 회수를 판정하는 CHK-LIF-010·CHK-LIF-011과 공유한다. schema/grammar의 구조·복잡도 제한과 tool 조합은 CHK-REQ-010에서 판정하며 이 항목은 실제 비용·자원 예산을 확인한다.<br><br>**vLLM v0.31.0 구현 메모:** 【F19】queue None 기본은 한도 미설정. n의 16384는 기업 안전예산이 아님. priority header가 body보다 우선. 실제 대기열·토큰·n 유효값을 수집하고 경계 부하를 가한다. body와 X-Vllm-Priority를 각각 조작하여 허용 우선순위만 집행되는지 확인한다. 정상 대조: 정한 정상 부하·허용 priority가 기능/성능 기준 충족'
remaining_setup: 기존 부하·시간 중단값과 실제 queue/priority 설정을 고정한다. 미디어는 선정 입력 경로·decoder/backend·사용 단계별/요청별/누적 예산·계측 단위·허용 오버헤드와 작은 경계 fixture·거부/중단·예산 회복 관측을 준비한다. 공식 고정 소스와 설치판의 경로·의존성 호환성을 확인하며 기본 무한 queue를 제한으로 가정하지 않는다.
