id: LIF-10
framework_id: CHK-LIF-010
mechanism_ids:
- mechanism-13
revision: 3
retired: false
area: LIF
purpose: 종결·자원 회수
secondary_purposes: []
question: 취소·연결 종료 후 실제 작업이 정한 기한 안에 중단되고, 더 이상 사용하지 않는 상태·자원이 정리되는가?
scope: 일반·stream 기본
risk_category: 보안 위협·일반 장애 함께 점검
risk_summary: 일반 호출자가 요청 후 취소·연결 종료를 반복했을 때 잔존 계산·참조가 누적되고 한도도 피할 수 있으면 다른 사용자의 서비스가 중단될 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 일반·스트리밍 요청의 대기·계산·출력 단계에서 취소·연결 종료·timeout 처리를 확인한다.
policy_params: []
policy_prose:
  policy_to_decide: 종료 대상·기한·늦은 결과·잔존 자료 처리
  enterprise_decisions: 요청별/그룹별 회수 대상·잔존 참조·강제 종료·중복 비용 처리. 공유 weights/profiler/retry는 기능 선택 후 별도 수명·종료 계약을 확인한다.
normal_control: 정상 완료 요청은 실행·전송·참조를 정한 기한에 정리한다.
challenge_steps:
- 진행 요청에 취소·연결 종료 각각 적용
- API 접수부터 core·worker·전송 참조 종료 측정
- 다음 요청 확인
required_observations: []
required_observations_prose:
- 중단 요청 접수와 내부 실행 종료 시각, 참조·전송·자원 정리 기록
satisfied_if: 정한 기한 안에 작업이 중단되고 scheduler·worker 상태와 자원이 각 회수 조건에 맞게 정리된다. 내부 실행·자원의 회수 증거가 부족하면 해당 결과는 미확인으로 기록한다.
fail_criteria: 요구한 종료 기한 뒤에도 해당 작업·참조가 지속된다.
unknown_criteria: HTTP 취소 응답·집계 GPU 수치만 있고 해당 요청의 실제 종결을 모른다.
remediation: '- 취소·연결 종료·timeout을 해당 내부 실행의 중단과 scheduler·worker 상태 정리까지 전달한다. stop 문자열로 응답을 끝냈는데 Core 실행이 남아 있으면 중단을 전달한다. 엔진 장애 시에는 오류 전달과 실행 그룹·잔존 자원 정리를 확인한다. 계산·전송·참조별 종료를 관측하고 기한을 넘긴 작업의 추가 정리 절차를 마련한다.'
method_and_evidence: HTTP 종료·Core abort·finished ID·worker 행·KV 참조·GPU/전송 완료를 나눠 관측한다. 같은 취소 시험에서 늦은 출력과 새 요청/attempt의 귀속은 CHK-REQ-012로 따로 판정한다. 올바른 출력 폐기만으로 내부 실행·자원의 회수가 완료됐다고 처리하지 않는다. worker/그룹 실패의 잔여 자원 정리는 CHK-LIF-011에서 판정한다.
remaining_setup: 요청별 종결·회수 계측과 기한
