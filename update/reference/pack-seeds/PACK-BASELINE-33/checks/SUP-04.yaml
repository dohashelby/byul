id: SUP-04
framework_id: CHK-SUP-004
mechanism_ids:
- mechanism-08
revision: 3
retired: false
area: SUP
purpose: 승인 대상·출처 식별
secondary_purposes: []
question: 실제로 실행하는 이미지·패키지와 함께 설치되는 의존성도 모두 승인되어 있는가?
scope: null
risk_category: 보안 위협 점검
risk_summary: 이미지·패키지를 바꿀 수 있는 주체가 같은 태그·이름 아래 비승인 의존성을 넣어 엔진 권한으로 실행시킬 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  always: true
  prose: 엔진을 실행하는 모든 환경. 이미지·가상환경·패키지 중 실제 배포 방식을 기준으로 확인한다.
policy_params:
- key: approved_image_digests
  type: list[str]
  required: true
policy_prose:
  policy_to_decide: null
  enterprise_decisions: 모델·공급원·파일 목록·이미지 digest·패키지 판본·실제 TP 크기와 설정, 승인 식별 방식·역할·환경. 로컬 반입/직접 취득/마운트 중 실제 방식은 별도 선택한다.
normal_control: 승인 digest 이미지와 고정 패키지로 기동한다.
challenge_steps:
- 실제 image·entrypoint·패키지 수집
- 시험 사본에서 패키지 또는 entrypoint 한 항목 변경
- 배포 검사가 차이를 식별하는지 확인
required_observations:
- key: running_image_identity_verified
  type: bool
- key: running_image_repo_digest
  type: str
- key: running_image_approved
  type: bool
- key: running_image_unapproved
  type: bool
- key: supply_execution_scope_complete
  type: bool
- key: functional_probes_planned
  type: list[str]
- key: functional_probe_results
  type: dict[str, pass|fail|no_response]
required_observations_prose:
- 승인 manifest/실행 image digest/설치 패키지·entrypoint·마운트 덮어쓰기
satisfied_if: 승인 범위뿐 아니라 실제 실행 이미지·entrypoint·의존성의 일치까지 확인된다. 이미지 이름만으로 판정하지 않는다.
fail_criteria: 실행 코드 구성의 비승인 차이가 검사를 통과하고 사용된다.
unknown_criteria: 태그만 있거나 실행 중 패키지·마운트 변경을 확인할 수 없다.
remediation: '- 실제 배포 방식에 따라 이미지 digest 또는 가상환경·패키지·의존성 구성을 승인 묶음에 기록한다. 배포와 기동 시 실제 구성을 대조하고 승인하지 않은 차이를 처리한 뒤 사용한다.'
method_and_evidence: 이미지 digest·entrypoint·실제 설치 패키지 목록과 승인 묶음을 비교한다.
remaining_setup: 이미지 생성·배포 도구와 실행 코드 수집 방법 확정
executor: container_config
judge:
  plugin: rule_table
  params:
    declared_pass_ceiling: true
    pass_when_all: []
    fail_when_any:
    - obs: running_image_unapproved
      op: eq
      value: true
    axes:
      functional:
        pass_when_all:
        - obs: functional_probe_results
          op: nonempty
        - obs: functional_probe_results
          op: superset_of
          value_obs: functional_probes_planned
        - obs: functional_probe_results
          op: all_in
          value:
          - pass
        fail_when_any:
        - obs: functional_probe_results
          op: any_in
          value:
          - fail
legacy:
  q_ids:
  - Q-R05-02
  - Q-R05-04
  scenario_ids:
  - SC-10-03
  subtest_ids:
  - Q-R05-02/SC-10-03
source:
  array: supply_assessment_draft
collection_profile: running-image-approval-v1
functional_probes:
- method: POST
  path: /v1/completions
  body:
    model: '{model}'
    prompt: ping
    max_tokens: 1
  expect:
  - 200
  via: engine
limitations:
- running-image-approval-v1은 소유된 실행 컨테이너의 pinned RepoDigest 승인 분기만 확인한다. 패키지·native library·entrypoint·추가 마운트 전체 공급물 검증과 배포 차단 challenge는 미검증이므로 보안 PASS를 만들지 않는다.
- approved_image_digests는 repository@sha256:<64자리 소문자 hex> 목록이다. 빈 목록은 명시적인 승인 이미지 없음이며, 관측 결과나 ENV에서 승인값을 보충하지 않는다.
- 원문 package/entrypoint 변경·배포 검사 challenge는 미실행으로 보존한다. 정상 추론 관측이 pass여도 전체 challenge가 완결되지 않아 기능 PASS 관문이 보류될 수 있다.
- 이미지 metadata 수집 전후의 identity 안정성은 해당 수집 구간의 근거다. 정상 추론은 그 뒤 별도 관측하며 패키지 import나 모든 worker의 공급물 소비를 증명하지 않는다.
- 정책 승인값은 기업 신고이며 승인 주체·서명·증거 진위를 인증하지 않는다. tag-only·local image ID만 있거나 digest 연결·소유권·전후 identity가 불명확하면 UNKNOWN이다.
