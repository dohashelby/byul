id: PLT-02
framework_id: CHK-PLT-002
mechanism_ids:
- mechanism-01
revision: 4
retired: false
area: PLT
purpose: 실행 최소 권한
secondary_purposes: []
question: 같은 호스트의 내부 통신 접점에 허용된 프로세스만 접근하는가?
scope: 기본; 실제 namespace·UID·소켓·SHM
risk_category: 보안 위협 점검
risk_summary: 로컬 socket·SHM에 접근 가능한 비허용 프로세스가 제어 메시지나 자료를 주입·열람해 요청·모델 상태를 바꿀 수 있음. 채널별 실제 권한 확인 필요.
review_order: reference_baseline_first
impact: null
applies_when:
  always: true
  prose: API/core/worker가 실제 사용하는 로컬 IPC 경로와 접근 가능한 주체를 확인한다.
policy_params:
- key: protected_unix_paths
  type: list[str]
  required: true
- key: allowed_ipc_uids
  type: list[str]
  required: true
policy_prose:
  policy_to_decide: 허용 프로세스·IPC 경계
  enterprise_decisions: 계정·컨테이너·namespace·mount·device·socket/SHM 권한과 실제 필요 권한 예외. 초기 설치/장치 준비 권한과 지속 실행 권한을 분리한다.
normal_control: 승인 core·worker가 IPC를 통해 정상 요청을 수행한다.
challenge_steps:
- 실제 socket·shared memory·TCP IPC 목록 확보
- 비허용 시험 UID에서 연결·열기 시도
- 허용 주체와 비교
required_observations:
- key: unix_ipc_violations
  type: list[str]
- key: unix_ipc_trials
  type: list[dict]
- key: ipc_scope_complete
  type: bool
- key: functional_probes_planned
  type: list[str]
- key: functional_probe_results
  type: dict[str, pass|fail|no_response]
required_observations_prose:
- IPC 주소·소유자·mode/실제 process UID/연결·열기·작업 영향
satisfied_if: 비허용 프로세스의 제어 메시지가 소비되지 않는다.
fail_criteria: 비허용 주체가 보호해야 할 IPC 자료나 명령 접점에 접근한다.
unknown_criteria: 파일 mode만 확인하고 namespace·상위 디렉터리·실제 접속을 확인하지 못했다.
remediation: '- 로컬 socket·공유 메모리와 이를 생성하는 디렉터리의 소유자·권한을 제한한다. 허용 프로세스가 사용할 접점과 명령 범위를 확인하고 비허용 계정의 읽기·연결·명령 전달을 차단한다.'
method_and_evidence: '허용/비허용 시험 프로세스로 연결·메시지 수용을 대조하고 소켓·SHM 권한을 확보한다.<br><br>**vLLM v0.31.0 구현 메모:** 【F21】실제 RPC_BASE_PATH, socket/SHM 소유자·mode·mount namespace·접근 가능한 PID/UID를 수집; 현재 접근 가능성과 임의 명령 실행 효과를 분리. 허용 프로세스·동일 UID 비허용 프로세스·다른 UID 비허용 프로세스에서 채널별 연결과 무해 메시지 수용을 대조한다. OS 권한·namespace와 실제 소비 여부를 기록한다. 정상 대조: 허용 프로세스의 TP 요청 정상 처리와 채널별 연결/소비 기록 확보.'
remaining_setup: IPC 종류별 무해 연결 fixture; 임의 역직렬화 payload 없음
executor: unix_ipc
judge:
  plugin: rule_table
  params:
    declared_pass_ceiling: true
    pass_when_all: []
    fail_when_any:
    - obs: unix_ipc_violations
      op: nonempty
    axes:
      functional:
        pass_when_all: []
        fail_when_any: []
legacy:
  q_ids:
  - Q-C07
  - Q-C10
  scenario_ids:
  - SC-08-01
  subtest_ids:
  - Q-C07/SC-08-01
source:
  array: platform_assessment_draft
collection_profile: unix-ipc-access-v1
functional_probes:
- method: POST
  path: /v1/completions
  body:
    model: '{model}'
    prompt: ping
    max_tokens: 1
  expect:
  - 200
  via: engine
limitations:
- unix-ipc-access-v1은 명시한 Linux 파일시스템 Unix SOCK_STREAM의 비허용 숫자 UID 연결을 payload 없이 관측한다. 같은 namespace의 endpoint inode·소유 PID/UID/start와 SO_PEERCRED를 전후 대조할 때만 연결 위반 후보를 만든다.
- protected_unix_paths와 allowed_ipc_uids는 명시 정책이며 실행 설정 probe_uids에는 허용/비허용 시험 UID가 필요하다. 관측한 owner나 실행 UID로 허용 목록을 보충하지 않는다.
- 실제 IPC 전체 inventory·SHM·TCP·추상 Unix 주소·동일 UID 비허용 프로세스·명령 소비·TP는 미시험이며 보안·기능 PASS 규칙은 없다. 연결 성공과 메시지 소비·임의 명령 실행은 다르다.
- symlink·소유권/namespace 변경·peer 연결 불일치·source 수집 실패·metadata 권한 부족은 UNKNOWN이다. 연결 거부·timeout만으로 전체 IPC 보호를 확정하지 않는다.
- 컨테이너는 이번 guard.run의 명시된 pinned 대상이어야 한다. helper는 소유 컨테이너 내부에서만 실행하고 연결을 닫으며 payload·SHM 읽기·역직렬화를 수행하지 않는다.
