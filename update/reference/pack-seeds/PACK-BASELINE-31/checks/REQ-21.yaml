- mechanism-16
revision: 3
retired: false
area: REQ
purpose: 실행 상태·버퍼 수명
secondary_purposes: []
question: TP의 GPU 작업 재실행에 사용하는 통신 버퍼가 등록·종료·재기동 후에도 현재 실행의 유효한 버퍼를 참조하는가?
scope: 조건부
risk_category: 보안 위협·일반 장애 함께 점검
risk_summary: 요청·종료·재기동 중 buffer 수명 관리 오류가 있으면 잘못된 참조로 결과 오염·장애가 생길 수 있음. 일반 호출자의 유발 능력과 자료 노출은 별도 확인.
review_order: implementation_path_first
impact: null
applies_when:
  prose: TP의 실제 graph/communicator buffer 등록·참조 경로가 선택될 때 적용한다. 일반 TP 통신 점검은 별도로 유지한다.
policy_params: []
policy_prose:
  policy_to_decide: 허용 peer·참조 수명·종료 조건
  enterprise_decisions: 지원 GPU·runner·mode·shape/입력 범위, 정상 대조 방식·수치 오차·성능·장애 처리 기준과 실제 peer. 범위 밖 접근·타 요청 혼입·유출은 정책이나 허용 수치 오차로 완화할 수 없다.
normal_control: 정상 TP graph 등록·실행·종료 후 새 기동이 성공한다.
challenge_steps:
- 등록→실행 기준선
- 제한된 종료·재기동 반복
- 새 세대의 buffer 등록·참조·정리 대조
required_observations: []
required_observations_prose:
- rank·process generation/등록 handle·buffer 범위/graph 완료·해제·재등록
satisfied_if: 등록된 버퍼가 현재 실행·소유자와 일치하고, 다른 실행의 버퍼나 해제된 버퍼를 사용하지 않는다. GPU 작업 완료와 graph·통신기의 참조 해제는 기록·계측으로 확인한다.
fail_criteria: 종료된 세대의 잘못된 참조 사용이나 미해제로 다음 기동·자료 귀속이 깨진다.
unknown_criteria: native 통신의 실제 참조 수명·해제 효과를 계측하지 못했다.
remediation: '- TP graph 통신 buffer의 등록 정보·소유자·실행 세대를 관리한다. graph·통신기가 더 이상 해당 buffer를 참조하지 않고 관련 GPU 연산이 모두 끝난 뒤 참조를 해제한다. 종료·재기동 때 이전 등록 정보를 정리하고 새 실행에 유효한 참조만 사용한다.'
method_and_evidence: 선정 TP graph/communicator의 rank·process 세대마다 buffer/IPC handle 등록·교환·소비·GPU 완료·참조 해제·재등록 순서를 확인한다. 종료·재기동 뒤 현재 세대·소유자·유효 범위의 참조만 사용하는지 정상 TP graph 실행과 대조한다. CUDA Graph caller의 입력 갱신·출력 소비는 CHK-REQ-020에서, 그룹의 회수 기한·잔존 자원·후속 정상 기동은 CHK-LIF-011에서 별도로 판정하며 같은 native 수명 관측을 공유한다.
remaining_setup: 선정 통신 backend·native 계측·격리 재기동 fixture
