executor: request_termination
collection_profile: kubernetes-automatic-retry-record-observation-v1
policy_params:
- key: retry_scope_sha256
  type: str
  required: true
- key: retry_policy_sha256
  type: str
  required: true
- key: retry_record_source_sha256
  type: str
  required: true
- key: retry_session
  type: str
  required: true
- key: retry_policy_mode
  type: str
  required: true
- key: retry_max_record_delay_ms
  type: int
  required: true
required_observations:
- key: activation_steps
  type: list
- key: activation_violations
  type: list
- key: activation_missing
  type: list
- key: activation_scope_complete
  type: bool
judge:
  plugin: rule_table
  params:
    pass_when_all:
    - obs: activation_scope_complete
      op: eq
      value: true
    - obs: activation_violations
      op: empty
    fail_when_any:
    - obs: activation_violations
      op: nonempty

impact: MEDIUM
