id: OBS-06
revision: 1
retired: false
area: OBS
purpose: 자료 이용 권한
secondary_purposes: []
question: 기록과 진단 사본을 허용된 독자만 조회·반출하는가?
scope: 기본 저장 기록; 진단 기능별 선택
risk_category: 보안 위협 점검
risk_summary: 기록 저장소·사본에 접근 가능한 비허용 주체가 진단 본문·식별정보·자격을 조회·반출할 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 기본 저장 기록; 진단 기능별 선택
policy_params: []
policy_prose:
  policy_to_decide: 자료별 독자·반출 목적·범위
  enterprise_decisions: 자료별 독자·반출 목적·범위·승인, 진단 실행 역할·격리 환경과 parser/입력 신뢰 범위.
normal_control: 승인 독자는 시험 로그·진단 사본을 필요한 범위에서 읽는다.
challenge_steps:
- 원본·collector·backup 위치 확보
- 비허용 독자 계정으로 조회·다운로드
- 허용 독자와 결과 비교
required_observations: []
required_observations_prose:
- 사본별 ACL·owner
- 실제 reader identity
- 조회·반출 감사 결과
satisfied_if: 허용 밖 조회·반출이 거부된다.
fail_criteria: 비허용 독자가 기록 원본이나 사본을 읽거나 반출한다.
unknown_criteria: 수집기 권한만 확인하고 로컬 원본·backup 접근을 확인하지 못했다.
remediation: 필드 최소화·권한/보존·opt-out·송신통제·수집장애 표시를 실제 경로에 적용한다
method_and_evidence: '역할별 조회·다운로드·sink 접근과 로컬 파일권한을 대조한다. 기본 엔진 예외 로그와 선택 debug 사본에 대해 허용 독자·비허용 사용자 계정으로 읽기·반출을 비교한다. 로컬 원본과 collector 이후 사본을 모두 확인한다. Tensor shape/anon_repr 정제와 원문 필드를 구분하며 수집기 필터만으로 로컬 원본까지 보호됐다고 판정하지 않는다. 【F26】예외 dump는 기본 검토, debug response/output 로그는 설정별 확인; dump가 언제나 전체 프롬프트를 노출한다는 주장은 금지. 고유한 무해 시험 표식을 넣은 정상 요청과 안전하게 유도한 오류를 각각 실행하고 활성 로그·진단 사본의 필드를 대조한다. 정상 대조: 고유 시험 표식을 정상 요청·안전한 주입 예외에 넣고 각각 수집본/회전파일에서 허용 필드 확인.'
remaining_setup: 자료별 독자·반출 범위와 시험 계정
