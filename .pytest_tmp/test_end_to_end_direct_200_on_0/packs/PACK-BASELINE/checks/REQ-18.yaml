id: REQ-18
revision: 1
retired: false
area: REQ
purpose: 실행 상태·메모리 안전
secondary_purposes: []
question: 배치 자리 이동·재사용 시 이전 요청의 제한 상태가 남지 않는가?
scope: 선정 runner를 먼저 확인. V1 condense CPU mask 할당 분기에만 기존 mask 시험 적용; V2는 별도 입력·상태 경로
risk_category: 보안 위협·일반 장애 함께 점검
risk_summary: 호출자가 배치 자리 재사용 조건을 유발할 때 이전 요청의 제한 상태가 남으면 자기 요청의 제한을 벗어나거나 타 요청 결과를 바꿀 수 있음.
review_order: implementation_path_first
impact: null
applies_when:
  prose: 선정 runner를 먼저 확인. V1 condense CPU mask 할당 분기에만 기존 mask 시험 적용; V2는 별도 입력·상태 경로
policy_params: []
policy_prose:
  policy_to_decide: 요청별 제한 의미·정상 대조
  enterprise_decisions: 지원 GPU·runner·mode·shape/입력 범위, 정상 대조 방식·수치 오차·성능·장애 처리 기준과 실제 peer. 범위 밖 접근·타 요청 혼입·유출은 정책이나 허용 수치 오차로 완화할 수 없다.
normal_control: 서로 다른 sampling 제한의 A·B 요청을 새 slot에서 처리한다. 실제 V1이면 condense mask 분기, V2이면 slot/count 갱신 분기를 적용한다.
challenge_steps:
- 활성 runner 확인
- A 종료 후 B가 같은 slot 사용하도록 작은 배치 실행
- B의 실제 제한 상태와 출력 대조
required_observations: []
required_observations_prose:
- V1/V2 runner
- slot·생성 세대
- mask·count·bias staged write·출력
satisfied_if: 다른 요청의 mask·sampling 제한을 상속하지 않는다.
fail_criteria: A의 제한 상태가 B에 남거나 B의 현행 상태가 누락되어 출력이 달라진다.
unknown_criteria: slot 재사용 또는 해당 runner 상태 갱신을 계측하지 못했다.
remediation: 상태 이동과 초기화를 실제 sampling 소비까지 연결한다.
method_and_evidence: 요청 ID·slot·mask 이동/초기화를 관측하고 제한/비제한 요청의 단독 정상 결과와 비교한다. V2는 실제 동등 경로를 확인한다. 기동 config와 실제 runner를 기록한다. V1은 제한 요청 A 종료·배치 이동 후 요청 B의 mask를 정상 B와 비교한다. V2이면 V1 시험을 대신 적용하지 않고 별도 slot 재사용·count/flag 갱신 시험을 사용한다. GPU 실행은 미실행이다.
remaining_setup: V1 CPU mask와 V2 상태 배열을 따로 계측; 무제한 B 대조 포함
