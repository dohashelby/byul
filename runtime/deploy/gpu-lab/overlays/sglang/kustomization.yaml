# SGLang v0.5.21 on the same GPU, run after vLLM (never both at once; plan §3.5).
# Render: kubectl kustomize deploy/gpu-lab/overlays/sglang
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: serving-lab
resources:
  - ../../base
  - engine.yaml
  - backend-config.yaml
images:
  # The management listener sidecar runs the Gateway image (same package).
  - name: serving-gateway
    newName: REPLACE-REGISTRY/serving-gateway
    digest: sha256:REPLACE_WITH_GATEWAY_IMAGE_DIGEST
  - name: serving-engine-sglang
    newName: lmsysorg/sglang
    digest: sha256:REPLACE_WITH_SGLANG_V0_5_21_DIGEST
patches:
  # The Gateway backend kind must match the engine.
  - target: {kind: Deployment, name: serving-gateway}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args/2
        value: sglang
