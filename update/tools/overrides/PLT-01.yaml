# PLT-01 구조화: 엔진·worker가 불필요한 호스트·파일·장치 권한을 갖지 않는가? (컨테이너 실제 실행 구성)
# 판단 기준은 정책 허용 목록이다: 허용 목록 밖 권한·마운트·장치가 실제 실행 구성에 있으면 FAIL (DECISIONS Step 3)
applies_when: { always: true }
policy_params:
  - { key: allowed_capabilities, type: "list[str]", required: true }   # 유효 capability 허용 목록(예: [])
  - { key: allowed_mounts, type: "list[str]", required: true }         # "목적지:모드" 허용 목록(예: ["/models:ro"])
  - { key: allowed_devices, type: "list[str]", required: true }        # "호스트:컨테이너:권한" 허용 목록(예: [])
  - { key: require_non_root, type: bool, required: true }              # 컨테이너 안 프로세스가 UID 0이면 안 되는가
  - { key: allowed_exec_writable_paths, type: "list[str]", required: true }   # 쓰기+실행 가능 마운트 허용 목록(예: ["/guard-cache"])
required_observations:
  - { key: permission_scan_complete, type: bool }
  - { key: process_scan_complete, type: bool }
  - { key: capabilities_effective, type: "list[str]" }   # 컨테이너 안 모든 프로세스 CapEff 합집합
  - { key: mounts, type: "list[str]" }                   # bind·volume 마운트 "목적지:ro|rw" (tmpfs 제외, 증거에만)
  - { key: devices, type: "list[str]" }
  - { key: privileged, type: bool }
  - { key: host_namespaces, type: "list[str]" }          # 호스트와 공유하는 namespace(pid·ipc·net·uts)
  - { key: root_uid_present, type: bool }
  - { key: sentinel_results, type: "dict[str, denied|succeeded|absent|error]" }   # 호스트 자원(마운트) 쓰기 시도
  - { key: exec_writable_mounts, type: "list[str]" }     # 컨테이너 사용자가 실제로 쓸 수 있고 noexec가 아닌 마운트
  - { key: functional_probes_planned, type: "list[str]" }
  - { key: functional_probe_results, type: "dict[str, pass|fail|no_response]" }
executor: container_config
judge:
  plugin: rule_table
  params:
    pass_when_all:
      - { obs: permission_scan_complete, op: eq, value: true }
      - { obs: process_scan_complete, op: eq, value: true }
      - { obs: capabilities_effective, op: subset_of, value_policy: allowed_capabilities }
      - { obs: mounts, op: subset_of, value_policy: allowed_mounts }
      - { obs: devices, op: subset_of, value_policy: allowed_devices }
      - { obs: privileged, op: eq, value: false }
      - { obs: host_namespaces, op: subset_of, value: [] }
      - { obs: root_uid_present, op: eq, value: false, when_policy: require_non_root }
      - { obs: sentinel_results, op: all_in, value: [denied, absent] }
      - { obs: exec_writable_mounts, op: subset_of, value_policy: allowed_exec_writable_paths }
    fail_when_any:
      - { obs: capabilities_effective, op: not_subset_of, value_policy: allowed_capabilities }
      - { obs: mounts, op: not_subset_of, value_policy: allowed_mounts }
      - { obs: devices, op: not_subset_of, value_policy: allowed_devices }
      - { obs: privileged, op: eq, value: true }
      - { obs: host_namespaces, op: nonempty }
      - { obs: root_uid_present, op: eq, value: true, when_policy: require_non_root }
      - { obs: sentinel_results, op: any_in, value: [succeeded] }
      - { obs: exec_writable_mounts, op: not_subset_of, value_policy: allowed_exec_writable_paths }
    axes:
      functional:   # 정상 로딩·추론 유지 (REQ-01·03과 같은 표)
        pass_when_all:
          - { obs: functional_probe_results, op: nonempty }
          - { obs: functional_probe_results, op: superset_of, value_obs: functional_probes_planned }
          - { obs: functional_probe_results, op: all_in, value: [pass] }
        fail_when_any:
          - { obs: functional_probe_results, op: any_in, value: [fail] }
functional_probes:
  - method: POST
    path: /v1/completions
    body: { model: "{model}", prompt: ping, max_tokens: 1 }
    expect: [200]
    via: engine
limitations:
  - "실행 가능한 쓰기 경로 {len:allowed_exec_writable_paths}개가 정책으로 허용됨 {allowed_exec_writable_paths} — 엔진 컴파일 캐시(torch inductor .so)를 위해 쓰기·실행이 모두 가능한 영역이 필요하다."
  - "이 점검은 컨테이너 설정(docker inspect)과 컨테이너 안 프로세스 권한만 본다. 호스트·VM 쪽 집행(LSM 정책, 호스트 파일 권한)은 보지 않으며, 실험실 결과는 Docker Desktop의 리눅스 VM 기준이다."
