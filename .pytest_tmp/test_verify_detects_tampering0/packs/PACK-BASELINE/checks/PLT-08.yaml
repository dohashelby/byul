id: PLT-08
revision: 1
retired: false
area: PLT
purpose: 상대 확인·전송 보호
secondary_purposes: []
question: 각 내부 통신 구간이 정한 상대 확인·기밀성·무결성을 충족하는가?
scope: 기본 IPC/TP; 다중 노드·PP는 선택
risk_category: 보안 위협 점검
risk_summary: 내부 통신에 접근 가능한 비허용 주체가 peer를 사칭하거나 전송을 읽고 바꿔 요청 자료 유출·계산 오염·작업 중단을 일으킬 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 기본 IPC/TP; 다중 노드·PP는 선택
policy_params: []
policy_prose:
  policy_to_decide: 구간별 위협 주체·자료 민감도·보호 수준
  enterprise_decisions: 구간별 배치·자료·위협 주체, TLS/상대 확인·자격 방식, 내부 IPC 보호 전제와 예외. 다중 노드는 선택 시 별도 검토한다.
normal_control: 선정 TP 통신 구간에서 승인한 rank 간 처리가 정상 완료된다.
challenge_steps:
- 구간별 상대·전송 보호 계약 수집
- 비허용 peer·무해 변조를 지원 시험기로 제한 시도
- 거부와 정상 통신 확인
required_observations: []
required_observations_prose:
- 구간·transport·peer
- 인증·암호화 설정
- 연결·무결성 결과
satisfied_if: 구간별 채택 요구가 증거로 확인된다. NCCL 선택만으로 인증·암호화를 충족 처리하지 않는다.
fail_criteria: 보호가 요구된 구간에서 비허용 상대나 변조 자료가 수용된다.
unknown_criteria: NCCL 등 실제 transport·peer 확인이나 암호화 종단을 확인하지 못했다.
remediation: 각 실제 hop의 접근권·상대 검증·송신 제한을 적용한다
method_and_evidence: '제어 SHM/socket·overflow·collective·PP를 구분해 실제 peer·transport·접근권·보호를 확인한다. 각 속성별 결과를 남긴다. 【F21】실제 RPC_BASE_PATH, socket/SHM 소유자·mode·mount namespace·접근 가능한 PID/UID를 수집; 현재 접근 가능성과 임의 명령 실행 효과를 분리. 허용 프로세스·동일 UID 비허용 프로세스·다른 UID 비허용 프로세스에서 채널별 연결과 무해 메시지 수용을 대조한다. OS 권한·namespace와 실제 소비 여부를 기록한다. 정상 대조: 허용 프로세스의 TP 요청 정상 처리와 채널별 연결/소비 기록 확보.'
remaining_setup: 구간별 보호 요구·시험 지원 여부; 로컬 IPC와 네트워크를 별도 판정
