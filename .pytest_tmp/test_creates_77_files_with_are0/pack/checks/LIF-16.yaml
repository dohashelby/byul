id: LIF-16
revision: 1
retired: false
area: LIF
purpose: 복구 상태의 적합성
secondary_purposes: []
question: 복원 자료의 변조와 잔존 상태가 복구 결과에 섞이지 않는가?
scope: 백업 사용 시; 특수 snapshot은 선택
risk_category: 보안 위협·일반 장애 함께 점검
risk_summary: backup 변경권자가 복원 자료를 변조해 비승인 모델·코드·설정을 적용시킬 수 있음. 선택 snapshot은 승인 밖 모델 재사용·검증 전 요청 수용을 점검하며, 정상 생성의 API key 복원을 전제하지 않음.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 백업 사용 시; 특수 snapshot은 선택
policy_params: []
policy_prose:
  policy_to_decide: 복원 검증·정리 범위·재개 조건·복원 객체별 책임/증거·현재 정책 재적용
  enterprise_decisions: 복원 대상 보존·digest/식별, 외부 설정별 복원 책임·GitOps 재조정, 재개 근거. 긴급 권한 부여가 공급물 필수 위반·증거 부족을 예외 통과시키지 않도록 한다.
normal_control: '기본 재배포: 승인된 백업·설정·자격 참조·volume·Gateway 상태를 실제 배포 구성에 맞게 복원하고 정상 요청을 처리한다. 선택 snapshot: 생성 제한을 만족한 승인 자료로 재로딩·oracle·외부 gate 시험을 수행한다.'
challenge_steps:
- '기본: 실제 사용하는 백업·설정 저장소(ConfigMap/Secret 사용 시 포함)·volume·Gateway의 복원 대상과 현재 승인을 기록한다.'
- '기본: 격리 사본의 파일 또는 설정에 무해 변경/누락을 하나 주입하고 소비 전 거부와 실패 후 외부 접수 제한을 확인한다.'
- '기본: 승인 원본으로 복구한 뒤 정상 요청과 잔존 접근·사본 상태를 비교한다.'
- 선택 snapshot은 별도 TP1 지원 구성에서 재로딩 파일·generated-cache fingerprint·1토큰 oracle·외부 gate 순서를 시험한다.
required_observations: []
required_observations_prose:
- 복원 전후 승인 자료·설정·자격 참조
- 실제 파일/설정 소비·외부 접수·정상 요청
- 사본과 잔존 접근
- snapshot 지원 조건·생성 거부 근거
- snapshot 및 다시 읽는 모델·설정 파일 digest
- oracle·listener·외부 gate 시각과 실제 요청
satisfied_if: 비승인 복원물을 거부하고 검증 전 서비스하지 않는다.
fail_criteria: 비승인 재읽기 파일이 수용되거나 필수 검증 전에 외부 요청을 허용한다. 지원 제약을 우회한 실험은 정상 복원 판정과 분리한다.
unknown_criteria: 1토큰 oracle만 통과했거나 전체 파일 일치·외부 gate를 확인하지 못했다. 정상 생성 경로에서 옛 API key 복원을 전제하지 않는다.
remediation: 복원 묶음 재승인·사본 목록·자산 소유자별 삭제/철회와 재개 검증을 둔다 승인 인계·수용 차단·실제 준비 확인을 배포 도구에 구현한다 불변 객체·쓰기 제한·소비 전 검증 중 실제 경로에 맞는 조합을 적용한다
method_and_evidence: 합성 백업 변경·복원 순서·잔존 cache/작업·접수 gate·정상 요청을 대조한다. snapshot 경로는 별도로 조사한다. 배포 template, 외부 ConfigMap/Secret 값, volume, Gateway/IAM 정책의 복원 단위를 따로 확인한다. snapshot은 메모리·환경 자격 사본을 포함하는지 확인하며 manifest 마스킹만으로 비밀 제거를 판정하지 않는다. 정상 snapshot create는 API key·TLS·middleware 및 TP>1을 거부한다. 별도 단일 GPU 선택환경에서 현재 승인 model/revision·실제 재로딩 파일과 snapshot을 대조하고 listener·oracle·외부 gate 시각을 확인한다. 옛 API key 복원을 정상 생성 경로의 시험 전제로 쓰지 않는다.
remaining_setup: 실제 사용하는 백업·설정·자격·volume·Gateway 복원 대상과 승인 기준, 무해 변경 fixture·실제 소비 계측. snapshot을 선택하면 추가로 지원 플랫폼·CRIU·단일 GPU·외부 gate 준비.
