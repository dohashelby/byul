# Strategic merge patch for the AWS bundle's serving-engine Deployment. It
# only adds the read-only management listener sidecar; the bundle's engine
# container, UID 2000:0, RuntimeClass nvidia and volumes stay unchanged.
#
#   kubectl --context byul-aws-lab -n serving-lab patch deployment serving-engine \
#     --type strategic --patch-file deploy/gpu-lab/engine-management-sidecar.patch.yaml
#
# Replace REPLACE_GATEWAY_TAG first (same image as the Gateway). The bundle's
# 03-engine-smoke.sh re-applies its engine.yaml and drops this patch; apply it
# again after each 03 run, or ask the environment owner to add the container to
# engine.yaml.template (README.md).
#
# The sidecar requests no GPU. It runs under the Pod's RuntimeClass nvidia, but
# the device plugin injects GPU devices only into the container that requests
# nvidia.com/gpu.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serving-engine
spec:
  template:
    spec:
      containers:
        - name: management-listener
          image: serving-gateway:REPLACE_GATEWAY_TAG
          imagePullPolicy: Never
          args:
            - management-listener
            - --listen-host
            - 0.0.0.0
            - --listen-port
            - "8001"
            - --engine-url
            - http://127.0.0.1:8000
          ports:
            - {name: management, containerPort: 8001}
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: "50m", memory: 64Mi}
            limits: {cpu: "200m", memory: 128Mi}
