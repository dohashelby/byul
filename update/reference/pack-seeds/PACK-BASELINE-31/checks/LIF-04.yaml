revision: 3
retired: false
area: LIF
purpose: 자원 예산·공정성
secondary_purposes: []
question: 응답을 느리게 읽는 연결과 진단용 버퍼가 자원을 과도하게 차지하지 않는가?
scope: SSE 기본; response debug는 활성 시
risk_category: 보안 위협 점검
risk_summary: 느리게 응답을 읽거나 큰 응답을 유도하는 호출자가 연결·buffer를 오래 점유해 메모리와 다른 요청의 처리 기회를 소모할 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 스트리밍 수신 지연·연결 종료를 확인한다. response debug buffering은 실제 활성 route에서 추가한다.
policy_params: []
policy_prose:
  policy_to_decide: 출력 대기·buffer 한도·timeout
  enterprise_decisions: 모델·GPU·부하·공정성·정상 기능/성능 요구, 초과 시 거부/중단/정리 방식, 취득 retry 허용과 부분 자료 처리.
normal_control: 정상 수신 속도와 허용 진단 설정에서 메모리가 안정적이다.
challenge_steps:
- 작은 stream 하나의 읽기만 지연
- 허용된 debug buffering 조건 비교
- 메모리·backpressure·종결 관측
required_observations: []
required_observations_prose:
- 연결별 전송량/host·buffer 비용/연결 종료 후 회수
satisfied_if: 대기·buffer 비용이 한도 안에 있고 종료 뒤 정리된다.
fail_criteria: 느린 연결·진단이 정한 메모리·시간 예산을 넘겨 자원을 유지한다.
unknown_criteria: buffer별 비용·회수 또는 허용 예산을 알 수 없다.
remediation: '- 느린 수신자의 출력 buffer·보존 시간·전송 기한을 제한하고 필요할 때 역압력·취소를 적용한다. 사용하지 않는 진단 buffering을 끄고 활성 기능의 메모리 예산과 정리 시점을 관리한다.'
method_and_evidence: 느린 스트림 읽기·연결 종료·debug 옵션에서 출력 대기·메모리·후속 정상 요청을 관측한다. 이 항목은 전송 중 대기·buffer 비용과 종료 뒤 해당 buffer 정리를 판정한다. 같은 연결 종료에서 내부 요청 실행·KV·전송 참조의 기한 내 종결은 CHK-LIF-010에서, debug 자료의 허용 필드는 CHK-OBS-003에서 따로 판정한다.
remaining_setup: 수신 지연 제어기·진단 활성 조건·메모리 상한
