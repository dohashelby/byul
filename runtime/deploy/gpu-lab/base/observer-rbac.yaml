# Observer: read Pods in this namespace only (target registration snapshots).
# No write verbs, no Secrets, no cluster-wide access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: serving-observer-read
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: serving-observer-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: serving-observer-read
subjects:
  - kind: ServiceAccount
    name: serving-observer
    namespace: serving-lab
