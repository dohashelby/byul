revision: 2
retired: false
area: LIF
purpose: 종결·자원 회수
framework_purpose: 종결·자원 회수
mechanism_ids:
- mechanism-13
secondary_purposes: []
question: 성능 진단 종료 응답과 실제 수집·자원 사용의 종료가 일치하는가?
scope: 조건부; 선정 profiler
risk_category: 일반 장애·복구 점검
risk_summary: profiler 종료 실패를 완료로 판단하면 수집·파일 기록·자원 사용이 계속될 수 있음. 비허용 호출·민감정보 수집 여부는 별도 보안 점검.
review_order: conditional_when_selected
impact: null
applies_when:
  prose: profiler의 실제 활성·등록 route·backend 종료 경로가 있을 때 적용한다. 비사용 기능은 등록·도달성을 확인한 뒤 제외한다.
policy_params: []
policy_prose:
  policy_to_decide: 종료 대상·기한·미완료 표시
  enterprise_decisions: 요청별/그룹별 회수 대상·잔존 참조·강제 종료·중복 비용 처리. 공유 weights/profiler/retry는 기능 선택 후 별도 수명·종료 계약을 확인한다.
normal_control: 허용된 진단을 시작·종료하면 해당 backend의 수집·산출/전송이 종료 계약에 맞게 마무리된다.
challenge_steps:
- 짧은 정상 진단을 실행하고 실제 수집 확인
- 종료 호출 후 backend의 수집·산출/전송 완료와 자원 상태 대조
- 별도 격리 실행에서 종료 오류를 주입하고 실제 실패 상태·다음 시작 가능 여부 확인
required_observations: []
required_observations_prose:
- 진단 backend·종료 계약, 종료 API/명령 결과·경고와 실행 주체별 실제 수집 상태
- backend가 사용하는 파일·스트림·원격 수신 등 산출 방식의 완료/계속 수집 여부와 자원·다음 시작 상태
satisfied_if: 선정 backend의 종료 계약을 충족한다. 모든 backend에 파일 생성을 강제하지 않는다.
fail_criteria: 종료 성공 표시 뒤 수집이 계속되거나 종료 실패를 성공으로 기록한다.
unknown_criteria: API 200만 있고 실제 수집 종료·파일 상태를 확인하지 못했다.
remediation: '- profiler의 시작·종료 요청과 실제 수집·출력·자원 정리 상태를 각각 기록한다. 종료 실패·지연을 성공으로 보고하지 않고 정한 기한 내 수집 중단·잔여 자원 정리를 확인한다.'
method_and_evidence: 선정 진단 backend의 시작·수집·종료 계약과 산출 방식을 확인한다. 종료 응답·경고·실제 수집 상태·해당 산출물/전송·자원 사용과 다음 시작 가능 여부를 대조한다.
remaining_setup: 짧은 profile fixture·오류 주입·종료 기한
