judge:
  plugin: rule_table
  params:
    pass_when_all:
    - obs: state_scope_complete
      op: eq
      value: true
    - obs: independent_worker_state_verified
      op: eq
      value: true
    - obs: state_semantics_verified
      op: eq
      value: true
    - obs: state_collection_scope_complete
      op: eq
      value: true
    - obs: state_conflict_candidates
      op: empty
    fail_when_any: []
