id: OBS-08
revision: 2
retired: false
area: OBS
purpose: 자료 이용 권한
secondary_purposes: []
question: 재실행이 변조한 진단 자료를 비허용 방식으로 소비하지 않는가?
scope: 조건부; replay parser
risk_category: 보안 위협 점검
risk_summary: 진단 파일 변경권자가 변조 자료를 승인된 고권한 replay reader에 읽혀 허용 밖 코드 실행·자료 접근을 유도할 수 있음. 실제 consumer 확인 필요.
review_order: conditional_when_selected
impact: null
applies_when:
  prose: 조건부; replay parser
policy_params:
- key: replay_allowed
  type: bool
  required: true
policy_prose:
  policy_to_decide: 자료 신뢰·실행 범위
  enterprise_decisions: 자료별 독자·반출 목적·범위·승인, 진단 실행 역할·격리 환경과 parser/입력 신뢰 범위.
normal_control: 승인 출처의 합성 진단 자료가 허용 reader로 처리된다.
challenge_steps:
- 별도 사본에 무해 구조·출처 표식 변경
- replay consumer로 제출
- 검증·reader·부수 접근 확인
required_observations: []
required_observations_prose:
- 자료 출처·digest
- parser·reader 선택
- 거부·부수 접근
satisfied_if: 비허용 자료 실행·고권한 부수 동작을 막는다. 공급물 해석 점검과 증거를 공유한다.
fail_criteria: 비승인 자료를 허용 밖 reader로 해석하거나 금지 부수 동작이 발생한다.
unknown_criteria: 외부 consumer·입력형식·실제 reader를 알 수 없다.
remediation: 필드 최소화·권한/보존·opt-out·송신통제·수집장애 표시를 실제 경로에 적용한다 소비 경로별 허용 목록과 실행 권한을 제한하고 필요 없는 확장을 비활성화한다 필요 형식만 허용하고 reader/의존성을 고정·수정하며 소비 프로세스 권한을 줄인다
method_and_evidence: '자료 변경권과 실행권을 나누고 무해 변조 표식·출처 검사·parser 권한을 확인한다. 【F24】진단 파일을 외부 도구가 읽어 재실행/역직렬화하는 consumer가 실제 배치될 때. 참조구성은 비사용. 외부 replay 도구 존재·실행계정·입력형식·reader를 먼저 확인. 있으면 읽기권만 가진 계정의 실행 시도, 변조한 무해 진단 fixture 소비를 확인. 정상 대조: 승인된 reader/실행 역할이 정상 자료를 제한 권한으로 처리.'
remaining_setup: 기본 비사용; reader 안전성 Q-R05-07과 연결하되 권한 Q-C11도 별도 판정
executor: null
judge: null
legacy:
  q_ids:
  - Q-C11
  - Q-R05-05
  - Q-R05-07
  scenario_ids:
  - SC-21-04
  subtest_ids:
  - Q-C11/SC-21-04
source:
  array: observability_assessment_draft
limitations:
- replay_allowed={replay_allowed}은 이 점검 범위의 기업 정책 신고다. false는 consumer 미배포·미도달의 증거가 아니고 true는 안전한 parser·자료 신뢰·실행 범위의 증명이 아니다. 정책값만으로 비적용·PASS를 만들지 않는다.
- 자료 출처·parser/reader·거부·부수 동작의 수동 근거가 별도로 필요하다. 점검별 값은 자동 복사하지 않으며 공유 정책의 범위·일관성·승인은 별도 업무 검토가 필요하다.
