id: REQ-09
framework_id: CHK-REQ-009
mechanism_ids:
- mechanism-03
revision: 7
retired: false
area: REQ
purpose: 최종 입력 검증
secondary_purposes: []
question: 토큰 번호와 입력 길이가 실제 모델과 처리 단계에서 허용하는 범위 안에 있는가?
scope: 기본+선정 입력
risk_category: 보안 위협·일반 장애 함께 점검
risk_summary: 호출자가 범위 밖 token ID·길이를 제출해 예외·잘못된 계산을 유발할 수 있음. 공유 엔진 중단·타 요청 피해는 실제 경로와 영향 확인 필요.
review_order: reference_baseline_first
impact: null
applies_when:
  always: true
  prose: 활성 입력 endpoint의 token·길이·변환 후 값을 선정 모델·runner 기준으로 확인한다.
policy_params:
- key: max_input_tokens
  type: int
  required: true
- key: rejection_codes
  type: list[str]
  required: true
- key: allowed_endpoints
  type: list[str]
  required: true
- key: allowed_input_formats
  type: list[str]
  required: true
policy_prose:
  policy_to_decide: 서비스 입력 한도; 구현상 유효 범위는 코드 근거로 확정
  enterprise_decisions: 허용 endpoint·텍스트/직접 token 등 입력 형식, template override 필요성, 옵션·길이·출력 한도·정상 대조 입력. vocab·버퍼 범위·옵션 필수 관계 등 구현상 제약은 기업 정책으로 완화하지 않는다.
normal_control: 선정 tokenizer·모델의 유효 ID와 길이 경계 안 요청이 정상 처리된다.
challenge_steps:
- 정상 token-array 대조 후 범위 밖 token ID 시험
- 길이 한도 밖 시험과 후속 정상 대조
required_observations:
- key: accepted_challenges
  type: list[str]
- key: challenge_outcomes
  type: dict[str, outcome]
- key: challenges_planned
  type: list[str]
- key: functional_probes_planned
  type: list[str]
- key: functional_probe_results
  type: dict[str, outcome]
- key: input_endpoints_tested
  type: list[str]
- key: input_formats_tested
  type: list[str]
- key: challenge_rejection_results
  type: dict[str, outcome]
- key: challenge_consumption
  type: dict[str, outcome]
- key: confirmed_input_violations
  type: list[str]
required_observations_prose:
- 모델 vocab·처리 단계별 유효 범위와 입력 제한·집행 위치, 허용된 절단·변환 조건
- 제출값·변환값·실제 소비값과 거부 기록, 메모리 오류·상태·후속 정상 요청 결과
satisfied_if: 채택한 입력 제한과 실제 소비자의 유효 범위를 각 집행 위치에서 지키고 정상 입력은 처리된다. 절단·변환을 허용한 경우에는 채택한 방식과 시점에 맞게 제한한 값만 소비된다.
fail_criteria: 채택한 입력 제한이나 실제 소비자의 유효 범위를 위반한 값이 해당 제한 지점을 넘어 수용·소비된다. 비허용 메모리 접근·상태 오염·다른 요청의 피해는 발생 여부와 증거를 별도로 기록한다.
unknown_criteria: 적용할 제한·집행 위치·허용된 절단·변환 조건 또는 실제 소비값을 확인하지 못했다. 이미 확인한 제한 위반은 후속 영향의 증거 부족과 구분해 미충족으로 기록한다.
remediation: '- 실제 모델·consumer의 유효 범위와 채택한 입력 제한을 해당 집행 위치에서 검사한다. 절단·변환을 허용하면 방식·시점과 변환 뒤 소비값을 명시한다. vocab·버퍼 범위 등 구현상 제약을 유지하고 오류는 요청 단위에서 처리한다.'
method_and_evidence: 모델·처리 단계별 유효 범위와 채택한 입력 제한·집행 위치를 정하고 정상·경계·범위 밖 입력의 실제 소비값을 대조한다. 허용한 절단·변환은 적용 시점과 변환 뒤 값을 확인한다. 제한 준수 결과와 메모리 접근·상태 오염·다른 요청 영향은 각각 기록한다.
remaining_setup: 선정 모델 범위와 격리 환경의 작은 경계 fixture
executor: input_validation
judge:
  plugin: rule_table
  params:
    pass_when_all:
    - obs: challenge_outcomes
      op: nonempty
    - obs: challenges_planned
      op: eq
      value:
      - token_id
      - length
    - obs: challenge_outcomes
      op: superset_of
      value_obs: challenges_planned
    - obs: challenge_outcomes
      op: all_in
      value_policy: rejection_codes
    - obs: challenge_rejection_results
      op: superset_of
      value_obs: challenges_planned
    - obs: challenge_rejection_results
      op: all_in
      value:
      - verified
    - obs: input_endpoints_tested
      op: eq
      value_policy: allowed_endpoints
    - obs: input_formats_tested
      op: eq
      value_policy: allowed_input_formats
    fail_when_any:
    - obs: confirmed_input_violations
      op: nonempty
    axes:
      functional:
        pass_when_all:
        - obs: functional_probe_results
          op: superset_of
          value_obs: functional_probes_planned
        - obs: functional_probe_results
          op: all_in
          value:
          - pass
        - obs: input_endpoints_tested
          op: eq
          value_policy: allowed_endpoints
        - obs: input_formats_tested
          op: eq
          value_policy: allowed_input_formats
        fail_when_any:
        - obs: functional_probe_results
          op: any_in
          value:
          - fail
legacy:
  q_ids:
  - Q-C04
  - Q-C06
  scenario_ids:
  - SC-04-01
  subtest_ids:
  - Q-C04/SC-04-01
source:
  array: request_state_assessment_draft
functional_probes:
- method: POST
  path: /v1/completions
  body:
    model: '{model}'
    prompt:
    - 0
    max_tokens: 1
  expect:
  - 200
  via: engine
limitations:
- REQ-09 revision 6은 HTTP 상태·검토된 원인별 거부·실제 소비를 구분한다. accepted_challenges는 구 형식의 HTTP 2xx 목록이며 새 정의의 FAIL 근거가 아니다. 오류 객체·불완전 응답·정상 생성 형태만으로 금지 입력 소비나 피해를 확정하지 않는다.
- 자동 실행기는 실제 consumer·메모리 접근·상태 오염을 계측하지 않으므로 challenge_consumption은 unknown이고 confirmed_input_violations는 비어 있다. 확인된 독립 위반 또는 신고 FAIL은 다른 관측 누락으로 지우지 않는다. PASS는 검토된 경계 거부 두 건과 정상 대조의 제한된 프로파일만 뜻한다.
- REQ-09 정책 허용 endpoint={allowed_endpoints}, 입력 형식={allowed_input_formats}. 정책 목록은 실제 등록·승인이나 parser 소비의 증명이 아니다.
- REQ-09는 승인된 전체 allowed_endpoints·allowed_input_formats 목록이 각각 하나이며 정의의 정상 engine POST/token_ids 표본과 정확히 일치하는 프로파일만 지원한다. 복수 목록은 일부만 골라 시험하지 않고 요청 전에 중단한다. 기업 정책을 축소하거나 기본값을 보충하지 않는다.
- input_endpoints_tested·input_formats_tested는 실제 제출 범위이며 engine 직통 한 쌍만 나타낸다. 다른 endpoint·형식·Gateway 경계·재사용 ID·renderer·parser의 실제 소비·원문 보호 전체·기업 승인 진위는 자동 검증하지 않는다. 수동 증거는 DECLARED이고 정책 부족은 PASS 보류 사유다.
- 실행 설정에 출처와 함께 선언한 vocab_size 및 정책 max_input_tokens를 사용하는 token-array 경계 두 건만 시험한다. 실제 모델 유효 범위와 설정의 일치는 별도 확인해야 하며, 다른 입력 형식·음수 ID·모든 경계 조합을 검증하지 않는다.
