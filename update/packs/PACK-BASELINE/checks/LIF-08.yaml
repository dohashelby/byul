id: LIF-08
framework_id: CHK-LIF-008
mechanism_ids:
- mechanism-13
revision: 4
retired: false
area: LIF
purpose: 실패 감지·상위 통지
secondary_purposes: []
question: 각 GPU 실행 프로세스의 예외·종료·지연·통신 정지를 감지해 상위 제어 프로세스에 알리는가?
scope: 기본 TP; 선정 executor
risk_category: 일반 장애·복구 점검
risk_summary: TP rank의 예외·사망·지연을 감지하지 못하면 요청이 멈춘 채 자원을 점유하거나 부분 처리를 성공으로 알릴 수 있음. 공격 입력으로 유발 가능한지는 별도 확인.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 선정 executor에서 rank 예외·사망·지연·통신 정지를 구분한다. 다른 executor의 장애 처리를 기본 근거로 쓰지 않는다.
policy_params: []
policy_prose:
  policy_to_decide: 실패 유형별 기한·격리·전체 중단 방침
  enterprise_decisions: 실패 유형별 감지·전달·중단·복구 절차와 책임자, 영향 요청 오류 처리·알림 경로.
normal_control: 필수 rank가 맡은 계산·통신을 완료하고, 선정 executor의 출력 rank 또는 집계 경로가 최종 결과를 반환해 정상 TP 요청이 완료된다. 모든 rank가 같은 최종 출력을 반환한다고 가정하지 않는다.
challenge_steps:
- 격리 rank에 예외·사망·지연·통신 정지를 각각 단독 주입
- 감지·상위 전달·요청 결과 기록
- 복구
required_observations: []
required_observations_prose:
- fault 종류·rank/감지 시각·상태/요청 오류·잔존 작업
satisfied_if: 정한 기한 안에 실패가 전달되고 불완전 작업을 성공으로 처리하지 않는다.
fail_criteria: 정한 감지·전달 기한을 넘기거나 실패를 성공으로 반환한다.
unknown_criteria: 네 장애를 하나로 대신했거나 감지 기한·상위 전달을 못 본다.
remediation: '- rank 예외·프로세스 종료·지연·통신 정지를 구분해 감지하고 영향받는 요청·실행 그룹에 오류를 전달한다. 감지·전달 기한을 정하고 실패를 정상 완료로 처리하는 경로를 보완한다.'
method_and_evidence: 선정 executor에서 rank의 무해 예외·프로세스 종료·제한 지연·통신 정지를 각각 주입하고, fault 발생→감지→상위 전달·요청 실패 결과의 시각과 대응을 기록한다. 각 장애를 다른 종류의 장애 관측으로 대신하지 않는다. 초기화·모델 준비의 부분 실패 집계는 CHK-LIF-009에서, 실패 후 process·IPC·공유 자원 회수와 다음 기동은 CHK-LIF-011에서 판정한다. 같은 시험의 로그/API 표현과 실제 상태의 일치는 CHK-OBS-002에서 별도로 대조한다.
remaining_setup: 장애별 안전 주입기·종료 상한·복구 절차
