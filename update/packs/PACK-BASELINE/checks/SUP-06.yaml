- key: supply_boot_violations
  type: list
- key: supply_boot_missing
  type: list
- key: supply_boot_complete
  type: bool
- key: supply_boot_normal_verified
  type: bool
- key: supply_boot_change_applied
  type: bool
- key: supply_boot_record_authenticated
  type: bool
- key: supply_boot_native_consumption
  type: list
- key: supply_boot_change
  type: dict
required_observations_prose:
- rank·shard·mapper·변환 설정/필수 tensor 정의·tracking 반환/로딩 완료 또는 거부. 공유·원격 weights 사용 시 publisher·세대·layout·payload와 실제 적재의 대응도 확보한다.
satisfied_if: 필요한 worker의 실제 적재 대상이 승인 내용과 일치한다. 공유·원격 weights를 사용하면 승인된 model·rank·generation·layout의 payload가 실제 적재돼야 한다. 전체 접수 준비·재개는 7.2 기동 준비 확인의 CHK-LIF-007·CHK-LIF-009에서 별도로 판정한다.
fail_criteria: 필수 배정 부분이 없거나 승인과 다른데 정상 적재로 인정한다.
unknown_criteria: 모델별 필수 tensor·의도된 후처리 생성값 또는 rank 소비 기록을 알 수 없다. 공유·원격 weights에서 key·header만 확인하고 payload의 실제 적재를 확인하지 못한 경우도 포함한다.
remediation: '- 각 worker·rank가 읽을 승인 파일과 담당 shard를 기록하고 실제 적재 결과와 대조한다. 필수 부분이 없거나 다른 모델·버전이 적재되면 준비 완료로 처리하지 않고 원인을 해소한 뒤 정상 추론을 확인한다.'
method_and_evidence: '필요한 node/rank마다 승인된 model·shard·필수 tensor와 실제 read/load·mapper·변환·후처리 결과를 연결한다. 공유·원격 weights는 publisher·model·rank·generation·layout·payload의 실제 적재까지 대조한다. 동일 경로명·key/header 또는 canary 성공만으로 적재 일치를 판정하지 않는다. 【F33】선정 model.load_weights 반환·양자화·enable_weights_track 유효값을 고정하고 완전 checkpoint와 필수 tensor 누락 fixture를 비교한다. 의도된 후처리 생성값과 누락을 구분한다. 【F34】redirect 사용 시 최종 resolved 파일이 각 worker에 배정된 승인 대상과 일치하는지 기록한다. 전체 접수 준비·재개는 CHK-LIF-007·CHK-LIF-009의 판정과 연결한다. 근거 원문: [F33](https://github.com/mg-princess/serving-security-framework/blob/8a0c7fe42446ff0d3a1f58e2a18cf3069d5c714e/data/checklist.json#L33757) · [F34](https://github.com/mg-princess/serving-security-framework/blob/8a0c7fe42446ff0d3a1f58e2a18cf3069d5c714e/data/checklist.json#L33778).'
remaining_setup: 모델·양자화별 필수 tensor 기준과 rank 계측
