id: SUP-08
revision: 1
retired: false
area: SUP
purpose: 코드 실행 제한
secondary_purposes: []
question: 요청 입력으로 허용 밖 코드 판본을 선택할 수 없는가?
scope: null
risk_category: 보안 위협 점검
risk_summary: 일반 호출자가 요청 필드로 코드 판본을 바꿀 수 있는 구성에서 미승인 코드를 다운로드·실행시키도록 유도할 수 있음. 선정 processor·의존성의 실제 소비 확인 필요.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 그 입력이 실제 endpoint에서 코드 선택에 도달
policy_params: []
policy_prose:
  policy_to_decide: null
  enterprise_decisions: 필요한 모델 코드·plugin·모드·권한·공급 방식, 승인/변경 절차. auto_map 존재만으로 실행이나 거부를 확정하지 않고 실제 선택되는 코드 출처를 확인한다.
normal_control: request override 없이 승인 processor·코드 판본으로 요청을 처리한다.
challenge_steps:
- 기본 설정에서 비어 있지 않은 mm kwargs 제출
- 거부 위치 확인
- opt-in 환경이 있을 때만 무해 code_revision 대체와 최종 소비 판본 비교
required_observations: []
required_observations_prose:
- trust_request_mm_kwargs 유효값
- factory 전달 인수
- 최종 import·repo·revision
satisfied_if: 허용 밖 선택이 코드 실행 전에 차단된다. 입력 미지원이면 근거와 함께 해당 없음.
fail_criteria: 금지 override가 코드 선택에 반영되거나 승인 밖 코드가 소비된다.
unknown_criteria: kwargs 전달까지만 확인되고 선정 processor의 최종 코드 선택은 확인되지 않았다.
remediation: 요청으로 설정 가능한 필드를 제한하고 승인 판본을 운영 설정에서 고정한다
method_and_evidence: '허용/비허용 선택과 최종 import 대상을 무해 표식으로 비교한다. 기본 trust_request_mm_kwargs=false에서 요청 mm_processor_kwargs 거부를 확인한다. opt-in 환경은 code_revision이 dynamic kwargs 필터·processor kwargs·from_pretrained로 전달되는지 선정 processor/Transformers/auto_map·trust_remote_code 조합으로 추적하고 최종 소비 판본을 승인과 대조한다. 텍스트 모델에서 미도달이면 해당 분기만 근거와 함께 비적용 처리한다. 【F10】MM processor 경로: trust_request_mm_kwargs 허용 시; 기본은 비어 있지 않은 request kwargs 거부. LoRA: resolver 설치·활성 및 운영자 repo_list에 일치할 때. 기본에서는 code_revision 포함 kwargs가 processor 소비 전에 거부되는지 확인. opt-in에서는 실제 processor factory 인수·다운로드 객체를 기록. resolver에서는 repo 목록 밖/안, 같은 이름의 원격 변경을 비교해 실제 immutable snapshot 식별과 승인 대응 확인. 정상 대조: 기본 텍스트 요청 및 승인한 모델/adapter 정상 사용.'
remaining_setup: MM 사용 여부와 선정 processor·Transformers 판본; 텍스트 미도달 분기는 별도 비적용 확인
