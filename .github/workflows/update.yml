name: UPDATE and shared contracts

on:
  push:
    branches: [main, "codex/**", byul_update]
    paths:
      - ".github/workflows/update.yml"
      - ".github/scripts/update_ci_relevance.py"
      - ".github/update-ci-paths.txt"
      - "update/**"
      # Prose-only docs skip CI; the docs tests read stay listed (test_workflow_paths.py checks this).
      - "!update/docs/**/*.md"
      # Top-level prose (SPEC·README·PROGRESS·DECISIONS·CLAUDE·AGENTS) is not read by code either.
      - "!update/*.md"
      - "update/docs/AUTOMATION_HARDENING.md"
      - "update/docs/AUTOMATION_PHASE1.md"
      - "update/docs/AUTOMATION_PHASE2.md"
      - "update/docs/AUTOMATION_PHASE3.md"
      - "update/docs/CHECKLIST_VALIDATION_STATUS.md"
      - "update/docs/POLICY_M12.md"
      - "update/docs/POLICY_M14.md"
      - "update/docs/UPDATE_SELECTION.md"
      - "update/docs/UPDATE_VALIDATION.md"
      - "update/docs/b-lif07/PR171_SOURCE_CONSUMPTION.md"
      - "update/docs/b-lif07/WORKER_READINESS.md"
      - "update/docs/b-lif13/WEIGHTS_LIFETIME.md"
      - "update/docs/dev-1/ma6-version-applicability.md"
      - "update/docs/WORK_ORDER_VLLM_MVP.md"
      - "update/docs/evidence/sup08-code-selection-20261111.json"
      - "contracts/**"
      - "platform/api/**"
  # PR은 항상 실행하고 job 단위에서 건너뛴다. 경로 필터로 workflow 자체를 건너뛰면 필수 검사가 Pending에 남는다.
  pull_request:

permissions:
  contents: read

# Keep push and PR verification independent; supersede only the same event/ref.
concurrency:
  group: update-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/update_ci_relevance.py >> "$GITHUB_OUTPUT"

  update-default:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    # Python 3.12.3 is pinned for the native sensor contracts and is not published for Ubuntu 26.04
    # (ubuntu-latest from 2026-11). Keep the runner that the pinned interpreter supports.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: update
    steps:
      - uses: actions/checkout@v7
        with:
          # Pinned-commit tests read history with git show.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          # Native sensor code contracts are exact per interpreter; POSIX supports 3.12.3.
          python-version: "3.12.3"
      - run: python -m pip install uv==0.12.11
      - run: uv sync --frozen
      - name: Measure default suite parent wall clock
        run: |
          uv run --project ../platform/api --frozen --with-editable . --with-editable ../runtime --with pytest-xdist==3.8.0 python - <<'PY'
          import os
          import subprocess
          import sys
          import time

          start = time.perf_counter()
          result = subprocess.run([sys.executable, "-m", "pytest", "-q", "-n", "auto", "--durations=50",
              "--basetemp", os.path.join(os.environ["RUNNER_TEMP"], "byul-update-pytest")])
          print(f"Default suite parent wall clock: {time.perf_counter() - start:.3f}s", flush=True)
          raise SystemExit(result.returncode)
          PY
      - run: uv build --wheel
      - name: Verify installed wheel outside checkout
        run: uv run python tools/verify_installed.py --wheel dist/guard-0.1.0-py3-none-any.whl --output "${{ runner.temp }}/byul-update-installed"

  update-docker-stub:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: update
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.11
      - run: uv sync --frozen
      - name: Measure Python 3.12 Docker stub and probe suite
        run: |
          uv run python - <<'PY'
          import os
          import subprocess
          import sys
          import time

          start = time.perf_counter()
          result = subprocess.run([sys.executable, "-m", "pytest", "-q", "-m", "docker",
              "tests/test_lab_docker.py", "--basetemp", os.path.join(os.environ["RUNNER_TEMP"], "byul-update-docker")])
          print(f"Docker stub parent wall clock: {time.perf_counter() - start:.3f}s", flush=True)
          raise SystemExit(result.returncode)
          PY
      - name: Record Python helper image identity
        run: |
          docker image inspect python:3.12-slim --format '{{json .RepoDigests}}'
          docker run --rm --network none --cpus 1 --memory 128m python:3.12-slim python -c "import sys; print(sys.version); assert sys.version_info[:2] == (3, 12)"

  shared-contracts:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.11
      - name: Validate shared schemas, examples and reference hashes
        run: uv run --no-project --with jsonschema python contracts/tools/check_contracts.py

  platform-update-contracts:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform/api
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.11
      - run: uv sync --frozen
      - name: Verify platform contracts and read-only RPT projection
        run: |
          # Bundle export tests invoke the installed runtime CLI, including its package metadata.
          uv run --frozen --with-editable ../../update --with-editable ../../runtime python - <<'PY'
          import os
          import subprocess
          import sys
          import time

          start = time.perf_counter()
          result = subprocess.run([sys.executable, "-m", "pytest", "-q", "--durations=20",
              "--basetemp", os.path.join(os.environ["RUNNER_TEMP"], "byul-platform-api-pytest")])
          print(f"Platform API parent wall clock: {time.perf_counter() - start:.3f}s", flush=True)
          raise SystemExit(result.returncode)
          PY

  # 필수 검사는 이 job 하나만 지정한다. 건너뛴 job은 통과로, 실패·취소는 실패로 본다.
  update-ci-ok:
    if: always()
    needs: [changes, update-default, update-docker-stub, shared-contracts, platform-update-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
