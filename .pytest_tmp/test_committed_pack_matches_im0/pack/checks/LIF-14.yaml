area: LIF
purpose: 종결·자원 회수
secondary_purposes: []
question: profiler 종료가 실제 수집·자원 종료와 맞는가?
scope: 조건부; 선정 profiler
risk_category: 일반 장애·복구 점검
risk_summary: profiler 종료 실패를 완료로 판단하면 수집·파일 기록·자원 사용이 계속될 수 있음. 비허용 호출·민감정보 수집 여부는 별도 보안 점검.
review_order: conditional_when_selected
impact: null
applies_when:
  prose: 조건부; 선정 profiler
policy_params: []
policy_prose:
  policy_to_decide: 종료 대상·기한·미완료 표시
  enterprise_decisions: 요청별/그룹별 회수 대상·잔존 참조·강제 종료·중복 비용 처리. 공유 weights/profiler/retry는 기능 선택 후 별도 수명·종료 계약을 확인한다.
normal_control: 허용 profiler 시작·종료로 수집 파일이 정상 마무리된다.
challenge_steps:
- 짧은 profile 실행
- 종료 호출
- worker 종료·파일 finalization 확인; 별도 격리 실행에서 종료 오류 주입
required_observations: []
required_observations_prose:
- 종료 API 결과
- worker profiler 상태
- 파일 닫힘·계속 수집 여부
satisfied_if: 선정 backend의 종료 계약을 충족한다. 모든 backend에 파일 생성을 강제하지 않는다.
fail_criteria: 종료 성공 표시 뒤 수집이 계속되거나 종료 실패를 성공으로 기록한다.
unknown_criteria: API 200만 있고 실제 수집 종료·파일 상태를 확인하지 못했다.
remediation: 취소 전파·그룹 장애 처리·retry예산과 실제 종료 관측을 연결한다 필드 최소화·권한/보존·opt-out·송신통제·수집장애 표시를 실제 경로에 적용한다
method_and_evidence: 'stop 응답·경고·rank별 backend 상태·해당 산출물과 자원을 대조한다. 【F38】profiler 설정이 있어야 route 등록. prefix 밖 경로이므로 실제 Gateway/직통 접근 통제 별도 검증. backend 시작/정지 실패 주입은 격리 시험환경. 격리 환경에서 시작·정지 backend 실패를 각각 주입하고 응답·경고·내부 flag·실제 기록 생성/종료·다음 시작 가능성을 대조한다. 정상 대조: 정상 start·실제 기록 생성·stop·기록 종료·다시 start 가능 상태 확인.'
remaining_setup: 짧은 profile fixture·오류 주입·종료 기한
