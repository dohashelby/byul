name: Single GPU 63 execution preparation

on:
  push:
    branches: [codex/single-gpu-63-20261126]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.3"
      - name: Verify frozen product source
        run: git diff --exit-code 22e6e83d4fe26074c3c6c6e5e68742863f5239fe -- update contracts reference
      - run: python -m pip install uv==0.12.11
      - run: uv sync --frozen
        working-directory: update
      - name: Verify session stop boundaries and all 63 execution scope
        working-directory: update
        env:
          PYTHONPATH: src:.:../.github/scripts/gpu63
        run: uv run --frozen python -m unittest discover -s ../.github/scripts/gpu63 -p 'test_*.py' -v
      - name: Export static per-check input requirements
        working-directory: update
        env:
          PYTHONPATH: src:.:../.github/scripts/gpu63
        run: uv run --frozen python ../.github/scripts/gpu63/input_requirements.py --out ../gpu63-input-requirements.json
      - uses: actions/upload-artifact@v6
        with:
          name: gpu63-input-requirements
          path: gpu63-input-requirements.json
          retention-days: 7
