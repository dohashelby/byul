id: REQ-05
framework_id: CHK-REQ-005
mechanism_ids:
- mechanism-01
- mechanism-08
revision: 3
retired: false
area: REQ
purpose: 작업·대상 인가
secondary_purposes: []
question: 최종 선택된 모델에 호출자의 사용 권한이 적용되고, 사용 종료한 모델의 실행이 차단되는가?
scope: 기본+선택 기능
risk_category: 보안 위협 점검
risk_summary: 호출자가 모델 이름·alias·adapter 등 선택 경로를 바꿔 허용받지 않은 모델을 사용하거나 비승인 실물을 실행시킬 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 모델 1개에서도 허용 대상을 확인한다. alias·adapter·공유 모델 소비는 실제 선택 시 추가한다. 모델을 사용 종료하거나 alias를 변경한 경우에는 이전 경로가 선택하는 최종 모델도 확인한다.
policy_params: []
policy_prose:
  policy_to_decide: 호출자별 모델·adapter 허용 관계
  enterprise_decisions: 인증 방식·실제 계정, 사용자/조직별 모델·작업 허용표, 직통 허용 주체·목적, 관리 역할, Gateway의 신원 전달·경로 변환과 선택 API. 저장 결과 기능을 쓰면 객체 소유자·조회·취소 권한도 결정한다. 사용 종료 모델·시점·처리 기한, 남길 공용 API와 alias의 현재 승인 대상, 기존 요청 처리 방침을 정한다.
normal_control: 호출자가 허용된 활성 모델을 정상 사용한다. 사용 종료 시험에서는 다른 활성 모델과 현재 승인된 alias 매핑도 정상 동작한다.
challenge_steps:
- 활성 모델 선택 경로 목록 확보
- 표시명·adapter·대체 endpoint 선택값 변경
- 최종 모델·파일 선택과 인가 대조
- 시험 사본에서 모델 하나를 사용 종료 처리하고 이전 모델명·alias·주소·기존 자격으로 호출
- 실제 선택·실행된 모델을 확인하고 승인된 다른 활성 모델의 정상 처리와 비교
required_observations: []
required_observations_prose:
- 역할×모델 허용표/선택값/최종 모델·adapter·실제 소비
- 모델 사용 종료 대상·승인 시각, Gateway·엔진의 route/alias 전후 값, 실제 선택·실행 모델, 활성 모델의 정상 응답
satisfied_if: 호출자에게 허용된 모델·adapter만 실행되며 사용 종료한 모델은 실행되지 않는다. 공용 API·alias를 현재 승인된 다른 모델에 재사용하면 실제 선택 결과가 그 승인과 일치한다. 실제 파일 승인은 공급물 영역에서 판정한다.
fail_criteria: 허용되지 않은 최종 모델이나 adapter가 선택·사용된다. 사용 종료한 모델이 이전 이름·alias·직통 경로에서 계속 선택·실행된다.
unknown_criteria: API 표시명만 확인했거나 조건부 resolver·endpoint의 최종 대상을 모른다. 사용 종료 대상·기한 또는 실제 실행 모델을 확인하지 못했다.
remediation: '- 별칭·adapter·공유 가중치가 최종적으로 선택하는 모델을 확인하고 그 대상에 호출자의 사용 권한을 검사한다. 모델 선택 설정의 변경 권한을 제한하고 변경 이력을 남긴다.

  - 사용 종료한 모델의 신규 실행을 중단하고 Gateway·엔진의 남은 route·alias를 현재 승인 대상과 대조한다. 공용 API를 유지할 때도 퇴역 모델을 선택하지 않도록 설정한다. 기존 요청의 완료·중단과 자원 정리는 LIF에서 확인한다.'
method_and_evidence: '모델 이름 생략·별칭·비허용 이름과 최종 선택 모델을 신원별로 비교한다. 정상 허용 호출도 확인한다.<br><br>**vLLM v0.31.0 구현 메모:** 【F20】MM 기본 LoRA, resolver, SageMaker adapter 주입은 조건부. 외부 SageMaker decorator의 정확한 header/검증은 미확인. model 필드 외 활성 selector를 목록화하고 최종 선택 adapter·revision·경로까지 인가 대조한다. 정상 대조: 허용 기본 모델/adapter 정상'
remaining_setup: 활성 endpoint별 모델 선택 계측; 설치된 추가 기능만 시험; 퇴역 모델 시험 사본·최종 실행 모델 계측, 사용 종료 정책·기한 결정
