executor: rank_failure
collection_profile: kubernetes-mp-rank-failure-observation-v1
policy_params:
- key: rank_executor_backend
  type: str
  required: true
- key: rank_expected_ranks
  type: list[str]
  required: true
- key: rank_output_rank
  type: int
  required: true
- key: rank_exception_detection_ms
  type: int
  required: true
- key: rank_exception_notification_ms
  type: int
  required: true
- key: rank_death_detection_ms
  type: int
  required: true
- key: rank_death_notification_ms
  type: int
  required: true
- key: rank_delay_detection_ms
  type: int
  required: true
- key: rank_delay_notification_ms
  type: int
  required: true
- key: rank_communication_stall_detection_ms
  type: int
  required: true
- key: rank_communication_stall_notification_ms
  type: int
  required: true
required_observations:
- key: activation_steps
  type: list
- key: activation_violations
  type: list
- key: activation_missing
  type: list
- key: activation_scope_complete
  type: bool
judge:
  plugin: rule_table
  params:
    pass_when_all:
    - obs: activation_scope_complete
      op: eq
      value: true
    - obs: activation_violations
      op: empty
    fail_when_any:
    - obs: activation_violations
      op: nonempty

impact: MEDIUM
