id: OBS-10
framework_id: CHK-OBS-010
revision: 2
retired: false
area: OBS
purpose: 증거의 신뢰성
framework_purpose: 기록 위변조 방지
mechanism_ids:
- mechanism-17
secondary_purposes: []
question: 기록을 허락 없이 바꾸거나 지우는 일을 제한하고 확인할 수 있는가?
scope: 실제 기록 저장소
risk_category: 보안 위협 점검
risk_summary: 기록 저장소 변경권자가 무단 행위의 이력을 삭제·변조해 침해 탐지·원인 분석·시험 판정을 방해할 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 실제 기록 저장소의 writer·검토자·admin 접근과 변경/삭제를 확인한다. 저장소 미정은 미확인이다.
policy_params: []
policy_prose:
  policy_to_decide: writer·검토자 권한·무결성 요구
  enterprise_decisions: 기록 형식·writer/reader/admin 권한·무결성/변조 탐지 수단, 사건 중요도별 수집 장애 때 운영 유지/제한/중단 절차. 운영 적용 전에 사건별 대응을 확정한다. 미정이면 기본 지속이나 즉시 중단 어느 쪽도 가정하지 않는다.
normal_control: 정상 writer가 기록을 추가하고 검토자는 읽기만 한다.
challenge_steps:
- 기록별 예방·탐지의 필수 범위·기한과 권한 분리 확인
- 정상 기록 작성·허용 조회와 격리된 시험 증거 사본 준비
- 비허용 계정의 변경·삭제·다른 실행 자료 대체 시도
- 예방 결과와 필수 탐지 사건의 독립 증거·탐지 시각을 각각 대조
required_observations: []
required_observations_prose:
- 예방·탐지의 필수 범위·기한, writer·검토자·관리자 권한과 변경·삭제 결과
- 원본·사본 식별정보, 실제 사건과 독립 감사·탐지 시각, 정상 작성·허용 조회 결과
satisfied_if: 채택한 예방·탐지 요구를 모두 충족하고 정상 기록 작성·허용 조회가 가능하다. 예방 필수 범위는 무단 변경·삭제를 거부하고, 탐지 필수 사건은 정한 범위·기한에 독립 증거로 탐지한다. 팀 참조 기준의 비허용 삭제 거부와 권한 분리도 유지한다.
fail_criteria: 예방이 필수인 범위에서 무단 변경·삭제가 성립하거나, 탐지가 필수인 사건을 정한 범위·기한에 탐지하지 못한다. 예방·탐지가 모두 필수이면 어느 하나의 위반도 미충족이다.
unknown_criteria: 예방·탐지의 필수 범위·기한 또는 실제 권한 집행·독립 탐지의 증거를 확인하지 못했다. 확인된 필수 요구 위반은 다른 증거가 부족해도 미충족으로 기록한다.
remediation: '- 기록 작성자·검토자·감사 저장소 관리자의 권한을 분리하고, 예방 필수 범위의 변경·삭제를 거부한다. 탐지 필수 사건은 보호된 독립 감사와 식별정보로 정한 범위·기한에 확인한다. 예방과 탐지 결과를 각각 기록하고 팀 참조 기준의 비허용 삭제 거부를 유지한다.'
method_and_evidence: 기록별 예방·탐지의 필수 범위와 기한을 정하고 역할별 변경·삭제 및 독립 감사 흔적을 대조한다. 팀 참조 기준의 비허용 삭제 거부와 기록·감사 관리 권한 분리를 유지한다. 예방 결과와 탐지 결과를 각각 남기고 채택한 필수 요구를 모두 확인한다.
remaining_setup: 증거 writer·reader·admin 역할과 변조 방지/탐지 수단
