executor: api_transport
collection_profile: record-transport-segments-v1
policy_params:
  - { key: record_transport_segments, type: "list[str]", required: true }
  - { key: record_tls_required_segments, type: "list[str]", required: true }
required_observations:
  - { key: record_transport_trials, type: list }
  - { key: record_transport_segments_planned, type: "list[str]" }
  - { key: record_transport_segments_tested, type: list }
  - { key: record_transport_unprotected, type: list }
  - { key: record_transport_wrong_peer_accepted, type: list }
  - { key: record_transport_unreachable, type: list }
  - { key: record_transport_sender_verified, type: bool }
judge:
  plugin: rule_table
  params:
    pass_when_all:
      - { obs: record_transport_segments_tested, op: superset_of, value_obs: record_transport_segments_planned }
      - { obs: record_transport_unprotected, op: empty }
      - { obs: record_transport_wrong_peer_accepted, op: empty }
      - { obs: record_transport_sender_verified, op: eq, value: true }
    fail_when_any:
      - { obs: record_transport_unprotected, op: nonempty }
      - { obs: record_transport_wrong_peer_accepted, op: nonempty }
limitations:
  - "구현 분기: 구간별 실제 송신 쪽 컨테이너에서 TLS 핸드셰이크와 잘못된 서버 이름의 거부를 시험한다. TLS를 요구한 구간이 비보호이거나 다른 상대를 받으면 FAIL이다."
  - "미구현 분기: 실제 송신 SDK·도구의 설정과 sink 수신 대조가 없어 PASS에 도달하지 않는다. 연결 불가 구간은 거부 근거가 아니라 미확인이다."
  - "real 구현만 있다. 구간은 설정의 record_segments로 명시하며 시험 자격·기록 본문을 보내지 않는다."
