id: REQ-16
revision: 1
retired: false
area: REQ
purpose: 공유 제한
secondary_purposes: []
question: cache key가 실제 재사용에 필요한 문맥을 구분하는가?
scope: 기본+활성 기능
risk_category: 보안 위협 점검
risk_summary: 호출자가 구분되지 않는 모델·자료 식별값을 이용해 부적합한 cache를 재사용하게 하여 다른 요청 문맥이나 잘못된 결과를 소비하게 할 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 선정 hash/key; adapter 등은 활성 시만
policy_params: []
policy_prose:
  policy_to_decide: 공유 허용 관계·필수 문맥
  enterprise_decisions: 공유 단위(사용자/서비스 계정/tenant), 공개 prefix 공유 여부, 인증 주체 식별·salt 발급/덮어쓰기/검사 주체, 필요한 key 문맥, 비공개 정보와 공격자의 반복 관측 조건·통계 기준·성능 허용 범위. 같은 서비스 자격 뒤 여러 사용자가 있으면 추가 신원 전달이나 환경 분리가 필요한지 결정한다.
normal_control: 같은 모델·adapter·문맥의 동일 입력만 기대한 캐시를 재사용한다.
challenge_steps:
- 동일 입력 기준선
- adapter 내용·model generation·media 식별 중 활성 조건 하나 변경
- hit와 출력 비교
required_observations: []
required_observations_prose:
- 실제 cache key 구성
- 바뀐 객체 식별
- hit·출력·승인 세대
satisfied_if: 허용하지 않은 문맥 사이에 잘못 재사용되지 않는다. 임의 hash 충돌 가능성을 결함으로 가정하지 않는다.
fail_criteria: 서로 다른 비공유 문맥이 같은 cache로 처리되어 잘못된 자료를 재사용한다.
unknown_criteria: 활성 key 구성·실제 객체 변경·재사용 효과를 확인하지 못했다.
remediation: 필수 문맥을 key/재사용 조건에 반영한다.
method_and_evidence: 'token·모델 문맥 등 필요한 요소를 하나씩 바꿔 key·lookup·실제 소비를 비교한다. 【F16】미디어 UUID 및 runtime LoRA는 선택 기능. UUID가 있어도 hash factors는 반영됨. 동일 UUID에 다른 내용, 동일 LoRA 이름·경로의 가중치 교체 전후를 cache 사용/비사용 대조로 확인한다. 정상 대조: 새 UUID·새 LoRA 경로 및 cache 비사용 결과와 일치'
remaining_setup: 텍스트 기본과 MM·LoRA 선택 분기 분리; 충돌 fixture 선정
