id: REQ-04
framework_id: CHK-REQ-004
mechanism_ids:
- mechanism-01
revision: 4
retired: false
area: REQ
purpose: 신원 인증·전달
secondary_purposes: []
question: 사용자가 보낸 값으로 권한 검사에 쓰는 신원을 사칭할 수 없는가?
scope: 조건부
risk_category: 보안 위협 점검
risk_summary: 호출자가 외부 신원 header를 사칭해 실제 인가 집행점에서 타인의 모델·작업 권한을 얻을 수 있음. 동작 제어 header 자체를 신원으로 간주하지 않음.
review_order: conditional_when_selected
impact: null
applies_when:
  prose: 앱·Gateway·서비스 계정이 전달한 신원을 인가에 사용할 때 적용한다. 최종 사용자와 연결 주체를 구분한다.
policy_params:
- key: forwarded_environment_sha256
  type: str
  required: true
- key: forwarded_target_sha256
  type: str
  required: true
- key: forwarded_session
  type: str
  required: true
- key: forwarded_gateway_source_sha256
  type: str
  required: true
- key: forwarded_engine_source_sha256
  type: str
  required: true
- key: forwarded_identity_policy_sha256
  type: str
  required: true
- key: forwarded_validity_start
  type: str
  required: true
- key: forwarded_validity_end
  type: str
  required: true
policy_prose:
  policy_to_decide: 신원 발급·전달·신뢰 주체
  enterprise_decisions: 인증 방식·실제 계정, 사용자/조직별 모델·작업 허용표, 직통 허용 주체·목적, 관리 역할, Gateway의 신원 전달·경로 변환과 선택 API. 저장 결과 기능을 쓰면 객체 소유자·조회·취소 권한도 결정한다.
normal_control: 업무 앱이 전달한 검증된 사용자 또는 앱 신원이 정책에 맞게 사용된다.
challenge_steps:
- 신뢰 전달 경로 기록
- 클라이언트가 신원·priority·session·rank header를 바꾸어 요청
- Gateway 정규화와 엔진 소비 비교
required_observations:
- key: forwarded_trials
  type: list
- key: forwarded_records
  type: list
- key: forwarded_matches
  type: list
- key: forwarded_missing
  type: list
- key: forwarded_conflict_candidates
  type: list
- key: forwarded_collection
  type: list
- key: forwarded_producer_authenticated
  type: bool
- key: forwarded_principal_identity_verified
  type: bool
- key: forwarded_scope_complete
  type: bool
required_observations_prose:
- 원 요청 header/정규화 결과/정책에 쓰인 신원·선택값
satisfied_if: 사용자가 지정한 신원이 신뢰 신원으로 그대로 수용되지 않는다.
fail_criteria: 비신뢰 입력이 인가 신원이나 보호된 운영 선택값을 덮어쓴다.
unknown_criteria: 사용자 신원 전달 방식·앱 단위 권한 계약 또는 최종 소비값을 모른다.
remediation: '- 사용자 신원은 앱·Gateway 등 검증한 구성요소에서 설정하고 외부 입력의 신원·보호 필드 덮어쓰기를 차단한다. 엔진에 전달되는 서비스 계정과 최종 사용자를 구분해 허용 작업을 확인한다.'
method_and_evidence: '외부 신원 header를 변경하고 Gateway의 덮어쓰기·엔진의 신뢰 principal·최종 인가 결과를 확인한다.<br><br>**vLLM v0.31.0 구현 메모:** 【F13】임의 tenant header를 vLLM이 주체로 인증한다고 볼 근거 없음. session/priority/DP rank/request ID는 소비되지만 신원 증명 아님. SageMaker header명은 외부 의존성 확인 필요. Gateway에서 외부 신원 header 제거·검증 후 재생성을 확인하고, 실제 소비되는 X-Vllm-Priority·X-Session-ID·X-data-parallel-rank·X-Request-Id 조작의 영향과 권한 검사를 각각 확인한다. 정상 대조: 허용 앱 계정과 검증된 사용자 신원으로 정상 요청·세션 처리'
remaining_setup: 신뢰 header 목록과 전달 책임; 모든 header를 사용자 인가로 간주하지 않음
executor: forwarded_identity
judge:
  plugin: rule_table
  params:
    pass_when_all:
    - obs: forwarded_trials
      op: nonempty
    - obs: forwarded_producer_authenticated
      op: eq
      value: true
    - obs: forwarded_principal_identity_verified
      op: eq
      value: true
    - obs: forwarded_scope_complete
      op: eq
      value: true
    - obs: forwarded_missing
      op: empty
    - obs: forwarded_conflict_candidates
      op: empty
    fail_when_any:
    - obs: forwarded_conflict_candidates
      op: nonempty
      when:
        obs: forwarded_principal_identity_verified
        op: eq
        value: true
legacy:
  q_ids:
  - Q-C01
  - Q-C02
  scenario_ids:
  - SC-01-04
  subtest_ids:
  - Q-C01/SC-01-04
source:
  array: request_state_assessment_draft
collection_profile: kubernetes-forwarded-identity-observation-v1
limitations:
- '구현 분기: 같은 자격의 정상·대체 header 요청을 Gateway로 보내고 Gateway·engine 양쪽 소유 기록의 입력→정규화→소비를 대조한다.'
- '미구현 분기: 생산자 인증과 신뢰 principal 근거가 없어 보안 PASS와 보안 FAIL은 현재 도달하지 않는다. 교체 header 소비는 후보로만 남는다.'
- kubernetes 구현만 있다. lab=true/vLLM 0.31 명시 프로필이며 운영 Gateway·IdP·native 0.32는 추정하지 않는다. 원문 로그·자격을 읽지 않는다.
