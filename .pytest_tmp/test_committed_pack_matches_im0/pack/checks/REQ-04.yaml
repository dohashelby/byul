id: REQ-04
revision: 1
retired: false
area: REQ
purpose: 요청·대상 접근 권한
secondary_purposes: []
question: 외부 입력이 인가에 쓰는 신원을 사칭하지 못하는가?
scope: 조건부
risk_category: 보안 위협 점검
risk_summary: 호출자가 외부 신원 header를 사칭해 실제 인가 집행점에서 타인의 모델·작업 권한을 얻을 수 있음. 동작 제어 header 자체를 신원으로 간주하지 않음.
review_order: conditional_when_selected
impact: null
applies_when:
  prose: header 등 전달 신원을 인가에 사용
policy_params: []
policy_prose:
  policy_to_decide: 신원 발급·전달·신뢰 주체
  enterprise_decisions: 인증 방식·실제 계정, 사용자/조직별 모델·작업 허용표, 직통 허용 주체·목적, 관리 역할, Gateway의 신원 전달·경로 변환과 선택 API. 저장 결과 기능을 쓰면 객체 소유자·조회·취소 권한도 결정한다.
normal_control: 업무 앱이 전달한 검증된 사용자 또는 앱 신원이 정책에 맞게 사용된다.
challenge_steps:
- 신뢰 전달 경로 기록
- 클라이언트가 신원·priority·session·rank header를 바꾸어 요청
- Gateway 정규화와 엔진 소비 비교
required_observations: []
required_observations_prose:
- 원 요청 header
- 정규화 결과
- 정책에 쓰인 신원·선택값
satisfied_if: 사용자가 지정한 신원이 신뢰 신원으로 그대로 수용되지 않는다.
fail_criteria: 비신뢰 입력이 인가 신원이나 보호된 운영 선택값을 덮어쓴다.
unknown_criteria: 사용자 신원 전달 방식·앱 단위 권한 계약 또는 최종 소비값을 모른다.
remediation: 신뢰 주체가 신원을 설정하고 외부 위조값을 제거한다.
method_and_evidence: '외부 신원 header를 변경하고 Gateway의 덮어쓰기·엔진의 신뢰 principal·최종 인가 결과를 확인한다. 【F13】임의 tenant header를 vLLM이 주체로 인증한다고 볼 근거 없음. session/priority/DP rank/request ID는 소비되지만 신원 증명 아님. SageMaker header명은 외부 의존성 확인 필요. Gateway에서 외부 신원 header 제거·검증 후 재생성을 확인하고, 실제 소비되는 X-Vllm-Priority·X-Session-ID·X-data-parallel-rank·X-Request-Id 조작의 영향과 권한 검사를 각각 확인한다. 정상 대조: 허용 앱 계정과 검증된 사용자 신원으로 정상 요청·세션 처리'
remaining_setup: 신뢰 header 목록과 전달 책임; 모든 header를 사용자 인가로 간주하지 않음
executor: null
judge: null
