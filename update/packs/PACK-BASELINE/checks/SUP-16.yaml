question: 중단되거나 실패한 생성물·부분 파일을 완성된 자료로 사용하지 않는가?
scope: null
risk_category: 보안 위협·일반 장애 함께 점검
risk_summary: 부분 파일 변경권자가 미완료 자료를 바꿔 정상본처럼 소비시키거나 일반 다운로드·생성이 중단되어, 비승인 공급물 사용·잘못된 응답·로딩 장애가 생길 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 다운로드·변환·compile 등 파일 생성과 중단 경로를 확인한다. 사용 중인 생성 경로마다 부분 결과와 완료 상태를 대조한다.
policy_params: []
policy_prose:
  policy_to_decide: null
  enterprise_decisions: 캐시 위치·writer·완료/원자적 공개 규칙·정리 방식, 모델 구조·weights 값·dtype·양자화·TP·도구/장치·설정 중 생성물에 영향을 주는 조건과 호환성 근거. 무관한 설정 변경까지 일괄 삭제하지 않는다.
normal_control: 완료 표시와 필요한 파일이 모두 갖춰진 생성물만 사용한다.
challenge_steps:
- 격리 생성 중 안전한 중단
- 부분 파일·임시 manifest를 보존
- 재기동에서 재생성·거부와 소비 여부 확인
required_observations: []
required_observations_prose:
- 생성 완료 표시/파일 집합·임시 경로/재기동 처리·실제 읽기
satisfied_if: 부분 결과를 정상 캐시로 소비하지 않는다.
fail_criteria: 부분·중단 생성물을 완료 상태로 인정하고 소비한다.
unknown_criteria: 생성 완료 기준이나 중단 지점·재기동 소비를 확인하지 못했다.
remediation: '- 생성이 완료된 결과만 공개하도록 완료 표시와 파일 반영을 처리하고, 중단·실패한 부분 파일은 별도 위치에 격리한다. 재시도 시 부분 결과의 재사용 조건을 검사하고 잔여 파일을 정리한다.'
method_and_evidence: 단계별 중단 뒤 완료 표시·실제 소비·재생성 및 후속 정상 처리를 대조한다.
remaining_setup: 중단 가능한 시험 생성기와 안전한 복구 절차
