# REQ-01 구조화 (원본 checklist.json은 산문). import_checklist.py가 덧씌운다. SPEC §3·§7.2와 일치해야 한다.
applies_when:
  all:
    - { fact: gateway, eq: true }
policy_params:
  - { key: allowed_callers, type: "list[str]", required: true }
required_observations:
  - { key: routes_registered, type: "list[str]" }
  - { key: routes_tested, type: "list[str]" }
  - { key: direct_outcomes, type: "dict[str, int|outcome]" }
  - { key: gateway_outcomes, type: "dict[str, int]" }
  - { key: trusted_origin_reachable, type: bool }
  - { key: functional_probes_planned, type: "list[str]" }           # functional_probes의 "METHOD path" 목록
  - { key: functional_probe_results, type: "dict[str, pass|fail|no_response]" }
observation_notes:
  direct_outcomes: >-
    경로별 무키·오키 대표 직통 결과. (출발점·대상, 키) 조합의 TCP 연결 자체가 timeout/refused/unreachable이면
    HTTP 없이 모든 등록 경로(상태 변경 포함)를 그 값으로 기록(basis: tcp_connect, 추론). 연결되면 비상태변경 경로만 HTTP.
  routes_tested: 모든 (대상, 비허용 키) 조합의 직통 결과가 있는 경로. 연결되는 위상에서 상태 변경 경로는 미시험.
executor: direct_route
judge:
  plugin: rule_table
  params:
    pass_when_all:
      - { obs: routes_registered, op: nonempty }
      - { obs: routes_tested, op: superset_of, value_obs: routes_registered }
      - { obs: direct_outcomes, op: superset_of, value_obs: routes_registered }
      - { obs: direct_outcomes, op: all_in, value: [401, 403, refused, timeout, unreachable] }
      - obs: trusted_origin_reachable
        op: eq
        value: true
        when: { obs: direct_outcomes, op: any_in, value: [refused, timeout, unreachable] }
    fail_when_any:
      - { obs: direct_outcomes, op: any_between, value: [200, 299] }
    axes:
      functional:   # 목록(functional_probes)의 모든 항목이 기대대로 통과. 목록이 늘어도 이 표는 바뀌지 않는다
        pass_when_all:
          - { obs: functional_probe_results, op: nonempty }
          - { obs: functional_probe_results, op: superset_of, value_obs: functional_probes_planned }
          - { obs: functional_probe_results, op: all_in, value: [pass] }
        fail_when_any:
          - { obs: functional_probe_results, op: any_in, value: [fail] }
# 기능 축 표본: 허용 키로 Gateway 경유. 기대 코드가 아닌 HTTP 응답 = fail, 응답 없음 = no_response
functional_probes:
  - method: POST
    path: /v1/completions
    body: { model: "{model}", prompt: ping, max_tokens: 1 }
    expect: [200]
functional_scope: { probed_obs: functional_probe_results, of_obs: routes_registered }
