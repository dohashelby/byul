- 승인 시점 digest
- 변경 계정·시각
- 실제 열린 대상과 소비 시점
satisfied_if: 변경 자체를 제한하거나, 변경된 내용의 사용을 차단한다.
fail_criteria: 승인 후 교체된 비승인 자료가 제한 없이 소비된다.
unknown_criteria: 쓰기 거부만 확인했으나 다른 교체 경로 또는 실제 소비 대상을 확인하지 못했다.
remediation: 불변 객체·쓰기 제한·소비 전 검증 중 실제 경로에 맞는 조합을 적용한다
method_and_evidence: '격리된 사본으로 검사→배치→읽기 사이 교체를 시험하고 writer 권한·실제 읽기·거부를 기록한다. 【F34】VLLM_MODEL_REDIRECT_PATH가 설정되고 매핑 파일·대상 키가 존재할 때. 유효 env·redirect 파일 내용/digest·변경권한·resolved model/tokenizer 경로를 승인 묶음에 포함. 같은 표시명에 다른 무해 모델 경로를 넣어 승인 불일치 탐지 확인. 정상 대조: 승인한 redirect 매핑과 실제 파일로 정상 적재.'
remaining_setup: 교체 시점을 관측할 계측과 쓰기 권한별 시험 사본
