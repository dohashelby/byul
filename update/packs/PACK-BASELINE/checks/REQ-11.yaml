id: REQ-11
framework_id: CHK-REQ-011
mechanism_ids:
- mechanism-04
revision: 7
retired: false
area: REQ
purpose: 요청·결과 귀속
secondary_purposes: []
question: 동시 요청과 스트리밍 응답이 각각 올바른 요청자에게 돌아가는가?
scope: 기본
risk_category: 보안 위협 점검
risk_summary: 호출자가 요청 ID 충돌·동시 실행 조건을 유발할 수 있을 때 다른 사용자의 출력이 자기 연결로 전달되어 정보가 유출될 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  always: true
  prose: 일반·스트리밍 요청의 결과 귀속을 확인한다. 외부 ID·child·별도 시도는 실제 사용 시 추가한다.
policy_params:
- key: result_binding
  type: str
  required: true
- key: client_request_id_trust
  type: str
  required: true
policy_prose:
  policy_to_decide: 신원·ID 신뢰·결과 독자
  enterprise_decisions: 결과 독자·공유 관계·허용 응답/오류 필드, 입력 사본 반환 필요성, 취소 확정 시점·늦은 출력 처리, Gateway/SDK/엔진별 재시도, 저장 결과 기능. 결과 수신 권한과 반환 필드 권한을 각각 정한다.
normal_control: 고유 표식이 있는 A·B 일반·스트리밍 요청이 각각 올바른 연결로 반환된다.
challenge_steps:
- '일반 JSON 두 연결: 서버 생성 ID와 실제 소비 입력 귀속'
- '일반 JSON 두 연결: 서로 다른 body request_id와 실제 소비 입력 귀속'
- '일반 JSON 두 연결: 같은 body request_id 충돌에서도 원 연결 귀속'
- '일반 JSON 두 연결: 같은 X-Request-Id·다른 body ID와 헤더 우선순위'
- 'SSE 두 연결: 서버 생성 ID·chunk·종료와 실제 소비 입력 귀속'
- 'SSE 두 연결: 서로 다른 body request_id·chunk·종료 귀속'
- 'SSE 두 연결: 같은 body request_id 충돌·한쪽 느린 읽기와 원 연결 귀속'
- 'SSE 두 연결: 같은 X-Request-Id·다른 body ID·chunk·종료 귀속'
required_observations:
- key: profile_supported
  type: bool
- key: source_contract_verified
  type: bool
- key: template_identity_verified
  type: bool
- key: connection_binding_verified
  type: bool
- key: input_projection_verified
  type: bool
- key: output_binding_verified
  type: bool
- key: output_binding_gap
  type: str
- key: output_binding_cases_verified
  type: list[str]
- key: connection_overlap_verified
  type: bool
- key: tested_result_binding
  type: str
- key: tested_client_request_id_trust
  type: str
- key: cases_planned
  type: list[str]
- key: cases_attempted
  type: list[str]
- key: cases_verified
  type: list[str]
- key: security_violations
  type: list[str]
- key: collection_complete
  type: bool
- key: normal_controls
  type: bool
- key: functional_probes_planned
  type: list[str]
- key: functional_probe_results
  type: dict[str, outcome]
required_observations_prose:
- 서버 생성 ID·클라이언트 ID/chunk 순서·연결/각 요청 결과
satisfied_if: 결과가 다른 사용자·요청에 전달되지 않는다.
fail_criteria: 다른 요청의 결과·종료 신호가 잘못된 호출자에게 반환된다.
unknown_criteria: 응답 표식 또는 연결별 ID 대응을 확보하지 못했다.
remediation: '- 외부 요청·내부 실행·출력 수신 대상을 검증한 사용자와 작업 ID로 구분한다. 동시 요청과 스트리밍에서 응답 조각·종료 신호를 원래 요청에 반환하도록 상태 등록·전달 규칙을 유지한다.'
method_and_evidence: '두 합성 주체의 동시·스트리밍 요청에서 검증 신원→외부/내부 ID→worker/collector→연결·chunk·종료 신호를 대응시킨다. 외부 ID·child 기능을 실제 사용하면 동일 외부 ID 충돌과 내부 ID 분리의 영향을 대조하고 각 요청의 정상 결과를 확인한다. 【F17】기본 internal ID의 무작위 접미사와 유효 randomization 설정을 기록한다. 실제 등록된 abort 경로·자기 요청 취소·타 요청 영향은 CHK-REQ-012와 같은 ID 관측 자료를 공유하되, 이 행은 동시 결과·종료 신호의 수신자 귀속을 판정한다. 근거 원문: [F17](https://github.com/mg-princess/serving-security-framework/blob/8a0c7fe42446ff0d3a1f58e2a18cf3069d5c714e/data/checklist.json#L33452).'
remaining_setup: 작은 동시성·고유 무해 표식·응답 수집기
executor: request_binding
judge:
  plugin: rule_table
  params:
    fail_when_any:
    - obs: security_violations
      op: nonempty
    pass_when_all:
    - obs: profile_supported
      op: eq
      value: true
    - obs: source_contract_verified
      op: eq
      value: true
    - obs: template_identity_verified
      op: eq
      value: true
    - obs: tested_result_binding
      op: eq
      value_policy: result_binding
    - obs: tested_client_request_id_trust
      op: eq
      value_policy: client_request_id_trust
    - obs: cases_planned
      op: eq
      value:
      - json:generated
      - json:distinct_body
      - json:collision_body
      - json:collision_header
      - sse:generated
      - sse:distinct_body
      - sse:collision_body
      - sse:collision_header
    - obs: cases_verified
      op: superset_of
      value_obs: cases_planned
    - obs: input_projection_verified
      op: eq
      value: true
    - obs: connection_overlap_verified
      op: eq
      value: true
    - obs: output_binding_verified
      op: eq
      value: true
    - obs: output_binding_cases_verified
      op: superset_of
      value_obs: cases_planned
    - obs: collection_complete
      op: eq
      value: true
    - obs: normal_controls
      op: eq
      value: true
    axes:
      functional:
        pass_when_all:
        - obs: functional_probe_results
          op: superset_of
          value_obs: functional_probes_planned
        - obs: functional_probe_results
          op: all_in
          value:
          - pass
        - obs: normal_controls
          op: eq
          value: true
legacy:
  q_ids:
  - Q-C02
  scenario_ids:
  - SC-02-02
  subtest_ids:
  - Q-C02/SC-02-02
source:
  array: request_state_assessment_draft
functional_probes:
- method: POST
  path: /v1/chat/completions
  body:
    model: '{model}'
    messages:
    - role: user
      content: guard request binding control
    max_tokens: 1
  expect:
  - 200
  via: engine
limitations:
- 'REQ-11 rev7: 생성 출력 귀속을 요청별 배타 허용 token 오라클(exclusive-allowed-token-ids-v1)로 확인한다. 두 요청에 각자의 독립 tokenize 결과에만 있는 token을 allowed_token_ids로 주고, 각 연결의 출력 token이 모두 자기 집합 안이면 귀속 확인, 다른 연결의 배타 집합 token이 있으면 타 요청 출력 반환으로 FAIL이다. 엔진이 제약을 지키지 않았거나 응답이 불완전하면 UNKNOWN이다. rev3~6의 결과는 당시 규칙(보안 PASS 보류)으로 남는다.'
- input_projection_verified·connection_binding_verified·cases_verified는 소비 입력 projection과 연결/응답 형식의 하위 검증이다. 보안 PASS는 이와 함께 output_binding_verified=true와 8개 사례 모두의 output_binding_cases_verified가 필요하다. 생성 문장·usage 개수·클라이언트 ID는 오라클이 아니다.
- 출력 귀속 오라클은 엔진 sampler가 각 요청의 allowed_token_ids를 지킨다는 데 기댄다. 두 요청이 모두 제약을 벗어나 같은 방식으로 바뀐 출력(제약과 출력이 함께 교환)은 입력 projection 대조가 별도로 잡는다. 출력 내용의 품질·의미는 확인하지 않는다.
- request-connection-binding-v1은 고정 CPU text-chat profile에서 직접 엔진에 연결하는 두 합성 클라이언트의 일반 JSON·SSE 소비 입력 projection·연결·응답 형식만 확인한다. result_binding=originating_connection과 client_request_id_trust=untrusted_correlation은 기업의 원래 공유·신원 정책을 대체하지 않는 명시적 하위 정책이다. 다른 유효 정책값은 지원하지 않아 UNKNOWN으로 남긴다.
- 고정 이미지의 소비 측 prompt_token_ids·prompt_text 출처를 확인하고 독립 /tokenize 결과와 고정 template 렌더를 각 연결에서 정확히 대조한다. HTTP 200·usage 개수·클라이언트가 보낸 ID·모델의 임의 생성 문장이나 표식 우연 일치만으로 PASS하지 않는다.
- 서버 생성 ID·서로 다른 body ID·같은 body ID·같은 X-Request-Id와 다른 body ID의 네 경우를 일반·SSE에서 시험한다. 클라이언트가 제어하는 API ID의 충돌 자체는 FAIL이 아니다. 다른 연결의 정확한 소비 입력 반환·한 스트림 안 ID 변경은 확인된 독립 위반으로 보존한다. 종료 이후 data·중복 종료만으로는 타 요청으로 잘못 귀속됐다고 단정하지 않고 UNKNOWN으로 남긴다.
- 두 요청의 실제 송신 이후 수집 구간 중첩과 서로 다른 connection_id를 확인한다. 한쪽의 최대250ms 느린 읽기는 클라이언트 연결 수집 조건이다. CPU max_num_seqs=1에서 worker 내부 동시 실행·입력 소비 순서·서버 내부 ID 체인을 확인했다는 뜻이 아니다.
- 바이트·프레임·시간·요청·출력 상한, UTF-8·JSON/SSE 완전성, 모델·choice·종료·DONE·소비/출력 token 수가 모두 충족돼야 해당 표본을 검증했다고 기록한다. 일반 오류·누락·잘림·비UTF8·timeout은 UNKNOWN이며 앞서 수집한 독립 위반을 지우지 않는다. 새 요청 dispatch는 전체 시간 예산으로 제한하고 별도의 Docker 기동·읽기 전용 inspect·정리 시간은 보고한다.
- enterprise principal·권한·Gateway·SDK·child·내부 ID randomization on/off·취소/abort·재시도·지연된 저장 결과는 미시험이다. 상태 변경 요청은 보내지 않는다. 고정 소비 입력과 연결 귀속을 확인해도 생성 품질·성능·GPU·여러 실제 이미지의 업데이트 비교·보편적인 다중 사용자 격리를 인증하지 않는다.
