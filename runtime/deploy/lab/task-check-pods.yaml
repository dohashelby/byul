# Test-only Pods for k8s_lab_check.py --task-checks (L-07 SP4, L-08 SP1).
# They are created and deleted by each run. Do not reuse for real workloads.
apiVersion: v1
kind: Pod
metadata:
  name: test-receiver
  namespace: serving-lab
  labels: {app: test-receiver, purpose: task-check}
spec:
  automountServiceAccountToken: false
  containers:
    - name: receiver
      image: serving-runtime-lab:dev
      imagePullPolicy: IfNotPresent
      command: ["python", "-m", "http.server", "8080"]
      ports: [{containerPort: 8080}]
      securityContext:
        {runAsUser: 10003, runAsGroup: 10003, runAsNonRoot: true, allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
---
apiVersion: v1
kind: Pod
metadata:
  name: artifact-acquire
  namespace: serving-lab
  labels: {app: artifact-acquire, purpose: task-check}
spec:
  automountServiceAccountToken: false
  containers:
    - name: acquire
      image: serving-runtime-lab:dev
      imagePullPolicy: IfNotPresent
      command: ["sleep", "3600"]
      securityContext:
        {runAsUser: 10002, runAsGroup: 10002, runAsNonRoot: true, allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
---
# SP1: the acquire step (UID 10002) writes the supply; the engine step
# (UID 10001) mounts the same volume read-only and its own cache generation
# path writable. Mirrors pod-security-candidate.json from intent 1.1.
apiVersion: v1
kind: Pod
metadata:
  name: supply-check
  namespace: serving-lab
  labels: {app: supply-check, purpose: task-check}
spec:
  automountServiceAccountToken: false
  volumes:
    - name: serving-model
      emptyDir: {}
    - name: serving-cache
      emptyDir: {}
  initContainers:
    - name: acquire-step
      image: serving-runtime-lab:dev
      imagePullPolicy: IfNotPresent
      securityContext: {runAsUser: 10002, runAsGroup: 10002, runAsNonRoot: true, allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
      command: ["python", "-c", "from pathlib import Path; Path('/opt/serving/assets/model/approved.txt').write_text('approved supply\\n')"]
      volumeMounts:
        - {name: serving-model, mountPath: /opt/serving/assets/model, readOnly: false}
    # The engine account owns its cache generation directory before it is
    # mounted by subPath (kubelet-created subPath dirs may be root-owned).
    - name: cache-prep
      image: serving-runtime-lab:dev
      imagePullPolicy: IfNotPresent
      securityContext: {runAsUser: 10001, runAsGroup: 10001, runAsNonRoot: true, allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
      command: ["python", "-c", "import os; os.makedirs('/cache-root/vllm/lab-image/lab-revision/default', mode=0o755, exist_ok=True)"]
      volumeMounts:
        - {name: serving-cache, mountPath: /cache-root}
  containers:
    - name: engine
      image: serving-runtime-lab:dev
      imagePullPolicy: IfNotPresent
      command: ["sleep", "3600"]
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities: {drop: ["ALL"]}
      volumeMounts:
        - {name: serving-model, mountPath: /opt/serving/assets/model, readOnly: true}
        - {name: serving-cache, mountPath: /var/cache/serving/vllm/lab-image/lab-revision/default, subPath: vllm/lab-image/lab-revision/default}
