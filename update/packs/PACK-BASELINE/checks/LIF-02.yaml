question: 모델 취득이 실패해도 반복·재시도로 비용이 끝없이 쌓이지 않는가?
scope: 조건부; 원격 취득·retry
risk_category: 일반 장애·복구 점검
risk_summary: 공급원 장애 뒤 무제한 재시도·부분 자료가 누적되면 비용·저장공간이 고갈되고 서비스 준비가 지연될 수 있음. 공급자의 악의적 유발은 별도 조건.
review_order: conditional_when_selected
impact: null
applies_when:
  prose: 원격 취득 또는 SDK/도구의 재시도가 사용될 때 적용한다. 추론 retry와 취득 retry를 구분한다.
policy_params: []
policy_prose:
  policy_to_decide: retry 횟수·backoff·부분 자료 수명
  enterprise_decisions: 모델·GPU·부하·공정성·정상 기능/성능 요구, 초과 시 거부/중단/정리 방식, 취득 retry 허용과 부분 자료 처리.
normal_control: 일시 실패 뒤 허용 횟수 안의 정상 재시도로 취득한다.
challenge_steps:
- 시험 저장소에 제한된 실패 응답
- retry·backoff·누적 비용 관측
- 한도 도달 시 정지와 복구 확인
required_observations: []
required_observations_prose:
- attempt 횟수·시각/다운로드 누적량/최종 정지·임시파일
satisfied_if: 횟수·시간·비용 한도와 정리 조건을 지킨다.
fail_criteria: 실패 반복이 채택한 retry·비용 한도를 넘겨 계속된다.
unknown_criteria: retry 주체·중첩 계층·누적 비용을 알 수 없거나 한도가 미정이다.
remediation: '- 취득 재시도의 횟수·간격·총 시간·누적 비용을 제한한다. 중단된 실행과 부분 파일을 확인하고 같은 실패가 무한히 반복되지 않도록 중단·정리 조건을 적용한다.'
method_and_evidence: 중단·재시도 횟수·대기·누적 다운로드·부분 파일을 기록한다.
