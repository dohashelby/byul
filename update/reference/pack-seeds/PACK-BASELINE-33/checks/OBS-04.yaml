id: OBS-04
framework_id: CHK-OBS-004
mechanism_ids:
- mechanism-15
revision: 5
retired: false
area: OBS
purpose: 부가정보 수집·송신 통제
secondary_purposes: []
question: 금지한 사용 통계 보고가 실제로 꺼진 상태를 유지하는가?
scope: 내장 usage 경로·금지 정책 시
risk_category: 보안 위협 점검
risk_summary: usage 설정 변경권자가 opt-out 우선순위·설정 차이를 이용해 금지된 수집·외부 송신을 다시 활성화할 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 금지 정책에서는 내장 usage의 최초 판단·생성·송신이 중단되는지 확인한다. 허용 정책으로 바뀌면 허용 보고 점검과 연결한다.
policy_params:
- key: usage_allowed
  type: bool
  required: true
- key: usage_report_paths
  type: list[str]
  required: true
- key: usage_settings_fresh_process
  type: bool
  required: true
policy_prose:
  policy_to_decide: usage 허용 여부·적용 시점
  enterprise_decisions: 민감정보·수집 목적·허용 필드·목적지·주기, 진단 필요성/승인자. usage 허용은 정책 변경·필드/목적지/사본 검토·재시험 후에만 적용한다.
normal_control: usage 비사용 설정의 새 프로세스에서 정상 추론은 유지된다.
challenge_steps:
- 실제 통계 생성·송신 주체와 비활성 설정·적용 시점 확인
- 해당 엔진의 유효 설정을 적용한 새 실행에서 정상 추론 수행
- 초기·주기 보고 생성과 송신 시도·수신을 관측하고 이전 사본과 대조
required_observations:
- key: usage_policy_forbidden
  type: bool
- key: usage_effective_settings
  type: dict
- key: usage_settings_fresh_process
  type: bool
- key: usage_new_local_reports
  type: list
- key: usage_sink_receipts
  type: list
- key: usage_send_sensor_available
  type: bool
- key: functional_probes_planned
  type: list[str]
- key: functional_probe_results
  type: dict[str, pass|fail|no_response]
required_observations_prose:
- 실제 env·config path/최초 판단·새 보고/송신 관측·기존 파일 구분
satisfied_if: 정책이 금지한 생성/전송 단계가 수행되지 않는다. 환경변수 변경만으로 실행 중 중단을 가정하지 않는다.
fail_criteria: 참조정책에서 금지한 새 usage 보고 생성·송신이 확인된다.
unknown_criteria: 동일 프로세스의 cache 판단을 재사용했거나 송신 센서·보고 생성 계측이 없다. 수신 실패·timeout만 확인한 경우도 미확인으로 둔다.
remediation: '- usage opt-out의 실제 환경변수 판정식과 적용 시점을 확인하고 승인한 설정으로 새 프로세스를 기동한다. 금지한 보고 생성·송신 단계를 각각 제한·관측하고 기존 파일과 새 보고를 구분한다.'
method_and_evidence: 선정 엔진의 내장 통계 생성·송신 기능, 실제 비활성 설정과 적용 시점을 확인한다. 적용된 새 실행에서 초기·주기 보고의 생성·파일·송신 시도를 관측하고 이전 사본과 구분한다. 기능 부재는 설정·코드/등록 경로 등 해당 판본의 근거로 확인한다. 같은 송신 관측을 CHK-PLT-007과 공유하더라도 이 항목은 정책이 금지한 보고 생성·전송 단계의 수행 여부를 판정한다. 외부 목적지 차단만으로 로컬 보고 생성까지 중단됐다고 처리하지 않는다.
remaining_setup: 선정 엔진의 실제 비활성 설정·적용 시점과 보고 생성·송신 관측 수단; 수신 실패·timeout만으로 비전송을 판정하지 않음
executor: boundary_egress
judge:
  plugin: rule_table
  params:
    pass_when_all:
    - obs: usage_policy_forbidden
      op: eq
      value: true
    - obs: usage_settings_fresh_process
      op: eq
      value: true
    - obs: usage_send_sensor_available
      op: eq
      value: true
    - obs: usage_new_local_reports
      op: empty
    - obs: usage_sink_receipts
      op: empty
    fail_when_any:
    - obs: usage_new_local_reports
      op: nonempty
      when:
        obs: usage_policy_forbidden
        op: eq
        value: true
    - obs: usage_sink_receipts
      op: nonempty
      when:
        obs: usage_policy_forbidden
        op: eq
        value: true
    axes:
      functional:
        pass_when_all:
        - obs: functional_probe_results
          op: superset_of
          value_obs: functional_probes_planned
        - obs: functional_probe_results
          op: all_in
          value:
          - pass
        fail_when_any:
        - obs: functional_probe_results
          op: any_in
          value:
          - fail
legacy:
  q_ids:
  - Q-C11
  - Q-C07
  scenario_ids:
  - SC-22-01
  subtest_ids:
  - Q-C11/SC-22-01
source:
  array: observability_assessment_draft
collection_profile: usage-report-silence-v1
functional_probes:
- method: POST
  path: /v1/completions
  body:
    model: '{model}'
    prompt: ping
    max_tokens: 1
  expect:
  - 200
  via: engine
limitations:
- '구현 분기: 명시한 보고 파일을 정상 추론 전후로 비교하고, 소유 수신지가 있으면 새 수신 기록을 함께 본다. 금지 정책에서 새 보고가 생성되거나 수신되면 FAIL이다.'
- '미구현 분기: 소유 수신지 없이는 송신 센서가 없어 PASS에 도달하지 않는다. 수신 실패·timeout만으로 비전송을 판정하지 않는다.'
- real 구현만 있다. usage_settings_fresh_process는 준비 절차의 신고이며 실행기가 재기동하지 않는다. 명시하지 않은 경로와 주기 보고의 다음 주기는 확인하지 않는다.
