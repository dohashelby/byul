id: REQ-16
framework_id: CHK-REQ-016
mechanism_ids:
- mechanism-04
revision: 4
retired: false
area: REQ
purpose: 재사용 문맥의 호환성
secondary_purposes: []
question: 캐시 식별값이 재사용에 필요한 모델·설정·자료의 차이를 구분하는가?
scope: 기본+활성 기능
risk_category: 보안 위협 점검
risk_summary: 호출자가 구분되지 않는 모델·자료 식별값을 이용해 부적합한 cache를 재사용하게 하여 다른 요청 문맥이나 잘못된 결과를 소비하게 할 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 선정 cache를 재사용할 때 실제 key 문맥을 확인한다. adapter·media 등의 문맥은 해당 기능을 사용할 때만 추가한다.
policy_params:
- key: required_cache_contexts
  type: list[str]
  required: true
policy_prose:
  policy_to_decide: 공유 허용 관계·필수 문맥
  enterprise_decisions: 공유 단위(사용자/서비스 계정/tenant), 공개 prefix 공유 여부, 인증 주체 식별·salt 발급/덮어쓰기/검사 주체, 필요한 key 문맥, 비공개 정보와 공격자의 반복 관측 조건·통계 기준·성능 허용 범위. 같은 서비스 자격 뒤 여러 사용자가 있으면 추가 신원 전달이나 환경 분리가 필요한지 결정한다.
normal_control: 기본 모델·입력과 실제 활성 재사용 문맥이 같으면 기대한 캐시를 재사용한다. adapter·media는 해당 기능을 사용할 때만 정상 대조에 포함한다.
challenge_steps:
- 텍스트 기본과 현재 활성 문맥의 동일 입력 기준선
- 기본 모델의 승인 세대·입력 문맥 중 key에 영향을 주는 조건 하나를 변경하고, adapter 내용·media 식별은 실제 활성 기능에 한해 별도로 변형
- 바뀐 문맥의 cache key·hit·실제 소비와 출력을 비사용 또는 새 문맥 정상 대조와 비교
required_observations:
- key: declared_cache_context_evidence
  type: dict
required_observations_prose:
- 실제 cache key 구성/바뀐 객체 식별/hit·출력·승인 세대
satisfied_if: 허용하지 않은 문맥 사이에 잘못 재사용되지 않는다. 임의 hash 충돌 가능성을 결함으로 가정하지 않는다.
fail_criteria: 서로 다른 비공유 문맥이 같은 cache로 처리되어 잘못된 자료를 재사용한다.
unknown_criteria: 활성 key 구성·실제 객체 변경·재사용 효과를 확인하지 못했다.
remediation: '- 모델·입력·adapter·공유 집단 등 실제 재사용에 필요한 문맥을 캐시 키와 재사용 조건에 반영한다. 문맥이 바뀌면 이전 캐시를 구분하거나 무효화한다.'
method_and_evidence: 'token·모델 문맥 등 필요한 요소를 하나씩 바꿔 key·lookup·실제 소비를 비교한다.<br><br>**vLLM v0.31.0 구현 메모:** 【F16】미디어 UUID 및 runtime LoRA는 선택 기능. UUID가 있어도 hash factors는 반영됨. 동일 UUID에 다른 내용, 동일 LoRA 이름·경로의 가중치 교체 전후를 cache 사용/비사용 대조로 확인한다. 정상 대조: 새 UUID·새 LoRA 경로 및 cache 비사용 결과와 일치'
remaining_setup: 텍스트 기본과 MM·LoRA 선택 분기 분리; 충돌 fixture 선정
executor: null
judge: null
legacy:
  q_ids:
  - Q-C03
  - Q-C04
  - Q-C08
  scenario_ids:
  - SC-05-02
  subtest_ids:
  - Q-C03/SC-05-02
source:
  array: request_state_assessment_draft
limitations:
- required_cache_contexts={required_cache_contexts}는 기업이 정하는 전체 필수 문맥 목록이다. same_authenticated_group_private에서 model_generation·adapter_content·media_identity의 비어 있지 않은 고유 부분집합만 지원하며 미지원 항목을 잘라 맞추지 않는다.
- 문맥별 same_context/changed_context/post_control의 객체·key·hit·추론·첨부 연결을 DECLARED로 검토한다. 사건 순서·신뢰 신원·consumer·객체 변경·첨부 내용의 진위와 승인은 자동 인증하지 않는다.
- REQ-15 공개/교차 집단 보호와 REQ-17 통계·정보 유출은 미검증이다. 수동 신고 PASS의 상한만 적용하고 성능 PASS는 기준 부재로 UNKNOWN이다. 실제 캐시 실행기는 없다.
