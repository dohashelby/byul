id: PLT-10
framework_id: CHK-PLT-010
mechanism_ids:
- mechanism-12
revision: 3
retired: false
area: PLT
purpose: 권한 철회
secondary_purposes: []
question: 자격을 철회한 뒤 새 접근을 정한 기한 안에 거부하는가?
scope: 기본; 선정 issuer·정책 캐시
risk_category: 보안 위협 점검
risk_summary: 권한이 철회된 주체가 남은 자격·정책 반영 지연을 이용해 새 작업이나 자료 접근을 계속할 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 사용 중인 자격·권한의 철회 계약과 신규 접근 처리를 확인한다. 철회 정책·발급 주체 미정은 미확인이다.
policy_params:
- key: revocation_environment_sha256
  type: str
  required: true
- key: revocation_target_sha256
  type: str
  required: true
- key: revocation_prepared_sha256
  type: str
  required: true
- key: revocation_validity_start
  type: str
  required: true
- key: revocation_validity_end
  type: str
  required: true
- key: revocation_issuer_id
  type: str
  required: true
- key: revocation_event_id
  type: str
  required: true
- key: revocation_event_at
  type: str
  required: true
- key: revocation_deny_after
  type: str
  required: true
- key: revocation_deadline_basis
  type: str
  required: true
- key: revocation_propagation_limit_ms
  type: int
  required: true
- key: revocation_max_clock_skew_ms
  type: int
  required: true
- key: revocation_subject_label
  type: str
  required: true
- key: revocation_max_new_access_samples
  type: int
  required: true
policy_prose:
  policy_to_decide: 철회 대상·전파 기한
  enterprise_decisions: 철회 대상·issuer·정책 캐시, 진행 요청과 기존 세션 처리, 자격 교체·사본 정리 담당과 근거.
normal_control: 철회 전 허용 자격으로 신규 접근이 가능하다.
challenge_steps:
- 시험 자격 철회
- 정한 간격의 소수 신규 접근
- 철회 시각부터 거부까지 측정
required_observations:
- key: revocation_trials
  type: list
- key: revocation_auth_bindings
  type: list
- key: revocation_conflict_candidates
  type: list
- key: revocation_missing
  type: list
- key: revocation_absolute_denial_constraint_violated
  type: bool
- key: revocation_issuer_event_verified
  type: bool
- key: revocation_provider_propagation_verified
  type: bool
- key: revocation_normal_before_issuer_verified
  type: bool
- key: revocation_new_connection_receipt_verified
  type: bool
- key: revocation_scope_complete
  type: bool
required_observations_prose:
- 철회 사건/신규 연결·작업 시각/identity·거부 결과
satisfied_if: 정한 기한 이후 비허용 신규 접근이 거부된다.
fail_criteria: 정한 철회 기한 이후에도 신규 접근이 허용된다.
unknown_criteria: 기한이 미정이거나 캐시·provider 전파·실제 신규 연결을 확인하지 못했다.
remediation: '- 자격 철회 기준과 기한을 정하고 실제 권한 발급·검사 위치에 반영한다. key·권한 캐시의 갱신·무효화와 새 접근의 거부 결과를 확인한다.'
method_and_evidence: 철회 시각과 이후 새 연결·갱신·객체 접근을 정상 대조와 기록한다.
remaining_setup: 철회 기한·시험 자격·시간 동기화
executor: credential_revocation
judge:
  plugin: rule_table
  params:
    pass_when_all:
    - obs: revocation_trials
      op: nonempty
    - obs: revocation_absolute_denial_constraint_violated
      op: eq
      value: false
    - obs: revocation_issuer_event_verified
      op: eq
      value: true
    - obs: revocation_provider_propagation_verified
      op: eq
      value: true
    - obs: revocation_normal_before_issuer_verified
      op: eq
      value: true
    - obs: revocation_new_connection_receipt_verified
      op: eq
      value: true
    - obs: revocation_scope_complete
      op: eq
      value: true
    fail_when_any:
    - obs: revocation_absolute_denial_constraint_violated
      op: eq
      value: true
      when:
        obs: revocation_issuer_event_verified
        op: eq
        value: true
    axes:
      functional:
        pass_when_all: []
        fail_when_any:
        - obs: revocation_absolute_denial_constraint_violated
          op: eq
          value: true
legacy:
  q_ids:
  - Q-C10
  scenario_ids:
  - SC-19-01
  subtest_ids:
  - Q-C10/SC-19-01
source:
  array: platform_assessment_draft
collection_profile: kubernetes-credential-revocation-observation-v1
limitations:
- '구현 분기: 고정 GET /v1/models 5회로 철회 전후 정상 대조와 retired 자격의 신규 접근을 native 인증·handler 기록과 결합한다. 명시 absolute-unconditional 기한을 넘긴 수락은 기능 축 독립 FAIL이다.'
- '미구현 분기: issuer 사건·전파·철회 전 정상·새 연결 영수증의 독립 근거 수집이 없어 보안 PASS와 보안 FAIL은 현재 도달하지 않는다. 규칙은 근거가 들어오면 그대로 적용된다.'
- kubernetes 구현만 있다. lab=true/vLLM 0.31의 native8 prepared 세션이 필요하고, 일반 protected endpoint·Gateway·TLS는 범위 밖이다. 401/403·HTTP 200만으로 PLT-10 전체를 판정하지 않는다.
- 자격 원문·해시·응답 원문을 증거에 저장하지 않는다. 실제 issuer 변경·키 삭제·세션 종료는 수행하지 않는다. 기존 session과 사본 처리는 PLT-11·PLT-12에서 따로 본다.
