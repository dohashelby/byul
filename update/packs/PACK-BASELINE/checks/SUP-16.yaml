question: 중단·실패한 생성 결과나 부분 파일을 완료된 결과로 사용하지 않는가?
scope: null
risk_category: 보안 위협·일반 장애 함께 점검
risk_summary: 부분 파일 변경권자가 미완료 자료를 바꿔 정상본처럼 소비시키거나 일반 다운로드·생성이 중단되어, 비승인 공급물 사용·잘못된 응답·로딩 장애가 생길 수 있음.
review_order: reference_baseline_first
