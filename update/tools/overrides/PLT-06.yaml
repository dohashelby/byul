executor: unix_ipc
collection_profile: worker-trust-scope-v1
policy_params:
  - { key: worker_isolation_requirement, type: str, required: true }
  - { key: worker_trust_group_markers, type: "list[str]", required: true }
required_observations:
  - { key: worker_trust_group_map, type: list }
  - { key: worker_shared_resources, type: list }
  - { key: worker_isolation_violations, type: list }
  - { key: worker_trust_groups_missing, type: list }
  - { key: worker_trust_map_complete, type: bool }
  - { key: worker_command_impact_verified, type: bool }
judge:
  plugin: rule_table
  params:
    pass_when_all:
      - { obs: worker_trust_map_complete, op: eq, value: true }
      - { obs: worker_isolation_violations, op: empty }
      - { obs: worker_command_impact_verified, op: eq, value: true }
    fail_when_any:
      - { obs: worker_isolation_violations, op: nonempty }
limitations:
  - "구현 분기: 실제 프로세스의 UID·namespace·공유 메모리·장치·socket을 정책의 신뢰 그룹 표식별로 지도화한다. 독립 UID를 요구했는데 두 그룹이 UID를 공유하면 FAIL이다."
  - "미구현 분기: 편입된 시험 worker의 송신 권한·명령 영향과 보완 통제의 효과는 수집하지 않아 PASS에 도달하지 않는다."
  - "real 구현만 있다. 프로세스 이름 표식은 역할 인증이 아니며 같은 UID 안의 역할별 인가를 가정하지 않는다. 읽지 못한 프로세스가 있으면 범위 미완결이다."
