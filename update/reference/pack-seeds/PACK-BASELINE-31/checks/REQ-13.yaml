id: REQ-13
framework_id: CHK-REQ-013
mechanism_ids:
- mechanism-14
revision: 4
retired: false
area: REQ
purpose: 반환 정보 최소 공개
secondary_purposes:
- 요청·대상 접근 권한
question: 응답 옵션과 오류 메시지가 수신자에게 허용된 정보만 반환하는가?
scope: 기본+지원 옵션
risk_category: 보안 위협 점검
risk_summary: 호출자가 반환 옵션·오류 경로를 이용해 볼 권한이 없는 서버 측 문맥·내부 정보까지 응답으로 받을 수 있음. 자신의 허용 입력 반환과 구분.
review_order: reference_baseline_first
impact: null
applies_when:
  always: true
  prose: 기본 응답·오류를 확인한다. 추가 반환 옵션이 금지돼 있어도 요청 수용·제거·거부를 확인하며, 허용 시 필드·독자별로 추가한다.
policy_params:
- key: allowed_response_fields
  type: list[str]
  required: true
- key: allowed_error_fields
  type: list[str]
  required: true
- key: forbidden_return_options
  type: list[str]
  required: true
- key: required_targets
  type: list[str]
  required: true
policy_prose:
  policy_to_decide: 응답 독자·필드·비공개 문맥 범위
  enterprise_decisions: 결과 독자·공유 관계·허용 응답/오류 필드, 입력 사본 반환 필요성, 취소 확정 시점·늦은 출력 처리, Gateway/SDK/엔진별 재시도, 저장 결과 기능. 결과 수신 권한과 반환 필드 권한을 각각 정한다.
normal_control: 일반 응답과 안전한 오류가 허용된 필드만 반환한다.
challenge_steps:
- 선정 대상 정상 응답과 허용 필드 대조
- 비공개 system 문맥과 금지 반환 옵션 시험
- 안전한 오류와 후속 정상 대조
required_observations:
- key: response_coverage_complete
  type: bool
- key: response_coverage_gaps
  type: list[str]
- key: response_cases_tested
  type: list[str]
- key: response_fields_seen
  type: list[str]
- key: error_fields_seen
  type: list[str]
- key: response_options_returned
  type: list[str]
- key: response_options_tested
  type: list[str]
- key: response_targets_tested
  type: list[str]
- key: private_markers_returned
  type: list[str]
- key: functional_probes_planned
  type: list[str]
- key: functional_probe_results
  type: dict[str, outcome]
required_observations_prose:
- 실제 요청 옵션/Gateway 제거·거부/원응답·오류·독자 권한
satisfied_if: 비허용 문맥·내부 자료가 반환되지 않는다. 팀 참조 구성에서는 prompt 원문·token ID 추가 반환 옵션을 차단한다. 기업에서 자기 입력 사본 반환을 허용하려면 정책을 변경하고 독자·필드별 권한을 확인한다. 정상 생성 결과가 자기 입력을 인용하는 것과 추가 반환 옵션은 구별한다.
fail_criteria: 금지 옵션이 살아남거나 비허용 내부·system·자격 표식이 응답에 나타난다.
unknown_criteria: 특정 옵션이나 오류 경로를 실행하지 못했거나 직통 접근 결과를 모른다.
remediation: '- 독자에게 허용할 응답 필드·반환 옵션·오류 정보를 정하고 실제 전달 경로에 적용한다. 엔진에 해당 제한 기능이 없으면 Gateway 등 지원하는 위치에서 제한하고 직통 접근도 함께 관리한다.'
method_and_evidence: 합성 비공개 표식으로 정상·오류·반환 옵션별 출력과 독자 정책을 비교한다. 반환 가능한 모든 표식을 실제 소비 경로에 배치한다. 올바른 수신자에게 반환됐는지와 반환 필드가 그 수신자에게 허용되는지를 각각 판정한다. 앱이 넣은 합성 비공개 system 표식으로 return_prompt_text·return_token_ids를 요청해 Gateway/직통 및 등록 alias에서 비교한다. 선택 코드의 반환 분기에는 별도 운영자 차단 gate가 없으므로 Gateway 거부/제거와 직통 제한을 집행점으로 확인한다. echo·prompt_logprobs·logprobs는 해당 API의 필드·허용 정보별로 따로 판정한다. 오류에는 /workspace/x·s3://bucket/key·가짜 자격 표식을 사용한다. 같은 입력으로 생성된 로그·dump의 필드·문맥은 CHK-OBS-003에서, 저장된 관측 사본의 조회·반출·암호화는 CHK-OBS-006에서 각각 판정한다.
remaining_setup: 합성 민감 표식과 허용 반환 필드 목록
executor: response_content
judge:
  plugin: rule_table
  params:
    pass_when_all:
    - obs: response_coverage_complete
      op: eq
      value: true
    - obs: response_fields_seen
      op: subset_of
      value_policy: allowed_response_fields
    - obs: error_fields_seen
      op: subset_of
      value_policy: allowed_error_fields
    - obs: response_options_returned
      op: none_in
      value_policy: forbidden_return_options
    - obs: response_options_tested
      op: eq
      value_policy: forbidden_return_options
    - obs: response_targets_tested
      op: eq
      value_policy: required_targets
    - obs: private_markers_returned
      op: eq
      value: []
    fail_when_any:
    - obs: response_fields_seen
      op: not_subset_of
      value_policy: allowed_response_fields
    - obs: error_fields_seen
      op: not_subset_of
      value_policy: allowed_error_fields
    - obs: response_options_returned
      op: any_in
      value_policy: forbidden_return_options
    - obs: private_markers_returned
      op: nonempty
    axes:
      functional:
        pass_when_all:
        - obs: functional_probe_results
          op: superset_of
          value_obs: functional_probes_planned
        - obs: functional_probe_results
          op: all_in
          value:
          - pass
        fail_when_any:
        - obs: functional_probe_results
          op: any_in
          value:
          - fail
legacy:
  q_ids:
  - Q-C02
  - Q-C11
  scenario_ids:
  - SC-21-01
  subtest_ids:
  - Q-C11/SC-21-01
source:
  array: request_state_assessment_draft
limitations:
- 정책의 required_targets에 명시한 engine/Gateway 및 단일 completions/chat-completions endpoint만 시험한다. stream·alias·저장 결과·독자 신원 귀속 전체를 검증하지 않는다.
- 비공개 system 표식은 chat messages에 실제 제출하고 정상 200 응답을 확인하는 범위다. 모델 내부 token 소비 계측은 없고, completions-only 환경은 해당 분기 UNKNOWN이다. 자기 입력·오류 입력의 인용은 비공개 system 누출과 구분한다.
- 반환 옵션의 200 응답만으로 거부·제거를 증명하지 않는다. 실제 추가 반환은 관측하고, 효과가 없는 200은 accepted/ignored 불명으로 UNKNOWN이다. 안전 4xx 외 서버 오류·인증 실패는 거부 성공으로 세지 않는다.
- 응답 JSON leaf 경로를 정책과 대조한다. 안전 오류는 max_tokens에 무해 표식을 넣는 검증 오류 한 종류이며 실제 비공개 서버 경로·자격·모든 내부 오류의 부재를 증명하지 않는다.
