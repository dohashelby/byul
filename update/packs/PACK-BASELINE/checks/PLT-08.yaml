limitations:
- explicit-owned-api-plaintext-v1은 명시 guard_probe_to_owned_direct_api 구간에 한해 소유 bridge API의 /v1/completions 정상 HTTP 응답을 대조한다. 배포 호출 앱·Gateway의 실제 경로를 대신하지 않는다.
- CID·network/endpoint ID·IP·포트·평문 금지 여부·유효창은 필수 POL이며 값·예외·기본 금지를 관측에서 보충하지 않는다. 정책 불일치는 HTTP 전 차단한다.
- 같은 제품 실행의 기존 LIF-04 수집을 재사용한다. HTTP-only 수집기·고정 IP의 소유 endpoint 전후 안정성·source guard·정상 완전 응답과 source 시간창이 맞는 명시 금지 평문 성공만 독립 FAIL이다. 임의 JSON import나 URL scheme만으로 판정하지 않는다.
- LIF-04의 bounded slow read·close·병행 정상 요청도 같은 수집 절차에서 실행한다. 이 부가 수집의 누락이 확인된 초기 정상 HTTP 응답을 지우지 않는다. 스트림 시간 측정·LIF-04 판정 의미는 변경하지 않는다.
- 평문 허용·거부·timeout·인증 실패·미수집은 전체 PASS가 아니라 UNKNOWN이다. 암호학적 peer 인증·TLS handshake/종료·재암호화·인증서·IPC/TP·무결성 변조·전체 배포 경로는 미검증이다.
- 출처는 기존 수집의 DECLARED 상한과 EXAMPLE을 유지한다. 실제 엔진 기동·모델 다운로드는 수행하지 않으며 과거 EVD·팩에 소급하지 않는다.
