id: PLT-09
framework_id: CHK-PLT-009
mechanism_ids:
- mechanism-16
revision: 3
retired: false
area: PLT
purpose: 통신 상대·전송 보호
secondary_purposes: []
question: 엔진에서 기록 수집기와 최종 저장소까지 필요한 전송 보호가 유지되는가?
scope: 조건부; 외부 수집·저장 경로
risk_category: 보안 위협 점검
risk_summary: 전송 구간을 관찰·변경할 수 있는 주체가 평문·검증 없는 연결을 이용해 관측 자료를 읽거나 collector를 사칭해 기록을 바꿀 수 있음.
review_order: conditional_when_selected
impact: null
applies_when:
  prose: 외부 collector 또는 별도 sink로 관측 자료를 보낼 때 적용한다. 엔진→collector와 collector→sink를 따로 확인한다.
policy_params:
- key: record_transport_segments
  type: list[str]
  required: true
- key: record_tls_required_segments
  type: list[str]
  required: true
policy_prose:
  policy_to_decide: 수집·저장 대상과 구간별 보호
  enterprise_decisions: 구간별 배치·자료·위협 주체, TLS/상대 확인·자격 방식, 내부 IPC 보호 전제와 예외. 다중 노드는 선택 시 별도 검토한다.
normal_control: 엔진→collector→sink의 승인 기록이 지정 종단으로 전달된다.
challenge_steps:
- 각 구간의 실제 연결 주체·송수신 도구·protocol·보호 요구 확인
- 시험 인증서·수신지 불일치 적용
- 연결 거부·실제 수신과 정상 복구 비교
required_observations:
- key: record_transport_trials
  type: list
- key: record_transport_segments_planned
  type: list[str]
- key: record_transport_segments_tested
  type: list
- key: record_transport_unprotected
  type: list
- key: record_transport_wrong_peer_accepted
  type: list
- key: record_transport_unreachable
  type: list
- key: record_transport_sender_verified
  type: bool
required_observations_prose:
- 엔진·수집기·저장소 사이 실제 전송/수집 방식, 연결 주체·종단과 송수신 도구/라이브러리 판본·유효 설정
- 구간별 실제 protocol·상대 인증·보호 채널·수신 결과와 잘못된 상대 연결의 처리
satisfied_if: 어느 구간도 필요한 보호에서 누락되지 않는다.
fail_criteria: TLS·상대 확인을 요구한 구간에서 비보호 전송 또는 다른 수신지가 허용된다.
unknown_criteria: URL scheme만 보고 SDK 동작·후속 구간을 확인하지 못했다.
remediation: '- 엔진에서 관측 수집기까지, 수집기에서 최종 저장소까지 각 전송 구간의 상대 검증·보호 설정을 적용한다. proxy·SDK·중계 구간을 포함해 실제 목적지와 보호 상태를 확인한다.'
method_and_evidence: 각 구간의 실제 송수신 구성요소·종단·상대 확인·자격·전송 보호와 수신 기록을 대조한다. push/pull에 따라 연결을 시작하는 주체와 TLS 종료점을 확인하고 잘못된 상대·인증서를 거부하는지 정상 연결과 비교한다.
remaining_setup: 실제 송수신 도구·수집기·저장소 설정과 채택한 보호 채널의 시험 자격/인증서; 자격 원문 미수집
executor: api_transport
judge:
  plugin: rule_table
  params:
    pass_when_all:
    - obs: record_transport_segments_tested
      op: superset_of
      value_obs: record_transport_segments_planned
    - obs: record_transport_unprotected
      op: empty
    - obs: record_transport_wrong_peer_accepted
      op: empty
    - obs: record_transport_sender_verified
      op: eq
      value: true
    fail_when_any:
    - obs: record_transport_unprotected
      op: nonempty
    - obs: record_transport_wrong_peer_accepted
      op: nonempty
legacy:
  q_ids:
  - Q-C07
  - Q-C11
  scenario_ids:
  - SC-24-01
  - SC-24-02
  subtest_ids:
  - Q-C07/SC-24-01
  - Q-C07/SC-24-02
source:
  array: platform_assessment_draft
collection_profile: record-transport-segments-v1
limitations:
- '구현 분기: 구간별 실제 송신 쪽 컨테이너에서 TLS 핸드셰이크와 잘못된 서버 이름의 거부를 시험한다. TLS를 요구한 구간이 비보호이거나 다른 상대를 받으면 FAIL이다.'
- '미구현 분기: 실제 송신 SDK·도구의 설정과 sink 수신 대조가 없어 PASS에 도달하지 않는다. 연결 불가 구간은 거부 근거가 아니라 미확인이다.'
- real 구현만 있다. 구간은 설정의 record_segments로 명시하며 시험 자격·기록 본문을 보내지 않는다.
