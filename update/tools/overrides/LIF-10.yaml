executor: request_termination
collection_profile: kubernetes-request-termination-observation-v1
policy_params:
- key: termination_environment_sha256
  type: str
  required: true
- key: termination_target_sha256
  type: str
  required: true
- key: termination_validity_start
  type: str
  required: true
- key: termination_validity_end
  type: str
  required: true
- key: termination_max_delay_ms
  type: int
  required: true
- key: termination_required_scopes
  type: list[str]
  required: true
required_observations:
- key: termination_attempts
  type: list
- key: termination_native_events
  type: list
- key: termination_deadline_conflict_candidates
  type: list
- key: termination_required_scope_status
  type: list
- key: termination_binding_observed
  type: bool
- key: termination_scope_complete
  type: bool
- key: worker_gpu_release_verified
  type: bool
judge:
  plugin: rule_table
  params:
    pass_when_all:
    - obs: termination_binding_observed
      op: eq
      value: true
    - obs: termination_scope_complete
      op: eq
      value: true
    - obs: worker_gpu_release_verified
      op: eq
      value: true
    - obs: termination_deadline_conflict_candidates
      op: empty
    fail_when_any: []
