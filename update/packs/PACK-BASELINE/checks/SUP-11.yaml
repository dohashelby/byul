area: SUP
purpose: 추가 코드 실행 허용
secondary_purposes: []
question: 지원하는 실행 방식마다 외부 모듈을 불러오는 제한이 유지되는가?
scope: null
risk_category: 보안 위협 점검
risk_summary: 모듈 경로를 지정할 수 있는 주체가 실행 모드별 import 검사 차이를 이용해 비승인 코드를 실행시킬 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 선정 엔진·확장에 동적 import 소비 경로가 있을 때 적용한다. 지원 실행 모드와 외부 설정의 효과를 함께 확인한다.
policy_params: []
policy_prose:
  policy_to_decide: null
  enterprise_decisions: 필요한 모델 코드·plugin·모드·권한·공급 방식, 승인/변경 절차. auto_map 존재만으로 실행이나 거부를 확정하지 않고 실제 선택되는 코드 출처를 확인한다.
normal_control: 지원한다고 선언한 각 실행 모드가 승인 import 목록으로 기동한다.
challenge_steps:
- 지원 mode별 import 기준선 확보
- 선택 가능한 무해 외부 module 경로를 입력
- 실제 import 또는 거부 위치 확인
required_observations: []
required_observations_prose:
- mode·entrypoint·module 선택값/import 파일/설정 집행 결과
satisfied_if: 지원하는 각 실행 모드에서 허용하지 않은 외부 모듈 로딩을 거부하고 정상 로딩은 가능하다.
fail_criteria: 지원 mode에서 승인 밖 dynamic import가 허용된다.
unknown_criteria: 지원 mode 목록 또는 실제 import 대상을 확인하지 못했다.
remediation: '- 지원하는 각 실행 모드에서 동적 import를 허용하는 모듈·경로·설정값을 제한한다. 보안 검사를 최적화 옵션으로 제거될 수 있는 assertion과 분리하고 실행 전에 유효성을 검사한다.'
method_and_evidence: 지원 모드마다 허용/비허용 대상을 비교하고 검사·import 기록을 확인한다.
remaining_setup: 지원 실행 모드 확정과 import 계측
