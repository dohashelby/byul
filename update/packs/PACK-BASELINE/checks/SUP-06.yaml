limitations:
- '구현 분기: native 읽기 bytes와 rank별 기록을 함께 본다. 필수 부분이 없는데 준비 완료를 기록하면 FAIL이다.'
- '미구현 분기: 공유·원격 weights의 publisher·payload 대응과 필수 tensor 정의, 실제 rank 적재 tensor는 수집하지 않는다.'
- kubernetes 구현만 있다. 실행기는 엔진을 만들거나 바꾸지 않는다. 정상·변경 기동은 준비 절차가 만들고 target·prepared로 받으며, 두 세션을 각각 수집해 합치지 않는다.
