normal_control: 승인한 불변 파일 경로로 일반·스트리밍 요청을 처리한다.
challenge_steps:
- 격리 사본 승인
- 읽기 전 파일·symlink·마운트 중 허용된 시험 변경 하나 수행
- 실제 소비 식별정보와 거부 결과 확인
