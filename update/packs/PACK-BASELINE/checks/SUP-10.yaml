id: SUP-10
framework_id: CHK-SUP-010
revision: 2
retired: false
area: SUP
purpose: 코드 실행 제한
framework_purpose: 추가 코드 실행 허용
mechanism_ids:
- mechanism-09
secondary_purposes: []
question: 승인하지 않은 플러그인을 실행하기 전에 허용 여부를 검사하는가?
scope: null
risk_category: 보안 위협 점검
risk_summary: 확장 설치·선택 권한자가 plugin 필터의 적용 차이를 이용해 비승인 factory·코드를 엔진 권한으로 실행시킬 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 설치된 entry point와 자동 발견 그룹을 기본 조사한다. 실제 설치·도달하는 general·endpoint·logits·io 그룹별로 확인한다.
policy_params: []
policy_prose:
  policy_to_decide: null
  enterprise_decisions: 필요한 모델 코드·plugin·모드·권한·공급 방식, 승인/변경 절차. auto_map 존재만으로 실행이나 거부를 확정하지 않고 실제 선택되는 코드 출처를 확인한다.
normal_control: 승인된 plugin만 등록된 환경에서 필요한 기능이 정상 동작한다.
challenge_steps:
- 설치 entry point와 plugin group 수집
- 비승인 무해 plugin을 격리 환경에 등록
- group별 import·호출과 제한 결과 확인
required_observations: []
required_observations_prose:
- 실제 설치·도달하는 확장 종류·등록/선택 경로와 설치 목록·승인 범위
- 종류별 유효 제한 설정, 실제 로딩·import·hook 호출 또는 거부와 허용 기능 결과
satisfied_if: general·endpoint·logits_processors·io processor 등 실제 설치·도달하는 각 그룹에서 승인된 설치물만 로딩되고 필요한 정상 기능이 유지된다. VLLM_PLUGINS 설정 하나로 모든 그룹을 통과시키지 않는다.
fail_criteria: 해당 group에 요구한 제한을 우회해 비승인 plugin이 실행된다.
unknown_criteria: group 등록만 확인하고 실제 runner·hook 도달이나 제한을 확인하지 못했다.
remediation: '- 자동 발견되는 plugin 종류와 실제 호출 경로를 조사하고 종류별 허용 목록을 적용한다. plugin을 불러오거나 실행하기 전에 승인 여부를 검사하고 필요 없는 확장을 비활성화한다.'
method_and_evidence: 선정 엔진에서 실제 설치·도달하는 확장 종류와 발견·선택·import·호출 순서를 목록화한다. 종류별 승인 설치물·허용 설정을 실제 로딩과 대조하고, 승인 확장과 무해한 비승인 시험 확장의 실행·거부를 각각 확인한다. 한 종류의 필터 결과로 다른 종류를 대신 판정하지 않는다.
remaining_setup: 선정 엔진의 확장 종류별 승인 목록·제한 설정과 무해 시험 확장; 실제 실행기·호출 경로 확인
