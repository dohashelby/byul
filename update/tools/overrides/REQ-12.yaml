executor: request_termination
collection_profile: kubernetes-request-attempt-observation-v1
policy_params:
- key: attempt_environment_sha256
  type: str
  required: true
- key: attempt_target_sha256
  type: str
  required: true
- key: attempt_validity_start
  type: str
  required: true
- key: attempt_validity_end
  type: str
  required: true
required_observations:
- key: request_attempt_trials
  type: list
- key: request_attempt_native_bindings
  type: list
- key: request_attempt_native_events
  type: list
- key: request_attempt_conflict_candidates
  type: list
- key: request_attempt_unbound_asgi_events
  type: list
- key: native_attempt_binding_observed
  type: bool
- key: late_delivery_verified
  type: bool
- key: automatic_retry_verified
  type: bool
- key: request_attempt_scope_complete
  type: bool
- key: request_attempt_asgi_events
  type: list
- key: asgi_invocation_binding_observed
  type: bool
- key: request_attempt_output_events
  type: list
- key: request_attempt_output_links
  type: list
- key: native_output_collector_binding_observed
  type: bool
judge:
  plugin: rule_table
  params:
    pass_when_all:
    - obs: native_attempt_binding_observed
      op: eq
      value: true
    - obs: native_output_collector_binding_observed
      op: eq
      value: true
    - obs: request_attempt_scope_complete
      op: eq
      value: true
    - obs: late_delivery_verified
      op: eq
      value: false
    - obs: request_attempt_conflict_candidates
      op: empty
    fail_when_any:
    - obs: late_delivery_verified
      op: eq
      value: true
