id: REQ-09
framework_id: CHK-REQ-009
mechanism_ids:
- mechanism-03
revision: 10
retired: false
area: REQ
purpose: 최종 입력 검증
secondary_purposes: []
question: 지원하는 모델 입력의 값·길이·차원과 구성요소의 정합성이 실제 모델·처리 단계의 허용 범위 안에 있는가?
scope: 기본 token·길이; 실제 지원 embedding·mask 정합성과 독립된 offset 입력 범위
risk_category: 보안 위협·일반 장애 함께 점검
risk_summary: 호출자가 범위 밖 token ID·길이를 제출해 예외·잘못된 계산을 유발할 수 있음. 공유 엔진 중단·타 요청 피해는 실제 경로와 영향 확인 필요.
review_order: reference_baseline_first
impact: MEDIUM
applies_when:
  always: true
  prose: 활성 입력 endpoint의 token·길이·변환 후 값을 선정 모델·runner 기준으로 확인한다. embedding을 실제 지원·수용하면 consumer가 요구하는 값·차원/shape·필요 dtype·입력 길이와 token/embedding·선택 mask의 대응을 추가 확인한다. routed_experts_prompt_start 등 offset 파라미터를 수용하면 embedding 사용이나 관련 출력 기능의 활성 여부와 별개로 그 의미·형식·유효 위치 범위를 확인한다. 금지·미지원 입력은 실제 거부·제거 근거와 지원 범위를 기록한다.
policy_params:
- key: max_input_tokens
  type: int
  required: true
- key: rejection_codes
  type: list[str]
  required: true
- key: allowed_endpoints
  type: list[str]
  required: true
- key: allowed_input_formats
  type: list[str]
  required: true
- key: allowed_input_pairs
  type: list[str]
  required: true
policy_prose:
  policy_to_decide: 서비스 입력 한도; 구현상 유효 범위는 코드 근거로 확정
  enterprise_decisions: 허용 endpoint·텍스트/직접 token 등 입력 형식, template override 필요성, 옵션·길이·출력 한도·정상 대조 입력. vocab·버퍼 범위·옵션 필수 관계 등 구현상 제약은 기업 정책으로 완화하지 않는다.
normal_control: 선정 tokenizer·모델의 유효 ID와 길이 경계 안 요청이 정상 처리된다. embedding 지원 경로에서는 consumer 규칙에 맞는 값·shape/차원·dtype와 token/mask 대응을 가진 정상 입력을 실제 지원 조합에서 대조한다. offset 파라미터는 embedding·관련 출력의 활성 여부와 별개로 허용 범위 안 값이 정상 처리됨을 확인한다.
challenge_steps:
- 정상 token-array 대조 후 범위 밖 token ID 시험
- 길이 한도 밖 시험과 후속 정상 대조
required_observations:
- key: accepted_challenges
  type: list[str]
- key: challenge_outcomes
  type: dict[str, outcome]
- key: challenges_planned
  type: list[str]
- key: functional_probes_planned
  type: list[str]
- key: functional_probe_results
  type: dict[str, outcome]
- key: input_endpoints_tested
  type: list[str]
- key: input_formats_tested
  type: list[str]
- key: challenge_rejection_results
  type: dict[str, outcome]
- key: challenge_consumption
  type: dict[str, outcome]
- key: confirmed_input_violations
  type: list[str]
- key: input_matrix_planned
  type: list[str]
- key: input_matrix_cases
  type: list
- key: input_matrix_complete
  type: bool
required_observations_prose:
- 모델 vocab·처리 단계별 유효 범위와 입력 제한·집행 위치, 허용된 절단·변환 조건
- 실제 지원 embedding의 값·차원/shape·필요 dtype·입력 길이와 token/embedding·mask 대응 규칙 및 제출/변환/소비값
- offset 파라미터의 수용 경로·의미·형식·입력 길이에 따른 유효 위치 범위, embedding·관련 출력의 유효 설정과 독립된 offset 거부/소비 결과
- 실제 거부 지점·후속 worker/모델 제출의 도달/미도달, 메모리 오류·상태·후속 정상 요청 결과; 단위 mock과 실제 설치 경로의 증거 구분
satisfied_if: 채택한 입력 제한과 실제 consumer의 값·길이·차원/shape·필요 dtype·정합성 요구를 각 집행 위치에서 지키고 정상 입력은 처리된다. embedding·token/mask의 대응과, 별도로 수용하는 offset의 의미·유효 위치 범위가 유지되며 비허용 입력은 후속 소비 전에 제한된다. 절단·변환을 허용하면 채택한 방식·시점과 변환 뒤 소비값을 확인한다.
fail_criteria: 채택한 입력 제한이나 실제 consumer의 token·길이·embedding 값/차원/shape/필요 dtype·token/mask 정합성 또는 독립된 offset 유효 범위를 위반한 값이 해당 제한 지점을 넘어 수용·소비된다. 비허용 메모리 접근·상태 오염·다른 요청의 피해는 발생 여부와 증거를 별도로 기록한다.
unknown_criteria: 적용할 제한·정합성 규칙·집행 위치·허용된 절단/변환 조건 또는 최종 소비값을 확인하지 못했다. 오류 응답만 있고 의도한 입력 처리기/모델 제출 경계의 실제 거부·미도달을 확인하지 못한 부분은 미확인으로 남긴다. 이미 확인한 제한·정합성 위반은 후속 영향의 증거 부족과 구분해 미충족으로 기록한다.
remediation: '- 실제 모델·consumer의 token·길이와 지원 입력의 값·차원/shape·필요 dtype·정합성을 해당 집행 위치에서 검사한다. embedding·token/mask의 대응과 별도로 수용하는 offset의 의미·형식·유효 위치를 검증하고 비허용 값을 후속 소비 전에 제한한다. 절단·변환을 허용하면 방식·시점과 변환 뒤 소비값을 명시한다. vocab·버퍼 범위 등 구현상 제약을 유지하고 오류는 요청 단위에서 처리한다.'
method_and_evidence: 모델·처리 단계별 token/길이 유효 범위와 채택한 입력 제한·집행 위치를 정하고 정상·경계·범위 밖 입력의 실제 소비값을 대조한다. embedding 지원 경로에서는 consumer의 값·차원/shape·필요 dtype와 token/embedding·mask 대응을 정상 입력과 한 요소가 어긋난 작은 무해 입력으로 비교한다. routed_experts_prompt_start 등 수용 offset은 embedding 사용·관련 출력 활성 여부와 별개로 의미·형식·유효 위치 범위를 확인한다. 거부·정규화와 후속 worker/모델 제출의 도달/미도달을 기록한다. 허용한 절단·변환은 적용 시점과 변환 뒤 값을 확인한다. 제한·정합성 결과와 메모리 접근·상태 오염·다른 요청 영향은 각각 기록한다.
remaining_setup: 선정 모델·endpoint·consumer의 token/길이 범위, embedding 값·차원/shape·필요 dtype·token/mask 대응 및 별도로 수용하는 offset의 규칙, 작은 경계 fixture와 실제 거부·모델 제출 경계를 확인할 계측
executor: input_validation
judge:
  plugin: rule_table
  params:
    pass_when_all:
    - obs: input_matrix_complete
      op: eq
      value: true
    - obs: challenge_outcomes
      op: nonempty
    - obs: challenges_planned
      op: eq
      value:
      - token_id
      - length
    - obs: challenge_outcomes
      op: superset_of
      value_obs: challenges_planned
    - obs: challenge_outcomes
      op: all_in
      value_policy: rejection_codes
    - obs: challenge_rejection_results
      op: superset_of
      value_obs: challenges_planned
    - obs: challenge_rejection_results
      op: all_in
      value:
      - verified
    - obs: input_endpoints_tested
      op: eq
      value_policy: allowed_endpoints
    - obs: input_formats_tested
      op: eq
      value_policy: allowed_input_formats
    fail_when_any:
    - obs: confirmed_input_violations
      op: nonempty
    axes:
      functional:
        pass_when_all:
        - obs: functional_probe_results
          op: superset_of
          value_obs: functional_probes_planned
        - obs: functional_probe_results
          op: all_in
          value:
          - pass
        - obs: input_endpoints_tested
          op: eq
          value_policy: allowed_endpoints
        - obs: input_formats_tested
          op: eq
          value_policy: allowed_input_formats
        fail_when_any:
        - obs: functional_probe_results
          op: any_in
          value:
          - fail
legacy:
  q_ids:
  - Q-C04
  - Q-C06
  scenario_ids:
  - SC-04-01
  subtest_ids:
  - Q-C04/SC-04-01
source:
  array: request_state_assessment_draft
functional_probes:
- method: POST
  path: /v1/completions
  body:
    model: '{model}'
    prompt:
    - 0
    max_tokens: 1
  expect:
  - 200
  via: engine
- method: POST
  path: /v1/chat/completions
  body:
    model: '{model}'
    messages:
    - role: user
      content: hello
    max_tokens: 1
  expect:
  - 200
  via: engine
collection_profile: input-matrix-v1
limitations:
- REQ-09 revision 6은 HTTP 상태·검토된 원인별 거부·실제 소비를 구분한다. accepted_challenges는 구 형식의 HTTP 2xx 목록이며 새 정의의 FAIL 근거가 아니다. 오류 객체·불완전 응답·정상 생성 형태만으로 금지 입력 소비나 피해를 확정하지 않는다.
- 실제 consumer·메모리 접근·상태 오염을 이 프로파일만으로 증명하지 않으므로 challenge_consumption은 unknown이고 confirmed_input_violations는 비어 있다. 확인된 독립 위반 또는 신고 FAIL은 다른 관측 누락으로 지우지 않는다. PASS는 명시한 입력 조합의 원 거부 지점과 전후 정상 대조가 별도 소스/GPU 자격을 갖춘 제한된 프로파일만 뜻한다.
- REQ-09 정책 허용 endpoint={allowed_endpoints}, 입력 형식={allowed_input_formats}. 정책 목록은 실제 등록·승인이나 parser 소비의 증명이 아니다.
- input-matrix-v1은 allowed_input_pairs의 METHOD path|format 조합을 모두 실행한다. 조합의 endpoint·format 집합은 전체 allowed_endpoints·allowed_input_formats와 일치해야 한다. 지원하지 않는 조합을 제외하거나 다른 조합으로 대신하지 않고 실행 전에 거부한다. 이전 정의의 단일 token-array 제한은 과거 정의 재판정에서 그대로 유지한다.
- 각 token_ids 조합의 양수 vocab 상한·길이 경계와 각 text 조합의 작은 길이 경계를 시험하며 조합마다 전후 정상 대조를 보존한다. 원 source·실제 요청 fixture·기존 SDK·새 투영의 별도 자격이 없으면 거부를 verified로 올리지 않는다. 정상 HTTP 응답만으로 소비·전체 parser/변환·embedding/mask/offset·기업 승인 진위를 증명하지 않는다.
- input_endpoints_tested·input_formats_tested와 input_matrix_cases는 실제 제출 범위다. 정책·원 거부 지점의 일치 및 알려진 모델/consumer 한도의 근거를 별도로 확인한다. 결과·본문에서 정책 값을 보충하지 않으며 모든 경계 조합을 검증했다고 표시하지 않는다.
