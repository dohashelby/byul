name: All 69 paired readiness inventory

on:
  push:
    branches: [codex/all69-preflight-20261126]

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.3"
      - name: Verify frozen product source
        run: git diff --exit-code 22e6e83d4fe26074c3c6c6e5e68742863f5239fe -- update contracts reference
      - run: python -m pip install uv==0.12.11
      - run: uv sync --frozen
        working-directory: update
      - name: Inventory every active check on both versions
        working-directory: update
        env:
          PYTHONPATH: src:.
        run: uv run --frozen python ../.github/scripts/all69_readiness_inventory.py --output "$RUNNER_TEMP/byul-all69"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: all69-paired-preflight
          path: ${{ runner.temp }}/byul-all69
          if-no-files-found: error
          retention-days: 7
