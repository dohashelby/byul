id: SUP-10
revision: 1
retired: false
area: SUP
purpose: 코드 실행 제한
secondary_purposes: []
question: 플러그인 허용 제한이 실제 실행 전에 적용되는가?
scope: null
risk_category: 보안 위협 점검
risk_summary: 확장 설치·선택 권한자가 plugin 필터의 적용 차이를 이용해 비승인 factory·코드를 엔진 권한으로 실행시킬 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 설치된 entry point와 실제 loader/runner 도달; 명시 활성 설정 없이 자동 발견하는 그룹 포함
policy_params: []
policy_prose:
  policy_to_decide: null
  enterprise_decisions: 필요한 모델 코드·plugin·모드·권한·공급 방식, 승인/변경 절차. auto_map 존재만으로 실행이나 거부를 확정하지 않고 실제 선택되는 코드 출처를 확인한다.
normal_control: 승인된 plugin만 등록된 환경에서 필요한 기능이 정상 동작한다.
challenge_steps:
- 설치 entry point와 plugin group 수집
- 비승인 무해 plugin을 격리 환경에 등록
- group별 import·호출과 제한 결과 확인
required_observations: []
required_observations_prose:
- general·endpoint·logits group 목록
- VLLM_PLUGINS 유효값
- 실제 import·hook 호출
satisfied_if: general·endpoint·logits_processors 그룹별로 승인 설치물만 실제 로딩되고 필요한 정상 기능이 유지된다. VLLM_PLUGINS 설정 하나로 모든 그룹을 통과시키지 않는다.
fail_criteria: 해당 group에 요구한 제한을 우회해 비승인 plugin이 실행된다.
unknown_criteria: group 등록만 확인하고 실제 runner·hook 도달이나 제한을 확인하지 못했다.
remediation: 소비 경로별 허용 목록과 실행 권한을 제한하고 필요 없는 확장을 비활성화한다
method_and_evidence: 'general/endpoint plugin 각각의 발견·import·factory·필터 순서를 대조한다. general·endpoint·logits_processors 그룹의 설치목록·허용명·실제 load를 각각 대조한다. logits_processors loader에는 VLLM_PLUGINS 필터가 없으므로 승인 패키지 설치 제한과 실제 도달을 확인한다. 승인된 무해 plugin과 비승인 시험 plugin을 격리 환경에서 비교한다. 【F12】설치 entry point와 실제 runner 별 조사. V1 TPU는 custom logitsprocs 제외. io processor는 init 또는 hf_config 선택 시. general/endpoint/logits/io 각 그룹의 설치 목록·배포 승인·로딩을 따로 확인. 격리 시험에서 무해 import 표식으로 VLLM_PLUGINS 제한 뒤 logits import 여부, io config 선택을 기록. 정상 대조: 추가 plugin 없는 승인 이미지로 정상 추론; 허용 환경에서는 승인 plugin만 기능 정상.'
remaining_setup: group별 무해 plugin과 선정 runner; VLLM_PLUGINS가 모든 group을 보호한다고 가정하지 않음
