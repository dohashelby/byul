id: REQ-05
revision: 1
retired: false
area: REQ
purpose: 요청·대상 접근 권한
secondary_purposes: []
question: 호출자의 모델 사용권이 최종 선택 대상에도 적용되는가?
scope: 기본+선택 기능
risk_category: 보안 위협 점검
risk_summary: 호출자가 모델 이름·alias·adapter 등 선택 경로를 바꿔 허용받지 않은 모델을 사용하거나 비승인 실물을 실행시킬 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 기본 모델 1개에서도 확인, adapter는 활성 시
policy_params: []
policy_prose:
  policy_to_decide: 호출자별 모델·adapter 허용 관계
  enterprise_decisions: 인증 방식·실제 계정, 사용자/조직별 모델·작업 허용표, 직통 허용 주체·목적, 관리 역할, Gateway의 신원 전달·경로 변환과 선택 API. 저장 결과 기능을 쓰면 객체 소유자·조회·취소 권한도 결정한다.
normal_control: 호출자가 허용된 기본 모델을 사용한다.
challenge_steps:
- 활성 모델 선택 경로 목록 확보
- 표시명·adapter·대체 endpoint 선택값 변경
- 최종 모델·파일 선택과 인가 대조
required_observations: []
required_observations_prose:
- 역할×모델 허용표
- 선택값
- 최종 모델·adapter·실제 소비
satisfied_if: 허용 밖 모델·adapter가 실행되지 않는다. 실제 파일 승인 여부는 공급물 영역과 별도 판정한다.
fail_criteria: 허용되지 않은 최종 모델이나 adapter가 선택·사용된다.
unknown_criteria: API 표시명만 확인했거나 조건부 resolver·endpoint의 최종 대상을 모른다.
remediation: 최종 선택 대상에 사용권을 검사하고 alias와 실물을 연결한다.
method_and_evidence: '모델 이름 생략·별칭·비허용 이름과 최종 선택 모델을 신원별로 비교한다. 정상 허용 호출도 확인한다. 【F20】MM 기본 LoRA, resolver, SageMaker adapter 주입은 조건부. 외부 SageMaker decorator의 정확한 header/검증은 미확인. model 필드 외 활성 selector를 목록화하고 최종 선택 adapter·revision·경로까지 인가 대조한다. 정상 대조: 허용 기본 모델/adapter 정상'
remaining_setup: 활성 endpoint별 모델 선택 계측; 설치된 추가 기능만 시험
