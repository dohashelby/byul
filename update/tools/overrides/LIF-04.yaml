executor: stream_buffer
collection_profile: kubernetes-stream-buffer-observation-v1
policy_params:
- key: buffer_environment_sha256
  type: str
  required: true
- key: buffer_target_sha256
  type: str
  required: true
- key: buffer_prepared_sha256
  type: str
  required: true
- key: buffer_validity_start
  type: str
  required: true
- key: buffer_validity_end
  type: str
  required: true
- key: buffer_max_write_bytes
  type: int
  required: true
- key: buffer_max_process_rss_bytes
  type: int
  required: true
- key: buffer_max_send_wait_ms
  type: int
  required: true
- key: buffer_release_deadline_ms
  type: int
  required: true
- key: buffer_read_chunk_bytes
  type: int
  required: true
- key: buffer_read_interval_ms
  type: int
  required: true
- key: buffer_read_max_reads
  type: int
  required: true
- key: buffer_close_chunk_bytes
  type: int
  required: true
- key: buffer_close_interval_ms
  type: int
  required: true
- key: buffer_close_max_reads
  type: int
  required: true
- key: buffer_debug_mode
  type: str
  required: true
required_observations:
- key: buffer_http_trials
  type: list
- key: buffer_native_samples
  type: list
- key: buffer_cases
  type: list
- key: buffer_missing
  type: list
- key: buffer_conflict_candidates
  type: list
- key: buffer_producer_authenticated
  type: bool
- key: buffer_inventory_complete
  type: bool
- key: buffer_release_verified
  type: bool
- key: buffer_scope_complete
  type: bool
judge:
  plugin: rule_table
  params:
    pass_when_all:
    - obs: buffer_producer_authenticated
      op: eq
      value: true
    - obs: buffer_inventory_complete
      op: eq
      value: true
    - obs: buffer_release_verified
      op: eq
      value: true
    - obs: buffer_scope_complete
      op: eq
      value: true
    - obs: buffer_missing
      op: empty
    fail_when_any: []
