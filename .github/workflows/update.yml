name: UPDATE and shared contracts

on:
  push:
    branches: [main, "codex/**", byul_update]
    paths:
      - ".github/workflows/update.yml"
      - ".github/workflows/runtime-platform.yml"
      - ".github/scripts/update_ci_relevance.py"
      - ".github/update-ci-paths.txt"
      - "update/**"
      # Prose-only docs skip CI; the docs tests read stay listed (test_workflow_paths.py checks this).
      - "!update/docs/**/*.md"
      # Top-level prose (SPEC·README·PROGRESS·DECISIONS·CLAUDE·AGENTS) is not read by code either.
      - "!update/*.md"
      - "update/docs/AUTOMATION_HARDENING.md"
      - "update/docs/AUTOMATION_PHASE1.md"
      - "update/docs/AUTOMATION_PHASE2.md"
      - "update/docs/AUTOMATION_PHASE3.md"
      - "update/docs/CHECKLIST_VALIDATION_STATUS.md"
      - "update/docs/POLICY_M12.md"
      - "update/docs/POLICY_M14.md"
      - "update/docs/UPDATE_SELECTION.md"
      - "update/docs/UPDATE_VALIDATION.md"
      - "update/docs/b-lif07/PR171_SOURCE_CONSUMPTION.md"
      - "update/docs/b-lif07/WORKER_READINESS.md"
      - "update/docs/b-lif13/WEIGHTS_LIFETIME.md"
      - "update/docs/dev-1/ma6-version-applicability.md"
      - "update/docs/dev-1/req10-initial-v1-source-review-20261115.json"
      - "update/docs/dev-1/ma3-rank-fault-producer.md"
      - "update/docs/dev-1/fresh-request-binding.md"
      - "update/docs/dev-1/ma3-rpc-gpu-observations-20261114.json"
      - "update/docs/dev-1/ma3-product-binding-preparation-20261115.json"
      - "update/docs/dev-1/ma3-rpc-common-preparation-20261115.json"
      - "update/docs/dev-1/ma3-rpc-product-preparation-20261115.json"
      - "update/docs/dev-1/ma3-image-qualification-20261114.md"
      - "update/docs/dev-1/ma3-image-qualification-20261114.json"
      - "update/docs/dev-1/ma7-req16-model-candidate.json"
      - "update/docs/dev-1/ma7-gpu-preflight-20261114.json"
      - "update/docs/WORK_ORDER_VLLM_MVP.md"
      - "update/docs/dev-1/ma6-change-path-review.json"
      - "update/docs/evidence/sup08-code-selection-20261111.json"
      - "update/docs/evidence/sup08-canonical-gpu-20261114.json"
      - "update/docs/evidence/gpu-a-SUP-08-20261114.json"
      - "update/docs/dev-1/ma8-poc-fixture-contract.json"
      - "update/docs/dev-1/ma8-local-fixture-manifest.json"
      - "update/docs/dev-1/ma8-local-preparation-20261113.json"
      - "update/docs/dev-1/ma8-local-preflight-20261113.json"
      - "update/docs/dev-1/ma8-local-preflight-pack35-20261114.json"
      - "update/docs/dev-1/ma8-local-preflight-pack36-20261115.json"
      - "update/docs/dev-1/ma7-file-preflight-20261115.json"
      - "update/docs/dev-1/ma7-rank-input-link-20261115.json"
      - "update/docs/dev-1/ma7-rank-product-link-20261115.json"
      - "update/docs/dev-1/ma7-input-preflight.md"
      - "update/docs/gpu-a/RESULTS-20261111-SUP08.md"
      - "update/docs/dev-1/ma7-session-input-plan.json"
      - "update/examples/mvp-confirmed-values.yaml"
      - "update/docs/gpu-a/policy-a-draft.yaml"
      - "update/docs/dev-1/ma7-local-materialization-20261113.json"
      - "update/docs/dev-1/req17-split-collection.md"
      - "contracts/**"
      - "platform/api/**"
      - "platform/web/**"
      - "platform/scripts/**"
      - "runtime/src/**"
      - "runtime/labtools/**"
      - "runtime/pyproject.toml"
      - "runtime/uv.lock"
      - "update/docs/dev-1/mvp-enterprise-policy-20261118.json"
  # PR은 항상 실행하고 job 단위에서 건너뛴다. 경로 필터로 workflow 자체를 건너뛰면 필수 검사가 Pending에 남는다.
  pull_request:

permissions:
  contents: read

# Keep push and PR verification independent; supersede only the same event/ref.
concurrency:
  group: update-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/update_ci_relevance.py >> "$GITHUB_OUTPUT"

  # Early diagnostics run in parallel with the existing required jobs.
  update-preflight:
    name: Update pin and profile preflight
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: update
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.3"
      - name: Report pin and profile inconsistencies
        shell: bash
        env:
          PYTHONPATH: src
        run: python -B -m tools.ci_preflight | tee -a "$GITHUB_STEP_SUMMARY"

  update-default:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    # Python 3.12.3 is pinned for the native sensor contracts and is not published for Ubuntu 26.04
    # (ubuntu-latest from 2026-11). Keep the runner that the pinned interpreter supports.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: update
    steps:
      - uses: actions/checkout@v7
        with:
          # Pinned-commit tests read history with git show.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          # Native sensor code contracts are exact per interpreter; POSIX supports 3.12.3.
          python-version: "3.12.3"
      - run: python -m pip install uv==0.12.11
      - run: uv sync --frozen
      - name: Compile update sources before the full suite
        run: uv run python -m compileall -q src/guard tools
      - name: Record paired transition source ABI
        run: |
          uv run --frozen python - <<'PY'
          import os
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from guard.models import canonical_json
          from tests.test_mvp_transition_dependency_abi import CONNECTION_FIXTURE, stage_source_fixtures
          from tools.mvp_transition_dependency_abi import measure

          with TemporaryDirectory(prefix="byul-transition-abi-", dir=os.environ["RUNNER_TEMP"]) as staged:
              root = Path(staged)
              stage_source_fixtures(root)
              report = measure(
                  root / "baseline", root / "candidate", include_weight_iteration=True,
                  baseline_connection=CONNECTION_FIXTURE, candidate_connection=CONNECTION_FIXTURE,
              )
              line = canonical_json({"source": os.environ["GITHUB_SHA"], "report": report}).decode("utf-8")
              print("BYUL_TRANSITION_SOURCE_ABI " + line, flush=True)
          PY
      - name: Measure default suite parent wall clock
        run: |
          uv run --project ../platform/api --frozen --with-editable . --with-editable ../runtime --with pytest-xdist==3.8.0 python - <<'PY'
          import os
          import subprocess
          import sys
          import time

          start = time.perf_counter()
          result = subprocess.run([sys.executable, "-m", "pytest", "-q", "-n", "auto", "--durations=50",
              "--basetemp", os.path.join(os.environ["RUNNER_TEMP"], "byul-update-pytest")])
          print(f"Default suite parent wall clock: {time.perf_counter() - start:.3f}s", flush=True)
          raise SystemExit(result.returncode)
          PY
      - run: uv build --wheel
      - name: Verify installed wheel outside checkout
        run: uv run python tools/verify_installed.py --wheel dist/guard-0.1.0-py3-none-any.whl --output "${{ runner.temp }}/byul-update-installed"

  observer-cpython-3128:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: update
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.8"
      - run: python -m pip install uv==0.12.11
      - run: uv sync --frozen
      - name: Reproduce immutable observer contracts from source
        run: python -B -I tools/observer_abi.py
      - name: Verify configured lifecycle and exact interpreter refusal
        run: |
          uv run --python 3.12.8 python - <<'PY'
          import os
          import subprocess
          import sys
          import tempfile
          import time

          start = time.perf_counter()
          with tempfile.TemporaryDirectory(prefix="byul-observer-pyc-", dir=os.environ["RUNNER_TEMP"]) as cache:
              result = subprocess.run([sys.executable, "-X", "pycache_prefix=" + cache, "-m", "pytest", "-q",
                  "tests/test_observer_abi.py", "tests/test_configured_lifecycle.py",
                  "tests/test_baseline_startup_dependency_review.py",
                  "tests/test_fresh_request_binding.py", "tests/test_rank_v1_source_reviews.py", "tests/test_rank_v1_worker_binding.py",
                  "tests/test_release_observation_variants.py", "tests/test_ma6_baseline_startup.py",
                  "tests/test_ma6_baseline_profiler.py", "tests/test_ma6_baseline_stream.py",
                  "tests/test_ma6_baseline_slot_sampling.py", "tests/test_ma6_baseline_graph.py",
                  "tests/test_ma6_baseline_attention_metadata.py", "tests/test_ma6_baseline_profiler_local.py",
                  "--basetemp", os.path.join(os.environ["RUNNER_TEMP"], "byul-observer-3128")])
          print(f"Observer 3.12.8 parent wall clock: {time.perf_counter() - start:.3f}s", flush=True)
          raise SystemExit(result.returncode)
          PY

  update-docker-stub:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: update
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.11
      - run: uv sync --frozen
      - name: Measure Python 3.12 Docker stub and probe suite
        run: |
          uv run python - <<'PY'
          import os
          import subprocess
          import sys
          import time

          start = time.perf_counter()
          result = subprocess.run([sys.executable, "-m", "pytest", "-q", "-m", "docker",
              "tests/test_lab_docker.py", "--basetemp", os.path.join(os.environ["RUNNER_TEMP"], "byul-update-docker")])
          print(f"Docker stub parent wall clock: {time.perf_counter() - start:.3f}s", flush=True)
          raise SystemExit(result.returncode)
          PY
      - name: Record Python helper image identity
        run: |
          docker image inspect python:3.12-slim --format '{{json .RepoDigests}}'
          docker run --rm --network none --cpus 1 --memory 128m python:3.12-slim python -c "import sys; print(sys.version); assert sys.version_info[:2] == (3, 12)"

  shared-contracts:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.11
      - name: Validate shared schemas, examples and reference hashes
        run: uv run --no-project --with jsonschema python contracts/tools/check_contracts.py

  platform-update-contracts:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: platform/api
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.3"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/web/package-lock.json
      - run: npm ci
        working-directory: platform/web
      - run: npm run build
        working-directory: platform/web
      - run: npm test
        working-directory: platform/web
      - run: python -m pip install uv==0.12.11
      - run: uv sync --frozen
      - name: Verify platform contracts and read-only RPT projection
        run: |
          # Bundle export tests invoke the installed runtime CLI, including its package metadata.
          uv run --frozen --with-editable ../../update --with-editable ../../runtime python - <<'PY'
          import os
          import subprocess
          import sys
          import time

          start = time.perf_counter()
          result = subprocess.run([sys.executable, "-m", "pytest", "-q", "--durations=20",
              "--basetemp", os.path.join(os.environ["RUNNER_TEMP"], "byul-platform-api-pytest")])
          print(f"Platform API parent wall clock: {time.perf_counter() - start:.3f}s", flush=True)
          raise SystemExit(result.returncode)
          PY
      - name: Verify built web and installed Guard on the same checkout
        run: |
          env -u PYTHONPATH uv run --frozen --with-editable ../../update --with-editable ../../runtime python - <<'PY'
          from pathlib import Path
          import json
          import subprocess
          import sys
          from tempfile import TemporaryDirectory

          import yaml

          from fastapi.testclient import TestClient
          from byul_platform.config import REPO_ROOT, Settings
          from byul_platform.main import create_app

          with TemporaryDirectory() as data:
              root = Path(data)
              update = REPO_ROOT / 'update'
              env_example = update / 'examples/env.yaml'
              policy = yaml.safe_load((update / 'examples/policy.yaml').read_text(encoding='utf-8'))
              policy['scope'] = {'include': ['REQ-01'], 'exclude': []}
              policy_file = root / 'policy.yaml'
              policy_file.write_text(yaml.safe_dump(policy), encoding='utf-8')
              for side, version, digest in [('baseline', '1', 'a'), ('candidate', '2', 'b')]:
                  environment = yaml.safe_load(env_example.read_text(encoding='utf-8'))
                  environment['engine'].update(name='vllm', version=version,
                      image_digest=f'example/engine@sha256:{digest * 64}')
                  (root / f'{side}.yaml').write_text(yaml.safe_dump(environment), encoding='utf-8')
              config = root / 'guard.toml'
              config.write_text('[adapter]\nname = "fake"\n[executors]\ndirect_route = "fake"\n', encoding='utf-8')
              reports = root / 'reports'
              subprocess.run([sys.executable, '-m', 'guard.cli', 'update',
                  '--pack', str(update / 'packs/PACK-BASELINE'),
                  '--baseline', str(root / 'baseline.yaml'), '--candidate', str(root / 'candidate.yaml'),
                  '--policy', str(policy_file), '--config', str(config),
                  '--store', str(root / 'store'), '--output', str(reports)],
                  cwd=update, check=True, timeout=60)
              report_file, = reports.glob('*/report.json')
              raw = json.loads(report_file.read_bytes())
              ref = {'kind': 'RPT', 'id': raw['id'], 'revision': raw['revision'], 'sha256': raw['content_sha256']}
              assert raw['data_origin'] == 'EXAMPLE' and raw['execution_attempt_id']
              settings = Settings(platform_data_dir=root / 'platform', update_python=Path(sys.executable),
                  update_reports_dir=reports, update_config_file=config)
              with TestClient(create_app(settings)) as client:
                  assert client.get('/update/results').status_code == 200
                  assert client.get('/api/update/execution-settings').json()['available'] is True
                  assert client.get('/api/update/results').json()['items'][0]['report_ref'] == ref
              with TestClient(create_app(settings)) as client:
                  response = client.get('/api/update/results/' + ref['id'],
                      params={'revision': ref['revision'], 'sha256': ref['sha256']})
                  assert response.status_code == 200, response.text
                  assert response.json()['item']['report_ref'] == ref
          PY

  # Relevant changes require every verification job on this checkout.
  update-ci-ok:
    if: always()
    needs: [changes, update-preflight, update-default, observer-cpython-3128, update-docker-stub, shared-contracts, platform-update-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
        run: |
          echo "job results for $GITHUB_SHA: $RESULTS"
          case "$RELEVANT" in true|false) ;; *) exit 1 ;; esac
          for result in $RESULTS; do
            case "$result" in
              success) ;;
              skipped) test "$RELEVANT" = false || exit 1 ;;
              *) exit 1 ;;
            esac
          done
