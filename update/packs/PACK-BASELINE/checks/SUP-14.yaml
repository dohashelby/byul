id: SUP-14
framework_id: CHK-SUP-014
mechanism_ids:
- mechanism-10
revision: 3
retired: false
area: SUP
purpose: 필수 검사 결과 집행
secondary_purposes: []
question: 필수 검사가 실패하거나 오류·미지원·생략으로 끝나면 통과시키지 않는가?
scope: null
risk_category: 보안 위협·일반 장애 함께 점검
risk_summary: 제출자가 검사 오류·미지원 상태를 유도·이용하거나 운영 오류로 필수 검사가 생략되어 비승인 공급물이 서비스에 들어갈 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 승인·사용 전 필수 검사를 정하고 결과가 집행되는지 확인한다. 검사 도구·정책 미정은 제외 사유가 아니다.
policy_params:
- key: required_checks
  type: list[str]
  required: true
policy_prose:
  policy_to_decide: null
  enterprise_decisions: 필수 검사 목록·대체 방법 충분성 검토자, 예외 대상·사유·보완 통제·승인자·기한·재검사 조건. 기업이 별도 위험 수용을 허용해도 검사 충족과 구별해 기록한다.
normal_control: 필수 검사와 승인 대상 일치가 확인된 정상 묶음은 다음 승인·운영 사용 단계로 진행한다.
challenge_steps:
- 필수 검사 목록과 채택한 보류 조건·팀 참조 기준 확인
- 실패·오류·미지원·생략·필수 증거 미확보 상태를 각각 주입하고 운영 사용 보류 확인
- 선택한 동등 대체 검사의 검토·승인·요구 증거와 원결과 보존 확인
- 검사 원결과·관리 결정·실제 승인 및 운영 사용 전이를 대조
required_observations: []
required_observations_prose:
- 필수 검사 목록·원결과와 대상 식별정보, 채택한 보류 조건, 승인·운영 사용 전이 기록
- 대체 검사 사용 시 동등성 검토·승인·요구 증거와 원결과 보존, 위험 수용 결정의 별도 기록
satisfied_if: 채택한 필수 검사 보류 조건이 집행되고, 필수 검사가 충족된 정상 묶음은 허용된다. 대체 검사를 사용하는 경우 동등성 검토·승인과 요구 증거를 갖추고 원래 결과를 보존한다. 팀 참조 구성에서 확인된 위반은 보완 또는 허용된 정책·묶음 재승인 뒤 재시험으로 해소 여부를 확인한다. 위험 수용 결정과 검사 충족 판정을 각각 기록한다.
fail_criteria: 채택한 정책이 보류를 요구하는 필수 검사의 실패·오류·미지원·생략·필수 증거 미확보가 해소되지 않았는데 운영 사용을 허용하거나, 원래 검사 결과를 근거 없이 충족으로 바꾼다. 팀 참조 구성에서는 위험 수용 승인만으로 보류를 해제하는 경우도 포함한다.
unknown_criteria: 필수 검사 목록·보류 조건·대체 검사 사용 시 동등성 또는 승인·운영 사용 전이의 필수 증거를 확인하지 못했다.
remediation: '- 필수 검사의 원결과와 승인·운영 사용 결정을 각각 보존하고 채택한 보류 조건을 집행한다. 팀 참조 구성에서는 핵심 위반·증거 부족을 위험 수용만으로 운영 사용하지 않는다. 동등한 대체 검사는 검토·승인과 요구 증거를 갖춰 적용하고 원래 검사 결과를 보존한다. 팀 참조 구성에서 확인된 위반은 보완 또는 허용된 정책·묶음 재승인 뒤 재시험으로 해소 여부를 확인한다.'
method_and_evidence: 검사 원결과와 승인·운영 사용 결정을 분리해 기록한다. 정상 검사 성공과 실패·오류·미지원·생략·필수 증거 미확보 상태를 각각 주입해 채택한 보류 조건의 집행을 확인한다. 대체 검사는 동등성 검토·승인과 요구 증거를 확인하고 원래 결과를 보존한다. 팀 참조 구성의 핵심 위반·증거 부족은 위험 수용만으로 운영 사용하지 않는다. 팀 참조 구성에서 확인된 위반은 보완 또는 허용된 정책·묶음 재승인 뒤 재시험으로 해소 여부를 확인한다. 대체 검사 성공만으로 미해소 위반의 운영 사용을 허용하지 않는다.
remaining_setup: 검사기 결과 주입 접점, 필수 검사·보류 처리표와 대체 검사의 동등성 검토 기준
