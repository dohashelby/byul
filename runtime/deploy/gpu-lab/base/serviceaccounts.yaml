# Every role has its own account. Only the observer needs Kubernetes API
# access (read-only Pod listing); the others never mount a token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: serving-gateway
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: serving-engine
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: serving-observer
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: artifact-acquire
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: serving-probe
automountServiceAccountToken: false
