executor: engine_sensor
collection_profile: engine-sensor-slot-lifetime-v1
policy_params:
- key: sensor_environment_sha256
  type: str
  required: true
- key: sensor_target_sha256
  type: str
  required: true
- key: sensor_prepared_sha256
  type: str
  required: true
- key: sensor_manifest_sha256
  type: str
  required: true
required_observations:
- key: engine_sensor_violation
  type: bool
- key: engine_sensor_full_scope
  type: bool
judge:
  plugin: rule_table
  params:
    pass_when_all:
    - obs: engine_sensor_full_scope
      op: eq
      value: true
    - obs: engine_sensor_violation
      op: eq
      value: false
    fail_when_any:
    - obs: engine_sensor_violation
      op: eq
      value: true
