id: OBS-07
framework_id: CHK-OBS-007
mechanism_ids:
- mechanism-01
revision: 5
retired: false
area: OBS
purpose: 작업·대상 인가
secondary_purposes: []
question: 진단 자료를 읽을 수 있다는 이유만으로 재실행까지 할 수 없는가?
scope: 조건부; replay 지원 구현
risk_category: 보안 위협 점검
risk_summary: 진단 자료의 읽기권만 가진 주체가 외부 replay 도구의 실행 권한까지 얻어 고권한 작업을 수행할 수 있음. 실제 도구 존재·권한 확인 필요.
review_order: conditional_when_selected
impact: null
applies_when:
  prose: replay consumer의 실제 배치·도달성과 실행 허용 정책을 먼저 확인한다. 배치된 consumer의 허용 실행과 금지 실행의 거부를 대조한다. 실제 비사용·미도달 근거가 있으면 해당 분기만 비적용 후보로 남기고, consumer나 정책이 미정이면 적용을 미정으로 둔다. 읽기권과 실행권은 구분한다.
policy_params:
- key: replay_allowed
  type: bool
  required: true
policy_prose:
  policy_to_decide: 조회와 실행 역할
  enterprise_decisions: 자료별 독자·반출 목적·범위·승인, 진단 실행 역할·격리 환경과 parser/입력 신뢰 범위.
normal_control: 외부 replay를 쓰는 환경에서 승인 실행 역할만 합성 자료를 재실행한다.
challenge_steps:
- replay consumer 존재 확인
- reader 계정과 실행 역할로 같은 무해 자료 실행 요청
- 실행표식·권한 검사 비교
required_observations: []
required_observations_prose:
- consumer·실행 계정/reader·executor 역할/실제 실행 및 거부 기록
satisfied_if: 자료 읽기만 허용된 주체의 replay 실행은 거부된다. 실행이 허용된 역할은 승인한 범위에서 정상 처리하며, replay 금지 정책에서는 실행이 시작되지 않는다.
fail_criteria: 읽기만 허용된 주체가 replay를 실행하거나, 실행 금지 정책의 작업이 실제 시작된다.
unknown_criteria: 적용한 consumer에서 실제 호출·실행 또는 거부 기록, reader·실행 역할의 대응을 확인하지 못했다.
remediation: '- 진단 자료 읽기 역할과 replay 실행 역할을 분리하고 실행 시 권한을 검사한다. replay를 사용하지 않는 구성에서는 실행 접점의 비사용·비노출을 확인한다.'
method_and_evidence: '실제 배치된 replay consumer의 읽기 역할·실행 역할·허용 작업과 비사용/금지 정책을 확인한다. 같은 정상 합성 자료를 reader와 승인 실행 역할로 제출해 실제 실행표식·권한 검사·거부를 비교한다. 【F24】외부 도구의 존재·실행 계정·입력형식·reader를 먼저 식별한다. 이 행은 누가 replay를 시작할 수 있는지 판정하며, 자료 변조·reader의 금지 객체/부수 동작은 CHK-OBS-008에서 같은 consumer 관측과 함께 판정한다. 근거 원문: [F24](https://github.com/mg-princess/serving-security-framework/blob/8a0c7fe42446ff0d3a1f58e2a18cf3069d5c714e/data/checklist.json#L33733).'
remaining_setup: 기본 비사용; 외부 replay 구현·실행 역할 확정 후 시험
executor: null
judge: null
legacy:
  q_ids:
  - Q-C11
  - Q-R05-05
  scenario_ids:
  - SC-21-03
  subtest_ids:
  - Q-C11/SC-21-03
source:
  array: observability_assessment_draft
limitations:
- replay_allowed={replay_allowed}은 이 점검 범위의 기업 정책 신고다. false는 consumer 미배포·미도달의 증거가 아니고 true는 구현·실행 권한의 증명이 아니다. 정책값만으로 비적용·PASS를 만들지 않는다.
- consumer·계정·읽기/실행 권한·실제 실행/거부의 수동 근거가 별도로 필요하다. 점검별 값은 자동 복사하지 않으며 공유 정책의 범위·일관성·승인은 별도 업무 검토가 필요하다.
