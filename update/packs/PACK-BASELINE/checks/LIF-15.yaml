revision: 2
retired: false
area: LIF
purpose: 복구 정책·상태 검증
secondary_purposes: []
question: 이전 구성으로 복귀할 때도 현재 승인 기준을 만족하는가?
scope: 기본 재배포 복원
risk_category: 보안 위협 점검
risk_summary: 복원 권한자가 현재 승인에서 제외한 모델·코드·자격을 과거 이미지로 되살려 금지된 실행이나 접근을 재개할 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 기본 재배포 복원에서 이전 묶음의 현재 승인·철회·실효 설정을 확인한다. 과거 승인만으로 재사용하지 않는다.
policy_params: []
policy_prose:
  policy_to_decide: 복귀 허용판·정책·예외·긴급 예외의 승인자/기한
  enterprise_decisions: 복원 대상 보존·digest/식별, 외부 설정별 복원 책임·GitOps 재조정, 재개 근거. 긴급 권한 부여가 공급물 필수 위반·증거 부족을 예외 통과시키지 않도록 한다.
normal_control: 현재 승인에 포함된 이전 묶음으로 rollback 후 정상 서비스한다.
challenge_steps:
- 현재 승인 목록 확정
- 승인에서 철회된 시험 묶음을 rollback 대상으로 지정
- 적용 gate·실제 이미지·모델 확인
required_observations: []
required_observations_prose:
- 현재 승인판/rollback 대상 식별/거부·실제 배포
satisfied_if: 과거에 승인됐다는 이유로 현재 금지 대상을 복원하지 않는다.
fail_criteria: 현재 승인에서 제외된 묶음이 rollback이라는 이유로 적용된다.
unknown_criteria: 이전 승인 기록만 있고 현행 승인·실제 복원 대상을 알 수 없다.
remediation: '- 복원할 이미지·모델·설정·권한의 현재 승인 유효성을 확인한다. 현재 승인에서 벗어난 대상은 승인 범위를 다시 검토하고 사용 승인을 받은 뒤 복원한다. 필수 실행 준비와 정상 추론을 확인한 뒤 요청을 받는다.'
method_and_evidence: 복귀 이미지·모델·설정·정책을 현재 승인 목록과 대조하고 실제 복귀 대상을 확인한다. 복원할 실물의 보존·접근 가능성과 이미지 digest·모델 식별을 확인한다. 배포 이력만으로 실물 복원 가능성을 확정하지 않는다.
remaining_setup: 현행 승인 manifest와 격리 rollback 대상
