applies_when:
  always: true
  prose: 활성 입력 endpoint의 token·길이·변환 후 값을 선정 모델·runner 기준으로 확인한다. embedding을 실제 지원·수용하면
    consumer가 요구하는 값·차원/shape·필요 dtype·입력 길이와 token/embedding·선택 mask의 대응을 추가 확인한다.
    routed_experts_prompt_start 등 offset 파라미터를 수용하면 embedding 사용이나 관련 출력 기능의 활성 여부와
    별개로 그 의미·형식·유효 위치 범위를 확인한다. 금지·미지원 입력은 실제 거부·제거 근거와 지원 범위를 기록한다.
policy_params:
- key: max_input_tokens
  type: int
  required: true
- key: rejection_codes
  type: list[str]
  required: true
- key: allowed_endpoints
  type: list[str]
  required: true
- key: allowed_input_formats
  type: list[str]
  required: true
- key: allowed_input_pairs
  type: list[str]
  required: true
executor: input_validation
challenge_steps:
- 정상 token-array 대조 후 범위 밖 token ID 시험
- 길이 한도 밖 시험과 후속 정상 대조
required_observations:
- key: accepted_challenges
  type: list[str]
- key: challenge_outcomes
  type: dict[str, outcome]
- key: challenges_planned
  type: list[str]
- key: functional_probes_planned
  type: list[str]
- key: functional_probe_results
  type: dict[str, outcome]
- key: input_endpoints_tested
  type: list[str]
- key: input_formats_tested
  type: list[str]
- key: challenge_rejection_results
  type: dict[str, outcome]
- key: challenge_consumption
  type: dict[str, outcome]
- key: confirmed_input_violations
  type: list[str]
- key: input_matrix_planned
  type: list[str]
- key: input_matrix_cases
  type: list
- key: input_matrix_complete
  type: bool
judge:
  plugin: rule_table
  params:
    pass_when_all:
    - obs: input_matrix_complete
      op: eq
      value: true
    - obs: challenge_outcomes
      op: nonempty
    - obs: challenges_planned
      op: eq
      value:
      - token_id
      - length
    - obs: challenge_outcomes
      op: superset_of
      value_obs: challenges_planned
    - obs: challenge_outcomes
      op: all_in
      value_policy: rejection_codes
    - obs: challenge_rejection_results
      op: superset_of
      value_obs: challenges_planned
    - obs: challenge_rejection_results
      op: all_in
      value:
      - verified
    - obs: input_endpoints_tested
      op: eq
      value_policy: allowed_endpoints
    - obs: input_formats_tested
      op: eq
      value_policy: allowed_input_formats
    fail_when_any:
    - obs: confirmed_input_violations
      op: nonempty
    axes:
      functional:
        pass_when_all:
        - obs: functional_probe_results
          op: superset_of
          value_obs: functional_probes_planned
        - obs: functional_probe_results
          op: all_in
          value:
          - pass
        - obs: input_endpoints_tested
          op: eq
          value_policy: allowed_endpoints
        - obs: input_formats_tested
          op: eq
          value_policy: allowed_input_formats
        fail_when_any:
        - obs: functional_probe_results
          op: any_in
          value:
          - fail
functional_probes:
- method: POST
  path: /v1/completions
  body:
    model: '{model}'
    prompt:
    - 0
    max_tokens: 1
  expect:
  - 200
  via: engine
- method: POST
  path: /v1/chat/completions
  body:
    model: '{model}'
    messages:
    - role: user
      content: hello
    max_tokens: 1
  expect:
  - 200
  via: engine
limitations:
- REQ-09 revision 6은 HTTP 상태·검토된 원인별 거부·실제 소비를 구분한다. accepted_challenges는 구 형식의 HTTP
  2xx 목록이며 새 정의의 FAIL 근거가 아니다. 오류 객체·불완전 응답·정상 생성 형태만으로 금지 입력 소비나 피해를 확정하지 않는다.
- 실제 consumer·메모리 접근·상태 오염을 이 프로파일만으로 증명하지 않으므로 challenge_consumption은 unknown이고 confirmed_input_violations는
  비어 있다. 확인된 독립 위반 또는 신고 FAIL은 다른 관측 누락으로 지우지 않는다. PASS는 명시한 입력 조합의 원 거부 지점과 전후 정상
  대조가 별도 소스/GPU 자격을 갖춘 제한된 프로파일만 뜻한다.
- REQ-09 정책 허용 endpoint={allowed_endpoints}, 입력 형식={allowed_input_formats}. 정책 목록은
  실제 등록·승인이나 parser 소비의 증명이 아니다.
- input-matrix-v1은 allowed_input_pairs의 METHOD path|format 조합을 모두 실행한다. 조합의 endpoint·format
  집합은 전체 allowed_endpoints·allowed_input_formats와 일치해야 한다. 지원하지 않는 조합을 제외하거나 다른 조합으로
  대신하지 않고 실행 전에 거부한다. 이전 정의의 단일 token-array 제한은 과거 정의 재판정에서 그대로 유지한다.
- 각 token_ids 조합의 양수 vocab 상한·길이 경계와 각 text 조합의 작은 길이 경계를 시험하며 조합마다 전후 정상 대조를 보존한다.
  원 source·실제 요청 fixture·기존 SDK·새 투영의 별도 자격이 없으면 거부를 verified로 올리지 않는다. 정상 HTTP 응답만으로
  소비·전체 parser/변환·embedding/mask/offset·기업 승인 진위를 증명하지 않는다.
- input_endpoints_tested·input_formats_tested와 input_matrix_cases는 실제 제출 범위다. 정책·원
  거부 지점의 일치 및 알려진 모델/consumer 한도의 근거를 별도로 확인한다. 결과·본문에서 정책 값을 보충하지 않으며 모든 경계 조합을 검증했다고
  표시하지 않는다.
impact: MEDIUM
collection_profile: input-matrix-v1
