name: Runtime and platform integration

on:
  pull_request:
    paths:
      - 'runtime/**'
      - 'update/**'
      - 'platform/**'
      - 'contracts/**'
      - '.github/workflows/runtime-platform.yml'
  push:
    branches: [main, 'codex/**']
    paths:
      - 'runtime/**'
      - 'update/**'
      - 'platform/**'
      - 'contracts/**'
      - '.github/workflows/runtime-platform.yml'

permissions:
  contents: read

concurrency:
  group: runtime-platform-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.3'
      - run: python -m pip install uv==0.12.11
      # Runtime server acceptance tests serve real assets from this checkout.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/web/package-lock.json
      - run: npm ci
        working-directory: platform/web
      - run: npm run build
        working-directory: platform/web
      - name: Runtime regression against this checkout
        env:
          PYTHONPATH: runtime:runtime/tests:runtime/src:update/src:platform/api/src
        run: >-
          uv run --project platform/api --frozen --with-editable ./runtime --with-editable ./update
          python -m pytest -q runtime/tests --import-mode=importlib
          --basetemp=${{ runner.temp }}/byul-runtime-integration
      - name: Platform API against integrated runtime
        env:
          PYTHONPATH: runtime/src:update/src:platform/api/src:platform/api/tests
        run: >-
          uv run --project platform/api --frozen --with-editable ./runtime --with-editable ./update
          python -m pytest -q platform/api/tests --import-mode=importlib
          --basetemp=${{ runner.temp }}/byul-api-integration
      - name: Runtime wheel and CLI
        run: |
          uv build --project runtime --wheel --out-dir "${RUNNER_TEMP}/runtime-wheel"
          uv venv "${RUNNER_TEMP}/runtime-installed" --python 3.12.3
          uv pip install --python "${RUNNER_TEMP}/runtime-installed/bin/python" "${RUNNER_TEMP}"/runtime-wheel/*.whl
          cd "${RUNNER_TEMP}"
          runtime-installed/bin/serving-runtime --help

  web-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.3'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: platform/web/package-lock.json
      - run: python -m pip install uv==0.12.11
      - run: uv sync --project platform/api --frozen
      - run: npm ci
        working-directory: platform/web
      - name: Generated OpenAPI and TypeScript match API
        run: |
          uv run --project platform/api --frozen python -m byul_platform.export_openapi platform/web/src/api/openapi.json
          platform/web/node_modules/.bin/openapi-typescript platform/web/src/api/openapi.json -o platform/web/src/api/schema.d.ts
          git diff --exit-code -- platform/web/src/api/openapi.json platform/web/src/api/schema.d.ts
      - run: npm test
        working-directory: platform/web
      - run: npm run build
        working-directory: platform/web
