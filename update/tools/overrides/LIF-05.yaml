executor: lifecycle_transition
collection_profile: lif05-stopped-redeploy-v1
policy_params: []
required_observations:
- key: activation_steps
  type: list
- key: activation_violations
  type: list
- key: activation_missing
  type: list
- key: activation_scope_complete
  type: bool
judge:
  plugin: rule_table
  params:
    pass_when_all:
    - obs: activation_scope_complete
      op: eq
      value: true
    - obs: activation_violations
      op: empty
    fail_when_any:
    - obs: activation_violations
      op: nonempty

impact: MEDIUM
