executor: input_validation
collection_profile: reused-token-input-matrix-v1
policy_params:
- key: reused_token_field
  type: str
  required: true
- key: reused_token_allowed
  type: bool
  required: true
- key: rejection_codes
  type: list[str]
  required: true
- key: reused_token_fields
  type: list[str]
  required: true
- key: reused_field_endpoints
  type: dict
  required: true
required_observations:
- key: reused_input_trials
  type: list
- key: reused_input_state
  type: str
- key: reused_input_forbidden
  type: bool
- key: reused_input_violations
  type: list
- key: functional_probes_planned
  type: list[str]
- key: functional_probe_results
  type: dict[str, pass|fail|no_response]
- key: reused_fields_tested
  type: list[str]
- key: reused_matrix_complete
  type: bool
functional_probes:
- method: POST
  path: /v1/chat/completions
  body:
    model: '{model}'
    messages:
    - role: user
      content: hello
    max_tokens: 1
    temperature: 0
  expect:
  - 200
  via: engine
judge:
  plugin: rule_table
  params:
    pass_when_all:
    - obs: reused_input_forbidden
      op: eq
      value: true
    - obs: reused_input_state
      op: in
      value:
      - rejected
      - ignored
    - obs: reused_input_violations
      op: empty
    - obs: reused_matrix_complete
      op: eq
      value: true
    fail_when_any:
    - obs: reused_input_violations
      op: nonempty
    axes:
      functional:
        pass_when_all:
        - obs: functional_probe_results
          op: superset_of
          value_obs: functional_probes_planned
        - obs: functional_probe_results
          op: all_in
          value:
          - pass
        fail_when_any:
        - obs: functional_probe_results
          op: any_in
          value:
          - fail
limitations:
- 명시된 재사용 필드·endpoint마다 원래 정상/시험/정상 요청을 실행하고 결과를 모두 보존한다. 기존 최상위 필드와 실제 중첩 필드를 함께
  선언한다.
- 현재 요청의 원본 handler·검증 함수와 대조 응답의 토큰 HMAC을 별도 자격 등록 후 연결한다. 정상 토큰과 fixture가 같거나 사후
  정상 토큰이 달라지면 수용을 확정하지 않는다.
- 선정 필드의 frontend 및 대조 응답 식별만 확인한다. GPU 메모리의 토큰 소비·renderer 전체 분기·다른 endpoint 미도달을
  증명하지 않는다. 허용 정책의 필수 검사 전체를 증명하는 PASS는 지원하지 않는다.
impact: MEDIUM
