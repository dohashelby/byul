executor: engine_sensor
collection_profile: engine-sensor-cache-timing-v1
policy_params:
- key: cache_timing_max_auc_percent
  type: int
  required: true
- key: cache_timing_min_samples
  type: int
  required: true
required_observations:
- key: engine_sensor_violation
  type: bool
- key: engine_sensor_full_scope
  type: bool
judge:
  plugin: rule_table
  params:
    pass_when_all:
    - obs: engine_sensor_full_scope
      op: eq
      value: true
    - obs: engine_sensor_violation
      op: eq
      value: false
    fail_when_any:
    - obs: engine_sensor_violation
      op: eq
      value: true

impact: MEDIUM
