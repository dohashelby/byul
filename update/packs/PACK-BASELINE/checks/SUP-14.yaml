id: SUP-14
revision: 2
retired: false
area: SUP
purpose: 검사 결과 반영
secondary_purposes: []
question: 검사 실패·오류·미지원·생략을 통과로 처리하지 않는가?
scope: null
risk_category: 보안 위협·일반 장애 함께 점검
risk_summary: 제출자가 검사 오류·미지원 상태를 유도·이용하거나 운영 오류로 필수 검사가 생략되어 비승인 공급물이 서비스에 들어갈 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 필수 검사 사용
policy_params:
- key: required_checks
  type: list[str]
  required: true
policy_prose:
  policy_to_decide: null
  enterprise_decisions: 필수 검사 목록·대체 방법 충분성 검토자, 예외 대상·사유·보완 통제·승인자·기한·재검사 조건. 기업이 별도 위험 수용을 허용해도 검사 충족과 구별해 기록한다.
normal_control: 필수 검사들이 성공한 묶음만 다음 단계로 넘어간다.
challenge_steps:
- 필수 검사 목록 확정
- 실패·오류·미지원·생략 결과를 한 번씩 주입
- 승인·배포 상태 전이를 확인
required_observations: []
required_observations_prose:
- 검사 원결과
- 필수 여부·예외 승인
- 승인 및 배포 전이 기록
satisfied_if: 필수 미완료가 자동 승인으로 이어지지 않는다. 예외 사용은 승인 기록과 함께 남기며 검사 충족으로 표시하지 않는다.
fail_criteria: 필수 검사 실패·미지원·생략이 승인된 예외 없이 통과로 처리된다.
unknown_criteria: 필수 검사 목록·예외 범위가 미정이거나 집행 전이를 관측하지 못했다.
remediation: 검사 상태를 분리하고 예외의 승인자·기한·재검사 조건을 둔다
method_and_evidence: '결과 종류별 승인·배포·소비 상태를 대조하고 예외 승인 범위·기한을 확인한다. 【F35】승인 묶음의 hash/서명 검사기와 배포 차단 연동이 필요한 평가. Tensorizer hash는 선택 loader 조건. 외부 검사기의 입력 묶음·승인자·digest 및 실패/오류/미지원/생략 결과를 배포 경로에 연결해 차단 확인. Tensorizer checksum 성공 상태에서 승인 기록 불일치도 확인. 정상 대조: 승인 검사 성공과 실물 대응이 모두 확인된 묶음은 정상 배포.'
remaining_setup: 검사기 결과 주입 접점; 예외 승인값은 기업 결정
