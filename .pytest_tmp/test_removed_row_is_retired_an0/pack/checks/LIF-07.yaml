id: LIF-07
revision: 1
retired: false
area: LIF
purpose: 시작·재개 조건
secondary_purposes: []
question: 필요한 worker와 실행 준비를 확인한 뒤 요청을 받는가?
scope: 기본 TP; 선택 graph/backend는 실제 설정
risk_category: 보안 위협·일반 장애 함께 점검
risk_summary: 승인 확인을 우회한 운영자나 준비 상태 오류 때문에 미준비·비승인 모델이 요청을 받아 잘못된 응답·서비스 중단을 일으킬 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 기본 TP; 선택 graph/backend는 실제 설정
policy_params: []
policy_prose:
  policy_to_decide: 필수 준비 항목·재개 승인·정상 기능 기준
  enterprise_decisions: 필수 준비 항목·성능 수용 기준·정상 시험 입력·준비 증거·재개 승인 역할. 공급물 승인과 운영 준비 판정을 연결한다.
normal_control: 모든 필수 rank와 모델 준비 후 실제 정상 추론이 성공한다.
challenge_steps:
- 준비 단계의 rank 하나를 안전하게 지연
- listener·health·Gateway readiness·추론 결과 비교
- 준비 후 허용 확인
required_observations: []
required_observations_prose:
- rank 준비
- listener 시각
- readiness 판정·실제 추론
satisfied_if: 필수 준비 미완료 상태에서는 접수를 허용하지 않고 완료 후 정상 처리한다.
fail_criteria: 필수 준비 조건 충족 전에 서비스 수용을 허용한다.
unknown_criteria: health 응답만 있고 rank·model 준비 또는 실제 접수 시점을 모른다.
remediation: 실패 시 수용 보류와 그룹별 준비 확인을 배포 절차에 연결한다 모델 준비 증거와 정상 canary를 재개 조건에 넣는다 승인 인계·수용 차단·실제 준비 확인을 배포 도구에 구현한다
method_and_evidence: 'rank별 로딩·KV·graph 준비와 service gate·정상 canary·접수 시각을 연결한다. 【F32】기본 재배포는 외부 gateway/LB와 실제 승인 모델 준비 확인. live/keep/collective_rpc는 선택 구성에서만 도달성·상태 보존 확인; snapshot 경로와 일반기동 혼동 금지. 기본 재배포: 정상 로딩 완료·불완전 적재와 외부 요청 gate를 대조한다. 선택 live 변경을 사용하는 경우에만 abort/wait/keep의 요청·weights·cache 세대를 시험한다. 정상 대조: 기본: 정상 로딩 완료 후 요청과 실패 시 외부 gate 확인. 선택 live 활성 시에만 abort/wait/keep 및 모델·cache·요청 세대 추적.'
remaining_setup: 준비 gate·외부 proxy 확인; keep/dev 옵션 유효값 기록
