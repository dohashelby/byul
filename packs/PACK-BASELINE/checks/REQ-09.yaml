id: REQ-09
revision: 5
retired: false
area: REQ
purpose: 실제 입력의 검사
secondary_purposes: []
question: token ID와 입력 길이가 실제 모델·소비자의 유효 범위를 지키는가?
scope: 기본+선정 입력
risk_category: 보안 위협·일반 장애 함께 점검
risk_summary: 호출자가 범위 밖 token ID·길이를 제출해 예외·잘못된 계산을 유발할 수 있음. 공유 엔진 중단·타 요청 피해는 실제 경로와 영향 확인 필요.
review_order: reference_baseline_first
impact: null
applies_when:
  always: true
  prose: 활성 endpoint가 받는 값·선정 vocab/runner
policy_params:
- key: max_input_tokens
  type: int
  required: true
- key: rejection_codes
  type: list[str]
  required: true
- key: allowed_endpoints
  type: list[str]
  required: true
- key: allowed_input_formats
  type: list[str]
  required: true
policy_prose:
  policy_to_decide: 서비스 입력 한도; 구현상 유효 범위는 코드 근거로 확정
  enterprise_decisions: 허용 endpoint·텍스트/직접 token 등 입력 형식, template override 필요성, 옵션·길이·출력 한도·정상 대조 입력. vocab·버퍼 범위·옵션 필수 관계 등 구현상 제약은 기업 정책으로 완화하지 않는다.
normal_control: 선정 tokenizer·모델의 유효 ID와 길이 경계 안 요청이 정상 처리된다.
challenge_steps:
- 정상 token-array 대조 후 범위 밖 token ID 시험
- 길이 한도 밖 시험과 후속 정상 대조
required_observations:
- key: accepted_challenges
  type: list[str]
- key: challenge_outcomes
  type: dict[str, outcome]
- key: challenges_planned
  type: list[str]
- key: functional_probes_planned
  type: list[str]
- key: functional_probe_results
  type: dict[str, outcome]
- key: input_endpoints_tested
  type: list[str]
- key: input_formats_tested
  type: list[str]
required_observations_prose:
- 모델 vocab·길이 한도
- 실제 token 배열
- 오류·후속 요청 상태
satisfied_if: 허용 밖 값이 위험한 소비 전에 제한되고 정상 입력은 처리된다.
fail_criteria: 범위 밖 입력이 비허용 메모리 접근·상태 오염을 일으키거나 다른 정상 요청을 손상시킨다.
unknown_criteria: 유효 범위·실제 consumer 또는 후속 상태를 확인하지 못했다.
remediation: 모델 기준 범위와 최종 소비값을 연결해 검사한다.
method_and_evidence: 정상·경계·범위 밖 입력의 검사 위치·실제 소비·오류 뒤 정상 요청을 기록한다.
remaining_setup: 선정 모델 범위와 격리 환경의 작은 경계 fixture
executor: input_validation
judge:
  plugin: rule_table
  params:
    pass_when_all:
    - obs: challenge_outcomes
      op: nonempty
    - obs: challenge_outcomes
      op: superset_of
      value_obs: challenges_planned
    - obs: challenge_outcomes
      op: all_in
      value_policy: rejection_codes
    - obs: input_endpoints_tested
      op: eq
      value_policy: allowed_endpoints
    - obs: input_formats_tested
      op: eq
      value_policy: allowed_input_formats
    fail_when_any:
    - obs: accepted_challenges
      op: nonempty
    axes:
      functional:
        pass_when_all:
        - obs: functional_probe_results
          op: superset_of
          value_obs: functional_probes_planned
        - obs: functional_probe_results
          op: all_in
          value:
          - pass
        - obs: input_endpoints_tested
          op: eq
          value_policy: allowed_endpoints
        - obs: input_formats_tested
          op: eq
          value_policy: allowed_input_formats
        fail_when_any:
        - obs: functional_probe_results
          op: any_in
          value:
          - fail
legacy:
  q_ids:
  - Q-C04
  - Q-C06
  scenario_ids:
  - SC-04-01
  subtest_ids:
  - Q-C04/SC-04-01
source:
  array: request_state_assessment_draft
functional_probes:
- method: POST
  path: /v1/completions
  body:
    model: '{model}'
    prompt:
    - 0
    max_tokens: 1
  expect:
  - 200
  via: engine
limitations:
- REQ-09 정책 허용 endpoint={allowed_endpoints}, 입력 형식={allowed_input_formats}. 정책 목록은 실제 등록·승인이나 parser 소비의 증명이 아니다.
- REQ-09는 승인된 전체 allowed_endpoints·allowed_input_formats 목록이 각각 하나이며 정의의 정상 engine POST/token_ids 표본과 정확히 일치하는 프로파일만 지원한다. 복수 목록은 일부만 골라 시험하지 않고 요청 전에 중단한다. 기업 정책을 축소하거나 기본값을 보충하지 않는다.
- input_endpoints_tested·input_formats_tested는 실제 제출 범위이며 engine 직통 한 쌍만 나타낸다. 다른 endpoint·형식·Gateway 경계·재사용 ID·renderer·parser의 실제 소비·원문 보호 전체·기업 승인 진위는 자동 검증하지 않는다. 수동 증거는 DECLARED이고 정책 부족은 PASS 보류 사유다.
- 실행 설정에 출처와 함께 선언한 vocab_size 및 정책 max_input_tokens를 사용하는 token-array 경계 두 건만 시험한다. 실제 모델 유효 범위와 설정의 일치는 별도 확인해야 하며, 다른 입력 형식·음수 ID·모든 경계 조합을 검증하지 않는다.
