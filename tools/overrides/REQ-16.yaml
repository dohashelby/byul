- 'REQ-15 공개/교차 집단 보호와 REQ-17 통계·정보 유출은 미검증이다. 수동 신고 PASS의 상한만 적용하고 성능 PASS는 기준 부재로 UNKNOWN이다. 실제 캐시 실행기는 없다.'
