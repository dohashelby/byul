executor: request_termination
collection_profile: kubernetes-request-termination-observation-v1
policy_params:
- key: termination_max_delay_ms
  type: int
  required: true
- key: termination_required_scopes
  type: list[str]
  required: true
required_observations:
- key: activation_steps
  type: list
- key: activation_violations
  type: list
- key: activation_missing
  type: list
- key: activation_scope_complete
  type: bool
judge:
  plugin: rule_table
  params:
    pass_when_all:
    - obs: activation_scope_complete
      op: eq
      value: true
    - obs: activation_violations
      op: empty
    fail_when_any:
    - obs: activation_violations
      op: nonempty

impact: MEDIUM
