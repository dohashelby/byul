collection_profile: supply-boot-substitution-v1
limitations:
- '구현 분기: 정상 기동과 변경 기동의 native 읽기 bytes를 승인 해시와 대조한다. 승인과 다른 bytes를 끝까지 읽으면 FAIL이다.'
- '미구현 분기: 파일 교체 주체의 권한 시험과 C safe_open·mapping 경로는 이 프로파일에서 다루지 않는다. 쓰기 거부 주장은 기록의 신고로만 남는다.'
- kubernetes 구현만 있다. 실행기는 엔진을 만들거나 바꾸지 않는다. 정상·변경 기동은 준비 절차가 만들고 target·prepared로 받으며, 두 세션을 각각 수집해 합치지 않는다.
