# SUP-08 코드 선택 PoC 정책 초안. 기업 승인값이 아니다(EXAMPLE).
# 요청의 code_revision으로 비승인 동적 처리기 코드를 고를 수 있는지, 실제 import된 판본으로 판정한다.
# REPLACE_WITH_* 값은 실행할 때 고른 멀티모달 시험 모델과 무해 판본으로 바꾼다(SUP-03의 템플릿 SHA와 같은 방식).
# 근거: docs/2차발표_시나리오_SC-11-01.md, PROGRESS 2026-11-11
data_origin: EXAMPLE
status: DRAFT
pack:
  id: PACK-CODE-SELECTION
  revision: 1  # tools/build_code_selection_pack.py가 PACK-BASELINE에서 SUP-08만 revision 5로 바꾼 DRAFT 팩
values:
  SUP-08:
    # mm_processor_kwargs 안에 넣어야 0.31의 기본 거부 경로와 opt-in 전달 경로를 함께 탄다.
    code_selection_fields: [mm_processor_kwargs.code_revision]
    code_selection_allowed: false
    rejection_codes: ['400', '422']
    # 운영자가 승인한 처리기 코드 판본(커밋 SHA-1). 실제 승인 판본으로 바꾼다.
    approved_code_revisions:
    - REPLACE_WITH_APPROVED_PROCESSOR_COMMIT_SHA1
# 실행 판본 관측 설정. 엔진 컨테이너의 동적 모듈 폴더를 읽기 전용으로만 본다.
code_selection_observation:
  # transformers 동적 모듈 캐시 경로. 인계 템플릿은 HF_HOME=/cache/hf이므로 기본값은 아래와 같다.
  code_module_root: /cache/hf/modules/transformers_modules
  # 시험 모델 저장소 id(동적 처리기 auto_map을 쓰는 멀티모달 모델). 실제 값으로 바꾼다.
  code_module_repository: REPLACE_WITH_TEST_MODEL_REPOSITORY_ID
  # 공격 요청이 고를 비승인 판본 이름(무해 판본). HF PR ref 또는 커밋.
  unapproved_revision: REPLACE_WITH_UNAPPROVED_REVISION
  # 멀티모달 처리기가 만들어지도록 요청에 넣는 작은 이미지(PNG/JPEG data URI).
  control_image: REPLACE_WITH_SMALL_IMAGE_DATA_URI
