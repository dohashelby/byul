id: SUP-13
framework_id: CHK-SUP-013
mechanism_ids:
- mechanism-09
revision: 3
retired: false
area: SUP
purpose: 자료 해석 안전성
secondary_purposes: []
question: 모델이 제공한 chat template을 해석할 때 허용된 동작 범위를 지키는가?
scope: null
risk_category: 보안 위협 점검
risk_summary: template 공급자가 렌더링 동작을 악용해 허용 밖 정보 접근이나 과도한 CPU·메모리 사용을 유도할 수 있음. 선택 renderer의 실제 제한 확인 필요.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 공급물의 template가 실제 renderer에서 해석될 때 적용한다. 요청 override 허용 여부와 공급 template 소비는 별도로 확인한다.
policy_params:
- key: forbidden_template_attributes
  type: list[str]
  required: true
policy_prose:
  policy_to_decide: null
  enterprise_decisions: 필요한 형식·reader·의존성 판본, 허용 객체·금지 부수 동작과 입력/처리 예산. 다른 형식이 필요하면 정책 변경·승인·재시험한다. 미디어는 현재 텍스트 구성 밖의 선택 기능이다.
normal_control: 승인한 template가 정상 메시지를 기대 형식으로 렌더링한다.
challenge_steps:
- 공급 template와 적용 renderer 확인
- 제한 경계를 확인하는 무해 template 입력
- 렌더 결과·차단·시간 상한 확인
required_observations:
- key: template_identity_verified
  type: bool
- key: template_render_witness_verified
  type: bool
- key: forbidden_template_type_reference_verified
  type: bool
- key: template_sandbox_scope_complete
  type: bool
- key: functional_probes_planned
  type: list[str]
- key: functional_probe_results
  type: dict[str, outcome]
required_observations_prose:
- template digest/renderer·sandbox·의존성/출력·오류·제한 집행
satisfied_if: 금지 동작을 막고 정상 입력 해석은 유지한다.
fail_criteria: 허용하지 않은 참조·동작이 실행되거나 정한 처리 한도를 넘긴다.
unknown_criteria: sandbox 이름만 확인했거나 해당 template·renderer 분기에 도달하지 못했다.
remediation: '- 모델이 제공한 chat template의 버전과 출처를 승인하고 실제 렌더러의 허용 동작을 제한한다. 외부 객체 참조·호출과 렌더링 비용을 정한 범위로 제한하고 실패한 변환 결과의 사용을 막는다.'
method_and_evidence: 선정 renderer·제한 기능과 무해 경계 입력을 확인한다. 명시적 코드 실행 허용은 보호 목적 ④와 연결한다.
remaining_setup: 허용 template 기능·처리 예산과 무해 검증 fixture
executor: template_validation
judge:
  plugin: rule_table
  params:
    declared_pass_ceiling: true
    pass_when_all: []
    fail_when_any:
    - obs: forbidden_template_type_reference_verified
      op: eq
      value: true
    axes:
      functional:
        pass_when_all: []
        fail_when_any: []
      performance:
        pass_when_all: []
        fail_when_any: []
legacy:
  q_ids:
  - Q-R05-05
  scenario_ids:
  - SC-11-07
  subtest_ids:
  - Q-R05-05/SC-11-07
source:
  array: supply_assessment_draft
collection_profile: supplied-template-type-boundary-v1
functional_probes:
- method: POST
  path: /v1/chat/completions
  body:
    model: '{model}'
    messages:
    - role: user
      content: guard sandbox control
    max_tokens: 1
  expect:
  - 200
  via: engine
limitations:
- supplied-template-type-boundary-v1은 관리 고정 공급 template에서 무해한 정수의 __class__ 참조 한 분기만 관측한다. 기존 template_validation·소유 readonly template snapshot·소유 bridge endpoint 결합을 재사용하며 임의 Jinja·파일/프로세스/네트워크 동작은 보내지 않는다.
- forbidden_template_attributes는 독립 POL 필수 목록이며 이 프로파일은 __class__ 또는 명시적인 빈 목록만 지원한다. 금지값을 관측에서 채우거나 다른 template 정책을 복사하지 않는다.
- 고정 template의 독립 marker·정상 렌더 기준과 구별되는 참조 결과 기준을 /tokenize에서 비교하고 정상 추론의 prompt 입력 projection을 대조한다. 요청마다 같은 container/image/start·파일 bytes·readonly·실제 IP/endpoint 결합을 확인한 금지 속성 참조 결과만 독립 FAIL이다. 뒤의 미수집·정상 요청 실패가 앞의 확인된 결과를 지우지 않는다.
- HTTP400·오류 문구·sandbox 이름·token 개수만 일치·외부 JSON import·단순 mount 존재로 제한 집행이나 소비를 주장하지 않는다. 같은 엔진이 반환한 렌더 입력 projection이며 독립 worker file-open·생성 출력 귀속·공급 template 전체 소비 인증이 아니다.
- 검토된 vLLM0.31.0 CPU image와 guard-type-boundary-v1의 byte-pinned fixture만 지원한다. 다른 image/GPU·임의 template·모델/파일/세대/endpoint 불일치·정상 렌더 미확인·timeout은 UNKNOWN이다.
- 거부·오류·허용 정책은 전체 PASS가 아니다. 다른 객체/호출·자원 한도·자동 template 선택·모든 실행 모드는 미계측이며 template_sandbox_scope_complete=false로 모든 PASS를 보류한다. 원문 응답·토큰·예외·host mount 경로는 artifact에 저장하지 않는다.
