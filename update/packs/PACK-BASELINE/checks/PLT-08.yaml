id: PLT-08
framework_id: CHK-PLT-008
mechanism_ids:
- mechanism-01
- mechanism-16
revision: 5
retired: false
area: PLT
purpose: 통신 상대·전송 보호
secondary_purposes: []
question: API·내부 통신의 각 구간에서 통신 상대 인증과 기밀성·무결성 기준을 지키는가?
scope: API·기본 IPC/TP; 다중 노드·PP는 선택
risk_category: 보안 위협 점검
risk_summary: 내부 통신에 접근 가능한 비허용 주체가 peer를 사칭하거나 전송을 읽고 바꿔 요청 자료 유출·계산 오염·작업 중단을 일으킬 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  always: true
  prose: 호출 앱·사용자→Gateway→엔진의 실제 API 전송 구간과 기본 IPC/TP를 확인한다. Gateway가 없으면 호출 주체→엔진을 확인한다. 다중 노드·PP는 사용 시 추가한다.
policy_params:
- key: api_hop_scope
  type: str
  required: true
- key: api_container_id
  type: str
  required: true
- key: api_network_id
  type: str
  required: true
- key: api_endpoint_id
  type: str
  required: true
- key: api_ip
  type: str
  required: true
- key: api_port
  type: int
  required: true
- key: plaintext_forbidden
  type: bool
  required: true
- key: validity_start
  type: str
  required: true
- key: validity_end
  type: str
  required: true
policy_prose:
  policy_to_decide: 구간별 위협 주체·자료 민감도·보호 수준
  enterprise_decisions: 구간별 배치·자료·위협 주체, TLS/상대 확인·자격 방식, 내부 IPC 보호 전제와 예외. 다중 노드는 선택 시 별도 검토한다. API를 포함한 구간별 암호화 요구·TLS 종료 위치·신뢰할 인증기관·상대 인증 방식·예외와 유효기간을 정한다.
normal_control: 허용한 호출 주체가 각 API 구간에서 정상 요청·스트리밍 응답을 주고받고, 승인한 rank 사이 TP 처리도 정상 완료된다.
challenge_steps:
- API·IPC·TP 구간, 실제 종단과 구간별 보호 요구 확보
- 허용된 정상 API·스트리밍·TP 처리 확인
- API의 잘못된 인증서·금지된 평문 연결과 내부의 비허용 peer·무해 변조를 지원 시험기로 대조
- 각 구간의 상대 인증·기밀성·무결성 결과를 따로 기록
required_observations:
- key: forbidden_plaintext_successes
  type: list[str]
- key: api_transport_trials
  type: list[dict]
- key: api_transport_scope_complete
  type: bool
required_observations_prose:
- 구간·transport·peer/인증·암호화 설정/연결·무결성 결과
- 호출 주체→Gateway→엔진 주소와 TLS 종료·재암호화 위치, 실제 handshake·인증서 검증, 금지 평문 연결·정상 응답 결과
satisfied_if: API·내부 통신의 각 구간에서 채택한 상대 인증·기밀성·무결성 요구를 증거로 확인하고 정상 요청·TP가 동작한다. 내부 IPC의 OS 접근 제한 등 실제 보호 수단도 구간별로 평가한다.
fail_criteria: 채택한 정책에서 금지한 평문 통신·비허용 상대 연결·변조 자료 수용이 확인되거나, 필수 상대 검증을 수행하지 않는다.
unknown_criteria: API의 실제 종단·TLS 종료점 또는 내부 transport·peer·보호 설정과 결과를 확인하지 못했다. 필수 보호 요구가 미정이면 해당 기준의 판정을 보류한다.
remediation: '- 호출 주체→Gateway→엔진과 내부 통신을 구간별로 나누고 채택한 상대 인증·기밀성·무결성 보호를 적용한다. TLS 종료 후 엔진까지의 구간도 확인한다. 인증서를 사용하는 구간에서는 신뢰되지 않거나 이름이 다른 인증서를 거부하는지 시험한다. 로컬 IPC는 실제 계정·namespace·접근권에 맞게 보호한다.'
method_and_evidence: '서비스 API와 API/core/worker·rank 사이 실제 제어·데이터 통신을 구간별로 식별하고, 각 구간의 허용 peer·상대 확인·기밀성·무결성 요구와 정상 API·스트리밍·TP 처리를 대조한다. 제어 SHM/socket·overflow·collective·선택 PP/다중 노드 transport를 구분한다. 로컬 IPC의 UID·namespace·socket/SHM 접근과 무해 메시지 수용 관측은 CHK-PLT-002와 공유할 수 있다. 이 항목에서는 그 근거가 해당 구간의 보호 요구를 충족하는지 판정하고, 로컬 IPC 인가만으로 다른 구간의 전송 보호를 통과시키지 않는다. API는 실제 TLS 종료점·재암호화·서버 인증과 필요한 호출 주체 인증을 구분하며, 정상 인증서·신뢰되지 않거나 이름이 다른 인증서와 정책상 금지된 평문 연결을 격리 환경에서 대조한다. 관측 자료 전용 collector/sink 전송은 CHK-PLT-009에서 구간별로 판정한다. vLLM v0.31.0의 공통 【F21】 근거를 참조한다. 근거 원문: [F21](https://github.com/mg-princess/serving-security-framework/blob/8a0c7fe42446ff0d3a1f58e2a18cf3069d5c714e/data/checklist.json#L33824).'
remaining_setup: 실제 API·IPC·TP 구간과 보호 요구, TLS 시험 endpoint·인증서·지원 시험기 준비. 기업별 보호 방식·예외 결정 및 실제 시험 필요.
