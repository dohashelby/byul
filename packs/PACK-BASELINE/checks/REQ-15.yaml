id: REQ-15
revision: 2
retired: false
area: REQ
purpose: 공유 제한
secondary_purposes: []
question: cache 공유 집단을 신뢰할 신원에서 결정하는가?
scope: 기본+정책 조건
risk_category: 보안 위협 점검
risk_summary: 호출자가 cache 공유 집단 식별자를 사칭해 허용되지 않은 집단과 상태를 공유하거나 그 사용 여부를 추론할 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: prefix cache 기본; 분리 요구가 있는 주체/집단
policy_params:
- key: public_prefix_sharing_allowed
  type: bool
  required: true
- key: isolated_cache_groups
  type: list[str]
  required: true
- key: cache_identity_policy_ref
  type: str
  required: true
policy_prose:
  policy_to_decide: 공유 집단·salt 발급/검사 주체
  enterprise_decisions: 공유 단위(사용자/서비스 계정/tenant), 공개 prefix 공유 여부, 인증 주체 식별·salt 발급/덮어쓰기/검사 주체, 필요한 key 문맥, 비공개 정보와 공격자의 반복 관측 조건·통계 기준·성능 허용 범위. 같은 서비스 자격 뒤 여러 사용자가 있으면 추가 신원 전달이나 환경 분리가 필요한지 결정한다.
normal_control: 같은 허용 집단은 캐시를 재사용하고 다른 집단은 공유하지 않는다.
challenge_steps:
- A·B 신원으로 같은 입력 반복
- 클라이언트 salt 위조·누락
- Gateway가 정한 집단과 실제 cache 공유 대조
required_observations:
- key: declared_cache_group_evidence
  type: dict
required_observations_prose:
- 검증된 신원
- 주입·정규화 salt
- cache hit·실제 집단
satisfied_if: 금지된 집단 간 재사용이 없다. salt 존재만으로 격리를 판정하지 않는다.
fail_criteria: 클라이언트가 공유 집단을 바꾸거나 금지 집단 간 캐시 재사용이 발생한다.
unknown_criteria: 신뢰 salt 주입 또는 실제 캐시 hit의 집단 귀속을 확인하지 못했다.
remediation: 신뢰 신원으로 공유 범위를 정하고 도달 가능한 진입점에 적용한다.
method_and_evidence: 신원→집단→salt/key→hit/소비를 대조하고 사용자가 다른 집단 값을 지정할 때 처리한다.
remaining_setup: 허용 공유 관계와 cache 계측; salt 자체를 인가 증거로 보지 않음
executor: null
judge: null
legacy:
  q_ids:
  - Q-C03
  scenario_ids:
  - SC-05-01
  subtest_ids:
  - Q-C03/SC-05-01
source:
  array: request_state_assessment_draft
limitations:
- public_prefix_sharing_allowed={public_prefix_sharing_allowed}는 공개 prefix 공유의 기업 신고 기준이다. private_groups_server_overwrite는 false만 지원하며 true를 격리·공유 승인이나 해당 없음으로 바꾸지 않는다.
- isolated_cache_groups={isolated_cache_groups}는 서로 비공개 캐시를 격리할 기업 전체 집단 목록이다. 최소 두 고유 집단과 정확한 cache_identity_policy_ref={cache_identity_policy_ref}를 명시해야 하며 bool에서 관계·승인·신원을 추론하거나 목록을 줄이지 않는다.
- 한 entrypoint/target/workload·집단별 distinct_authenticated_credential 대표 주체 한 명에 대해 전체 ordered pair와 역방향의 source_warmup/same_group_reuse/cross_group_probe/forged_salt/omitted_salt/post_control을 DECLARED로 대조한다. 실제 key→entry→consumer·신원·사건 순서·첨부 내용과 정책 승인 진위는 자동 인증하지 않는다.
- 공개 공유 true·공유 서비스 자격 뒤 여러 사용자·클라이언트 salt만의 신원·안전 거부 방식·다른 진입점은 지원 밖 UNKNOWN이다. 전체 허용 관계표/신원 책임표·REQ-17 통계·성능은 미검증이며 실제 캐시 실행기는 없다. 신고 PASS의 상한만 적용하고 성능 PASS는 UNKNOWN이다.
