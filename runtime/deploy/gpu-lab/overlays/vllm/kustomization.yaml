# vLLM v0.31.0 on one L4 (plan §3.5). Render: kubectl kustomize deploy/gpu-lab/overlays/vllm
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: serving-lab
resources:
  - ../../base
  - engine.yaml
  - backend-config.yaml
images:
  # The management listener sidecar runs the Gateway image (same package).
  - name: serving-gateway
    newName: REPLACE-REGISTRY/serving-gateway
    digest: sha256:REPLACE_WITH_GATEWAY_IMAGE_DIGEST
  - name: serving-engine-vllm
    newName: vllm/vllm-openai
    digest: sha256:REPLACE_WITH_VLLM_V0_31_0_DIGEST
