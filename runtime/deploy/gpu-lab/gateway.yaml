# Gateway: our code (deploy/gateway/Dockerfile), ServiceAccount "gateway"
# from the AWS bundle foundation.yaml. The MVP Gateway binds 127.0.0.1 only;
# reach it with an SSH tunnel plus
#   kubectl --context byul-aws-lab -n serving-lab port-forward deploy/serving-gateway 8080
#
# Host directories (prepared by the administrator, README.md):
#   /srv/serving/runtime/data   Gateway records, owner 10000, 0700
#   /srv/serving/bundles        platform policy bundles, read-only here
#   /srv/serving/observation    host collector output, group 10010 read-only
# Before apply/restart: publish the reviewed revocations.json, then run
# tools.gpu_lab_gateway_preflight on the target host with these final hostPaths.
# See README.md; missing revocations fail closed, missing directories prevent startup.
# The auth config is a Secret with token hashes only:
#   kubectl -n serving-lab create secret generic serving-gateway-auth --from-file=auth.json
# The enforcement intent comes in the bundle (role enforcement_intent); it is
# applied because the Tetragon feed below is configured.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: serving-gateway
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: serving-gateway}
  template:
    metadata:
      labels: {app: serving-gateway}
    spec:
      serviceAccountName: gateway
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # 10000 is a project choice (appendix I.4 names no Gateway UID).
        runAsUser: 10000
        runAsGroup: 10000
        # 10010 = host group that may read the collector output (README.md).
        supplementalGroups: [10010]
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gateway
          image: serving-gateway
          imagePullPolicy: Never
          readinessProbe:
            exec:
              command:
                - python3
                - -I
                - -S
                - -c
                - "import socket; socket.create_connection(('127.0.0.1', 8080), timeout=0.5).close()"
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 1
          args:
            - mvp
            - --backend
            - vllm
            - --backend-config
            - /etc/serving/backend/backend.json
            - --policy-bundle
            - /etc/serving/bundles/current
            - --asset-manifest
            - /etc/serving/verification/asset-manifest.json
            - --baseline
            - /etc/serving/verification/baseline.json
            - --manifest
            - /etc/serving/verification/manifest.json
            - --revocations
            - /etc/serving/verification/revocations.json
            - --target-pod-snapshot
            - /srv/serving/observation/target-pods.json
            - --observation-timeline
            - /srv/serving/observation/phase-timeline.json
            - --auth-config
            - /etc/serving/auth/auth.json
            - --gateway-port
            - "8080"
            - --data-dir
            - /srv/serving/runtime/data
            - --environment
            - aws-lab
            - --native-receipt-feed
            - /srv/serving/observation/native/receipts.json
            - --native-receipt-reader-gid
            - "10010"
            - --native-receipt-producer-sha256
            - 3c8bda5a7b6a841728b70b1cdb6c982132f03d4b5acc52cf5f6488295880e3f8
            - --observation-feed
            - management_listener=/srv/serving/runtime/management-access/access.jsonl
            - --observation-feed
            - hubble=/srv/serving/observation/hubble.jsonl
            - --observation-feed
            - tetragon=/srv/serving/observation/tetragon.jsonl
            - --tetragon-identities
            - /srv/serving/observation/tetragon-identities.json
            - --tetragon-state
            - /srv/serving/observation/tetragon-status/tetragon-state.json
            - --gpu-state
            - /srv/serving/observation/gpu-status/gpu-state.json
            - --lab-report
            - /srv/serving/observation/lab-reports
            - --observation-heartbeat
            - management_listener=/srv/serving/runtime/management-access/heartbeat.json
            - --observation-heartbeat
            - hubble=/srv/serving/observation/hubble.heartbeat.json
            - --observation-heartbeat
            - tetragon=/srv/serving/observation/tetragon.heartbeat.json
            - --kube-context
            - byul-aws-lab
            - --observation-origin
            - real
            - --observation-environment
            - aws-lab
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: "500m", memory: 512Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: backend-config, mountPath: /etc/serving/backend, readOnly: true}
            - {name: bundles, mountPath: /etc/serving/bundles, readOnly: true}
            - {name: verification, mountPath: /etc/serving/verification, readOnly: true}
            - {name: model, mountPath: /models, readOnly: true}
            - {name: auth, mountPath: /etc/serving/auth, readOnly: true}
            - {name: management-access, mountPath: /srv/serving/runtime/management-access, readOnly: true}
            - {name: runtime-data, mountPath: /srv/serving/runtime/data}
            - {name: observation, mountPath: /srv/serving/observation, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: management-access
          hostPath: {path: /srv/serving/runtime/management-access, type: Directory}
        - name: backend-config
          configMap: {name: serving-gateway-backend}
        - name: bundles
          hostPath: {path: /srv/serving/bundles, type: Directory}
        - name: verification
          hostPath: {path: /srv/serving/verification/approved, type: Directory}
        # SGLang's checked-in snapshot path. The live vLLM path is UNCONFIRMED:
        # inspect it with kubectl in run 12 and update this server copy to match.
        # Reconcile after every model switch; run preflight before apply/restart.
        - name: model
          hostPath: {path: /srv/serving/models/7ae557604adf67be50417f59c2c2f167def9a775, type: Directory}
        - name: auth
          secret: {secretName: serving-gateway-auth}
        - name: runtime-data
          hostPath: {path: /srv/serving/runtime/data, type: Directory}
        - name: observation
          hostPath: {path: /srv/serving/observation, type: Directory}
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
