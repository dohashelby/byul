# Host directories from the environment proposal (/srv/serving/...), exposed
# as local PersistentVolumes. The namespace enforces the "restricted" Pod
# Security level, which forbids hostPath volumes in Pods; local PVs keep the
# same single-node layout without that exception.
#
# The administrator creates the directories and owners before applying (G0):
#   /srv/serving/models   owner 10002 (acquire writes), engine mounts read-only
#   /srv/serving/cache    owner 10001 (engine), generation dirs per plan §4.9
#   /srv/serving/runtime  owner 10000 (Gateway records), mode 0700
#   /srv/serving/bundles  owner root, written by the platform side, read-only here
# REPLACE_NODE_NAME is the single GPU node (kubectl get nodes).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: serving-models
  labels: {serving-volume: models}
spec:
  capacity: {storage: 50Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: serving-local
  local: {path: /srv/serving/models}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [REPLACE_NODE_NAME]}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: serving-cache
  labels: {serving-volume: cache}
spec:
  capacity: {storage: 50Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: serving-local
  local: {path: /srv/serving/cache}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [REPLACE_NODE_NAME]}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: serving-runtime-data
  labels: {serving-volume: runtime-data}
spec:
  capacity: {storage: 10Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: serving-local
  local: {path: /srv/serving/runtime}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [REPLACE_NODE_NAME]}
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: serving-bundles
  labels: {serving-volume: bundles}
spec:
  capacity: {storage: 1Gi}
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: serving-local
  local: {path: /srv/serving/bundles}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - {key: kubernetes.io/hostname, operator: In, values: [REPLACE_NODE_NAME]}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: serving-models
spec:
  storageClassName: serving-local
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 50Gi}}
  selector: {matchLabels: {serving-volume: models}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: serving-cache
spec:
  storageClassName: serving-local
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 50Gi}}
  selector: {matchLabels: {serving-volume: cache}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: serving-runtime-data
spec:
  storageClassName: serving-local
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 10Gi}}
  selector: {matchLabels: {serving-volume: runtime-data}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: serving-bundles
spec:
  storageClassName: serving-local
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 1Gi}}
  selector: {matchLabels: {serving-volume: bundles}}
