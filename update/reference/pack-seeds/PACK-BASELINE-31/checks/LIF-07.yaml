id: LIF-07
framework_id: CHK-LIF-007
mechanism_ids:
- mechanism-10
revision: 5
retired: false
area: LIF
purpose: 기동 준비 확인
secondary_purposes: []
question: 필요한 worker와 모델 실행 준비가 끝난 뒤 요청을 받는가?
scope: 기본 TP; 선택 graph/backend는 실제 설정
risk_category: 보안 위협·일반 장애 함께 점검
risk_summary: 승인 확인을 우회한 운영자나 준비 상태 오류 때문에 미준비·비승인 모델이 요청을 받아 잘못된 응답·서비스 중단을 일으킬 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 기본 TP의 필수 rank·모델 준비와 접수 gate를 확인한다. 선택 graph/backend의 준비 항목은 실제 설정에 맞춰 추가한다.
policy_params:
- key: required_readiness_items
  type: list[str]
  required: true
policy_prose:
  policy_to_decide: 필수 준비 항목·재개 승인·정상 기능 기준
  enterprise_decisions: 필수 준비 항목·성능 수용 기준·정상 시험 입력·준비 증거·재개 승인 역할. 공급물 승인과 운영 준비 판정을 연결한다.
normal_control: 모든 필수 rank와 모델 준비 후 실제 정상 추론이 성공한다.
challenge_steps:
- 준비 단계의 rank 하나를 안전하게 지연
- listener·health·Gateway readiness·추론 결과 비교
- 준비 후 허용 확인
required_observations: []
required_observations_prose:
- rank 준비/listener 시각/readiness 판정·실제 추론
satisfied_if: 필수 준비 미완료 상태에서는 접수를 허용하지 않고 완료 후 정상 처리한다.
fail_criteria: 필수 준비 조건 충족 전에 서비스 수용을 허용한다.
unknown_criteria: health 응답만 있고 rank·model 준비 또는 실제 접수 시점을 모른다.
remediation: '- 실제 모델 로딩과 필수 worker·실행 모드 준비를 서비스 수용 조건에 반영한다. 준비 확인용 정상 추론까지 성공한 뒤 요청을 받고 일부 준비 실패 시 수용을 보류한다.'
method_and_evidence: '필수 rank의 모델 로딩·KV·선택 graph/backend 준비와 외부 service gate의 실제 신규 요청 수용 시각을 연결한다. 필수 준비 하나를 지연한 동안 listener·health 응답과 실제 접수를 구분해 대조하고, 준비 완료 후 정상 canary와 요청 수용을 확인한다. 초기 준비 실패를 상위 기동 결과에 반영하는지는 CHK-LIF-009에서 따로 판정한다. vLLM v0.31.0의 공통 【F32】 근거 중 기본 재배포·외부 gate·정상 로딩 조건을 참조한다. 근거 원문: [F32](https://github.com/mg-princess/serving-security-framework/blob/8a0c7fe42446ff0d3a1f58e2a18cf3069d5c714e/data/checklist.json#L33911).'
remaining_setup: 준비 gate·외부 proxy 확인; keep/dev 옵션 유효값 기록
