id: REQ-06
framework_id: CHK-REQ-006
mechanism_ids:
- mechanism-01
revision: 4
retired: false
area: REQ
purpose: 작업·대상 인가
secondary_purposes: []
question: 저장된 결과를 조회하거나 취소할 때 해당 객체의 권한을 확인하는가?
scope: 조건부
risk_category: 보안 위협 점검
risk_summary: 호출자가 타인의 response ID를 이용해 결과를 읽거나 취소·덮어쓰기·대화 이어쓰기를 해 타인 정보와 작업을 침해할 수 있음.
review_order: conditional_when_selected
impact: null
applies_when:
  prose: 조회·취소할 수 있는 저장 Responses/결과 객체를 지원·사용할 때 적용한다. 메모리 저장도 포함하며 일반 요청의 내부 collector와 구분한다.
policy_params:
- key: stored_environment_sha256
  type: str
  required: true
- key: stored_target_sha256
  type: str
  required: true
- key: stored_session
  type: str
  required: true
- key: stored_identity_policy_sha256
  type: str
  required: true
- key: stored_api_router_source_sha256
  type: str
  required: true
- key: stored_serving_source_sha256
  type: str
  required: true
- key: stored_protocol_source_sha256
  type: str
  required: true
- key: stored_validity_start
  type: str
  required: true
- key: stored_validity_end
  type: str
  required: true
- key: stored_origins
  type: list[str]
  required: true
- key: stored_operations
  type: list[str]
  required: true
- key: stored_retention
  type: str
  required: true
policy_prose:
  policy_to_decide: 결과 소유자·공유·취소 권한
  enterprise_decisions: 인증 방식·실제 계정, 사용자/조직별 모델·작업 허용표, 직통 허용 주체·목적, 관리 역할, Gateway의 신원 전달·경로 변환과 선택 API. 저장 결과 기능을 쓰면 객체 소유자·조회·취소 권한도 결정한다.
normal_control: A는 자신의 저장 결과를 조회·취소하고 B는 자신의 객체를 사용한다.
challenge_steps:
- A·B 객체 생성
- B가 A의 ID로 조회·취소·previous_response 연결 시도
- 저장 객체와 실제 작업 영향 확인
required_observations:
- key: stored_trials
  type: list
- key: stored_objects
  type: list
- key: stored_effects
  type: list
- key: stored_missing
  type: list
- key: stored_conflict_candidates
  type: list
- key: stored_cleanup
  type: list
- key: stored_producer_authenticated
  type: bool
- key: stored_object_owner_verified
  type: bool
- key: stored_worker_effect_verified
  type: bool
- key: stored_scope_complete
  type: bool
required_observations_prose:
- 객체 owner·ID/요청 신원/저장 내용·체인·취소 결과
satisfied_if: 타 주체의 비허용 조회·취소가 거부된다. ID를 알고 있다는 사실을 권한으로 취급하지 않는다.
fail_criteria: B가 A의 결과를 읽거나 변경·취소하거나 허용 밖 이전 결과를 연결한다.
unknown_criteria: 저장 기능 활성·owner 기준 또는 객체별 실제 효과를 확인하지 못했다.
remediation: '- 저장 결과와 작업 객체에 소유자·허용 행위를 기록하고 조회·변경·취소마다 검사한다. 요청 ID나 객체 ID를 아는 것과 사용 권한을 구분하고 이전 결과를 참조할 때도 같은 검사를 적용한다.'
method_and_evidence: '두 시험 주체가 서로의 알려진 response ID로 조회·취소를 시도한다. 조회와 취소는 별도 결과로 기록한다.<br><br>**vLLM v0.31.0 구현 메모:** 【F14】Responses store는 VLLM_ENABLE_RESPONSES_API_STORE 활성 및 request.store 필요. 해당 저장소 접근 코드에 소유자 검사 없음. A/B 사용자로 저장한 response ID를 조회·취소·previous_response_id 이어쓰기·request_id 재사용 덮어쓰기한다. Gateway와 직통 경로를 각각 확인. 정상 대조: A가 자신의 결과 조회·이어쓰기 가능, B의 별도 ID 작업 정상'
remaining_setup: Responses 저장 등 활성 조건; 시험 객체 외에는 접근하지 않음
executor: stored_responses
judge:
  plugin: rule_table
  params:
    pass_when_all:
    - obs: stored_trials
      op: nonempty
    - obs: stored_producer_authenticated
      op: eq
      value: true
    - obs: stored_object_owner_verified
      op: eq
      value: true
    - obs: stored_worker_effect_verified
      op: eq
      value: true
    - obs: stored_scope_complete
      op: eq
      value: true
    - obs: stored_missing
      op: empty
    - obs: stored_conflict_candidates
      op: empty
    fail_when_any:
    - obs: stored_conflict_candidates
      op: nonempty
      when:
        obs: stored_object_owner_verified
        op: eq
        value: true
legacy:
  q_ids:
  - Q-C02
  scenario_ids:
  - SC-02-03
  subtest_ids:
  - Q-C02/SC-02-03
source:
  array: request_state_assessment_draft
collection_profile: kubernetes-stored-response-ownership-v1
limitations:
- '구현 분기: 두 자격으로 소유 실행 UUID의 닫힌 객체를 만들어 상호 조회·취소·previous 연결·덮어쓰기를 시험한다. 현재 실행이 만든 ID만 사용한다.'
- '미구현 분기: 실제 owner·principal·worker 효과의 독립 근거가 없어 보안 PASS와 보안 FAIL은 현재 도달하지 않는다. 타 주체 접근 성공은 HTTP 사실과 후보로만 남는다.'
- kubernetes 구현만 있다. lab=true/vLLM 0.31 명시 프로필이다. 정리는 소유 cancel-target만 다루고 DELETE나 worker 재시작을 가정하지 않는다.
