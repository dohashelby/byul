  enterprise_decisions: 요청별/그룹별 회수 대상·잔존 참조·강제 종료·중복 비용 처리. 공유 weights/profiler/retry는 기능 선택 후 별도 수명·종료 계약을 확인한다.
normal_control: 참조구성에서는 자동 retry 없이 한 호출이 한 attempt로 기록된다.
challenge_steps:
- 정상 시도 기준선
- timeout·연결 종료 후 사용자가 명시 재호출
- 이전 잔존·새 attempt·중복 비용 확인
