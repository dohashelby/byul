applies_when: { always: true }
policy_params:
  - { key: collector_profile, type: str, required: true }
  - { key: required_trusted_fields, type: "list[str]", required: true }
  - { key: client_request_id_trust, type: str, required: true }
executor: log_integrity
normal_control: "고정 native INFO 프로파일에서 정상 body request ID의 1-token 추론과 실제 request log 도달을 전후 대조한다. 복수행 ID는 별도 챌린지이며 prompt 로깅은 이 범위 밖이다."
challenge_steps:
  - "JSON 본문 request_id의 무해 복수행 ID가 실제 native INFO logger와 reference collector에 도달하는지 확인"
  - "CR·CRLF ID의 실제 수용·원본 사건 경계와 동일 logger 메타데이터를 대조"
  - "예약 필드·HTML 유사 ID를 비신뢰 메시지로 소비하고 별도 표시 artifact의 사건 대응을 확인"
required_observations:
  - { key: log_collector_profile, type: str }
  - { key: log_client_request_id_trust, type: str }
  - { key: log_trusted_fields, type: "list[str]" }
  - { key: log_required_trusted_fields, type: "list[str]" }
  - { key: log_identity_verified, type: bool }
  - { key: log_collection_complete, type: bool }
  - { key: log_boundaries_preserved, type: bool }
  - { key: log_trusted_fields_preserved, type: bool }
  - { key: log_display_verified, type: bool }
  - { key: log_trials_planned, type: "list[str]" }
  - { key: log_trials_reached, type: "list[str]" }
  - { key: log_security_violations, type: "list[str]" }
  - { key: log_coverage_gaps, type: "list[str]" }
  - { key: normal_controls, type: bool }
  - { key: functional_probes_planned, type: "list[str]" }
  - { key: functional_probe_results, type: "dict[str, outcome]" }
judge:
  plugin: rule_table
  params:
    fail_when_any:
      - { obs: log_security_violations, op: nonempty }
    pass_when_all:
      - { obs: log_collector_profile, op: eq, value_policy: collector_profile }
      - { obs: log_client_request_id_trust, op: eq, value_policy: client_request_id_trust }
      - { obs: log_required_trusted_fields, op: eq, value_policy: required_trusted_fields }
      - { obs: log_trusted_fields, op: eq, value: [process, level, source] }
      - { obs: log_identity_verified, op: eq, value: true }
      - { obs: log_collection_complete, op: eq, value: true }
      - { obs: log_coverage_gaps, op: eq, value: [] }
      - { obs: log_boundaries_preserved, op: eq, value: true }
      - { obs: log_trusted_fields_preserved, op: eq, value: true }
      - { obs: log_display_verified, op: eq, value: true }
      - { obs: log_trials_planned, op: eq, value: [before, multiline, cr, crlf, reserved, html, after] }
      - { obs: log_trials_reached, op: superset_of, value_obs: log_trials_planned }
      - { obs: normal_controls, op: eq, value: true }
    axes:
      functional:
        pass_when_all:
          - { obs: functional_probes_planned, op: eq, value: [before, after] }
          - { obs: functional_probe_results, op: superset_of, value_obs: functional_probes_planned }
          - { obs: functional_probe_results, op: all_in, value: [pass] }
          - { obs: normal_controls, op: eq, value: true }
functional_probes:
  - method: POST
    path: /v1/completions
    body: { model: '{model}', prompt: guard log control, max_tokens: 1 }
    expect: [200]
    via: engine
limitations:
  - guard-vllm-native-info-v1은 실제 소유한 단일 엔진의 고정 native INFO logger를 guard reference parser·collector가 소비하는 제한 프로파일이다. 기업 collector·SIEM·모든 sink·인증 principal·주체별 상태·감사 체계의 보호를 검증하지 않는다.
  - JSON 본문 request_id의 고정 무해 ID만 전송한다. prompt·DEBUG·임의 formatter·사용자 parser·raw CRLF header의 서버 수용은 시험하지 않는다. 클라이언트 거부나 무관한 HTTP 오류를 엔진 parser 또는 로그 보호 성공으로 보지 않는다.
  - 메시지는 비신뢰 opaque 값이며 외부 ID는 untrusted_correlation이다. 메시지의 actor·principal·status·level 유사 문자열을 신뢰 필드로 승격하지 않는다. 신뢰 필드는 실제 logger의 process·level·source에 한정하고 기업에서 요구한 다른 필드는 UNKNOWN으로 남긴다.
  - source SHA·실제 기동 argv와 logging env·container label/image/ID/StartedAt의 전후 일치와 정상 요청 로그 도달을 확인한다. LF와 CRLF를 구분하지만 경계가 모호한 CR·잘림·미지원 접두사·UTF-8 대체 문자는 UNKNOWN이다. 캡처 해시는 UTF-8로 해독된 Docker CLI 출력의 해시이며 daemon 원시 파일 바이트의 해시가 아니다.
  - raw 캡처→실제 parser→구조화 JSON→escaped HTML 대응을 별도 EVD artifact로 보존한다. 기존 RPT 본문이 세부 사건을 자동 표시하거나 외부 기업 화면까지 검증했다고 주장하지 않는다. 반복 사건·신뢰 메타데이터 변화가 명확하면 FAIL이며 다른 미확인 사항이 이를 지우지 않는다. 성능은 미검증이다.
