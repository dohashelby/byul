id: REQ-03
framework_id: CHK-REQ-003
revision: 3
retired: false
area: REQ
purpose: 요청·대상 접근 권한
framework_purpose: 작업·대상 인가
mechanism_ids:
- mechanism-01
secondary_purposes: []
question: 일반 사용자가 허용받지 않은 관리·진단 작업을 할 수 없는가?
scope: 기본+활성 기능
risk_category: 보안 위협 점검
risk_summary: 일반 호출자가 관리·진단 API를 실행해 모델 상태를 바꾸거나 비공개 자료를 수집·열람할 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  all:
  - fact: gateway
    eq: true
  prose: 관리 접점의 등록·노출·권한을 기본 확인한다. 진단·profiler 등은 활성 기능별로 추가한다.
policy_params:
- key: general_allowed_kinds
  type: list[str]
  required: true
policy_prose:
  policy_to_decide: 작업별 역할·허용 범위
  enterprise_decisions: 인증 방식·실제 계정, 사용자/조직별 모델·작업 허용표, 직통 허용 주체·목적, 관리 역할, Gateway의 신원 전달·경로 변환과 선택 API. 저장 결과 기능을 쓰면 객체 소유자·조회·취소 권한도 결정한다.
normal_control: 관리 역할은 허용 작업을 수행하고 일반 호출자는 추론만 수행한다.
challenge_steps:
- 활성 관리·진단 route 목록 확보
- 일반키와 관리권한으로 같은 무해 조회·진단 작업 호출
- 부수 효과 확인
required_observations:
- key: routes_registered
  type: list[str]
- key: routes_tested
  type: list[str]
- key: nonadmin_outcomes
  type: dict[str, int|outcome]
- key: functional_probes_planned
  type: list[str]
- key: functional_probe_results
  type: dict[str, pass|fail|no_response]
required_observations_prose:
- route별 요구 역할/키·신원별 응답/실제 관리·진단 동작
satisfied_if: 역할 범위 밖 작업이 수행되지 않는다. API key 존재만으로 역할 인가를 충족 처리하지 않는다.
fail_criteria: 일반 호출자가 금지 관리·진단 동작을 실행한다.
unknown_criteria: route 미등록·도달불가를 인가 성공으로 오인하거나 실제 효과를 확인하지 못했다.
remediation: '- 관리·진단 API를 일반 추론 API와 구분해 작업별 허용 역할을 적용한다. 사용하지 않는 경로는 비활성화하거나 접근을 제한하고, profiler 등 선택 기능도 실제 실행 전에 권한을 검사한다.'
method_and_evidence: 무자격·일반·관리 역할로 실제 등록된 각 route를 대조한다. 각 작업별 결과를 따로 남긴다.
remaining_setup: 무해 관리 호출 선정; 활성 개발·동적 기능 경로 별도 표시
executor: role_route
judge:
  plugin: rule_table
  params:
    pass_when_all:
    - obs: routes_registered
      op: nonempty
    - obs: routes_tested
      op: superset_of
      value_obs: routes_registered
    - obs: nonadmin_outcomes
      op: superset_of
      value_obs: routes_registered
    - obs: nonadmin_outcomes
      op: all_in
      value:
      - 401
      - 403
    fail_when_any:
    - obs: nonadmin_outcomes
      op: any_between
      value:
      - 200
      - 299
    - obs: nonadmin_outcomes
      op: any_in
      value:
      - handler_reached
    axes:
      functional:
        pass_when_all:
        - obs: functional_probe_results
          op: nonempty
        - obs: functional_probe_results
          op: superset_of
          value_obs: functional_probes_planned
        - obs: functional_probe_results
          op: all_in
          value:
          - pass
        fail_when_any:
        - obs: functional_probe_results
          op: any_in
          value:
          - fail
legacy:
  q_ids:
  - Q-C01
  scenario_ids:
  - SC-01-03
  subtest_ids:
  - Q-C01/SC-01-03
source:
  array: request_state_assessment_draft
observation_notes:
  nonadmin_outcomes: Gateway 경유. 상태 변경 경로는 어댑터의 검증된 안전 프로브만 보내고, 기대 응답이 오면 handler_reached (인가 없이 핸들러 도달). 관리 역할 결과(admin_outcomes)는 증거 파일에만.
route_scope:
  include_kinds:
  - admin
  - diagnostic
  exclude_kinds_policy: general_allowed_kinds
functional_probes:
- method: POST
  path: /v1/completions
  body:
    model: '{model}'
    prompt: ping
    max_tokens: 1
  expect:
  - 200
  as_role: general
- method: GET
  path: /metrics
  expect:
  - 200
  as_role: admin
functional_scope:
  probed_obs: functional_probe_results
  of_obs: routes_registered
