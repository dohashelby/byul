name: guard contracts
on:
  push:
    branches: [main, "codex/**"]
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.11
      - run: uv sync --frozen
      - name: Measure default suite parent wall clock
        run: |
          uv run python - <<'PY'
          import subprocess
          import sys
          import time

          start = time.perf_counter()
          result = subprocess.run([sys.executable, "-m", "pytest", "-q", "--durations=50"])
          elapsed = time.perf_counter() - start
          print(f"Default suite parent wall clock: {elapsed:.3f}s", flush=True)
          raise SystemExit(result.returncode)
          PY
      - run: uv build --wheel
      - name: Verify installed wheel outside checkout
        run: uv run python tools/verify_installed.py --wheel dist/guard-0.1.0-py3-none-any.whl --output "${{ runner.temp }}/guard-installed-verification"
  stub-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.12.11
      - run: uv sync --frozen
      - name: Verify Python 3.12 Docker stub and probe contracts
        run: |
          uv run python - <<'PY'
          import os
          import subprocess
          import sys
          import time

          start = time.perf_counter()
          result = subprocess.run([sys.executable, "-m", "pytest", "-q", "-m", "docker",
              "tests/test_lab_docker.py", "--basetemp", os.path.join(os.environ["RUNNER_TEMP"], "guard-python312-docker")])
          print(f"Docker stub suite parent wall clock: {time.perf_counter() - start:.3f}s", flush=True)
          raise SystemExit(result.returncode)
          PY
      - name: Record Python helper image identity
        run: |
          docker image inspect python:3.12-slim --format '{{json .RepoDigests}}'
          docker run --rm --network none --cpus 1 --memory 128m python:3.12-slim python -c "import sys; print(sys.version); assert sys.version_info[:2] == (3, 12)"
