# SUP-04 실행 이미지 분기. 기존 package/entrypoint challenge는 미실행으로 남긴다.
# 기업 승인값을 넣는 파일이 아니라 필요한 정책의 명세다.
applies_when: { always: true }
collection_profile: running-image-approval-v1
policy_params:
  - { key: approved_image_digests, type: "list[str]", required: true }
required_observations:
  - { key: running_image_identity_verified, type: bool }
  - { key: running_image_repo_digest, type: str }
  - { key: running_image_approved, type: bool }
  - { key: running_image_unapproved, type: bool }
  - { key: supply_execution_scope_complete, type: bool }
  - { key: functional_probes_planned, type: "list[str]" }
  - { key: functional_probe_results, type: "dict[str, pass|fail|no_response]" }
executor: container_config
judge:
  plugin: rule_table
  params:
    declared_pass_ceiling: true
    pass_when_all: []
    fail_when_any:
      - { obs: running_image_unapproved, op: eq, value: true }
    axes:
      functional:
        pass_when_all:
          - { obs: functional_probe_results, op: nonempty }
          - { obs: functional_probe_results, op: superset_of, value_obs: functional_probes_planned }
          - { obs: functional_probe_results, op: all_in, value: [pass] }
        fail_when_any:
          - { obs: functional_probe_results, op: any_in, value: [fail] }
functional_probes:
  - method: POST
    path: /v1/completions
    body: { model: "{model}", prompt: ping, max_tokens: 1 }
    expect: [200]
    via: engine
limitations:
  - "running-image-approval-v1은 소유된 실행 컨테이너의 pinned RepoDigest 승인 분기만 확인한다. 패키지·native library·entrypoint·추가 마운트 전체 공급물 검증과 배포 차단 challenge는 미검증이므로 보안 PASS를 만들지 않는다."
  - "approved_image_digests는 repository@sha256:<64자리 소문자 hex> 목록이다. 빈 목록은 명시적인 승인 이미지 없음이며, 관측 결과나 ENV에서 승인값을 보충하지 않는다."
  - "원문 package/entrypoint 변경·배포 검사 challenge는 미실행으로 보존한다. 정상 추론 관측이 pass여도 전체 challenge가 완결되지 않아 기능 PASS 관문이 보류될 수 있다."
  - "이미지 metadata 수집 전후의 identity 안정성은 해당 수집 구간의 근거다. 정상 추론은 그 뒤 별도 관측하며 패키지 import나 모든 worker의 공급물 소비를 증명하지 않는다."
  - "정책 승인값은 기업 신고이며 승인 주체·서명·증거 진위를 인증하지 않는다. tag-only·local image ID만 있거나 digest 연결·소유권·전후 identity가 불명확하면 UNKNOWN이다."
