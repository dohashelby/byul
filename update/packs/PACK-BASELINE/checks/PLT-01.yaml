id: PLT-01
framework_id: CHK-PLT-001
revision: 5
retired: false
area: PLT
purpose: 실행 권한 제한
framework_purpose: 실행 최소 권한
mechanism_ids:
- mechanism-11
secondary_purposes: []
question: 엔진과 worker의 호스트·파일·장치 권한이 필요한 범위에 한정되는가?
scope: 기본; 실제 계정·컨테이너·마운트·장치
risk_category: 보안 위협 점검
risk_summary: 허용 코드가 침해되거나 비승인 코드가 실행됐을 때 과도한 호스트·파일·장치 권한을 이용해 엔진 밖 자료와 서비스까지 침해할 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  always: true
  prose: 실행 계정·호스트/컨테이너·mount·장치 접근을 기본 확인한다. 컨테이너 비사용도 제외 사유가 아니다.
policy_params:
- key: allowed_capabilities
  type: list[str]
  required: true
- key: allowed_mounts
  type: list[str]
  required: true
- key: allowed_devices
  type: list[str]
  required: true
- key: require_non_root
  type: bool
  required: true
- key: allowed_exec_writable_paths
  type: list[str]
  required: true
policy_prose:
  policy_to_decide: 역할별 필요한 자원·쓰기 범위
  enterprise_decisions: 계정·컨테이너·namespace·mount·device·socket/SHM 권한과 실제 필요 권한 예외. 초기 설치/장치 준비 권한과 지속 실행 권한을 분리한다.
normal_control: 승인 실행 계정이 필요한 모델·장치에 접근해 추론한다.
challenge_steps:
- 유효 UID·capability·mount·device 수집
- 필요 없는 시험 파일·장치에 읽기/쓰기 요청
- 정상 추론과 권한 거부 확인
required_observations:
- key: process_scan_complete
  type: bool
- key: capabilities_effective
  type: list[str]
- key: mounts
  type: list[str]
- key: devices
  type: list[str]
- key: privileged
  type: bool
- key: host_namespaces
  type: list[str]
- key: root_uid_present
  type: bool
- key: sentinel_results
  type: dict[str, denied|succeeded|absent|error]
- key: exec_writable_mounts
  type: list[str]
- key: functional_probes_planned
  type: list[str]
- key: functional_probe_results
  type: dict[str, pass|fail|no_response]
required_observations_prose:
- 실행 계정·권한/mount·device allowlist/접근 결과·정상 추론
satisfied_if: 필요 밖 접근이 제한되고 정상 로딩·TP는 유지된다.
fail_criteria: 정책상 불필요한 파일·장치·호스트 권한을 사용한다.
unknown_criteria: 유효 권한·컨테이너 밖 집행 또는 필요한 권한 목록이 미정이다.
remediation: '- 엔진·worker 계정의 호스트·파일·mount·장치 권한을 실제 업무에 필요한 범위로 제한한다. 컨테이너 사용 여부에 맞춰 호스트 접근과 다른 작업 영역의 접근 권한을 확인한다.'
method_and_evidence: 계정·capability·mount·device·쓰기 대상 목록과 허용/비허용 무해 접근을 대조한다.
remaining_setup: 실제 허용 권한표와 무해 sentinel 자원
executor: container_config
judge:
  plugin: rule_table
  params:
    pass_when_all:
    - obs: process_scan_complete
      op: eq
      value: true
    - obs: capabilities_effective
      op: subset_of
      value_policy: allowed_capabilities
    - obs: mounts
      op: subset_of
      value_policy: allowed_mounts
    - obs: devices
      op: subset_of
      value_policy: allowed_devices
    - obs: privileged
      op: eq
      value: false
    - obs: host_namespaces
      op: subset_of
      value: []
    - obs: root_uid_present
      op: eq
      value: false
      when_policy: require_non_root
    - obs: sentinel_results
      op: all_in
      value:
      - denied
      - absent
    - obs: exec_writable_mounts
      op: subset_of
      value_policy: allowed_exec_writable_paths
    fail_when_any:
    - obs: capabilities_effective
      op: not_subset_of
      value_policy: allowed_capabilities
    - obs: mounts
      op: not_subset_of
      value_policy: allowed_mounts
    - obs: devices
      op: not_subset_of
      value_policy: allowed_devices
    - obs: privileged
      op: eq
      value: true
    - obs: host_namespaces
      op: nonempty
    - obs: root_uid_present
      op: eq
      value: true
      when_policy: require_non_root
    - obs: sentinel_results
      op: any_in
      value:
      - succeeded
    - obs: exec_writable_mounts
      op: not_subset_of
      value_policy: allowed_exec_writable_paths
    axes:
      functional:
        pass_when_all:
        - obs: functional_probe_results
          op: nonempty
        - obs: functional_probe_results
          op: superset_of
          value_obs: functional_probes_planned
        - obs: functional_probe_results
          op: all_in
          value:
          - pass
        fail_when_any:
        - obs: functional_probe_results
          op: any_in
          value:
          - fail
legacy:
  q_ids:
  - Q-C10
  scenario_ids:
  - SC-14-04
  subtest_ids:
  - Q-C10/SC-14-04
source:
  array: platform_assessment_draft
functional_probes:
- method: POST
  path: /v1/completions
  body:
    model: '{model}'
    prompt: ping
    max_tokens: 1
  expect:
  - 200
  via: engine
limitations:
- 실행 가능한 쓰기 경로 {len:allowed_exec_writable_paths}개가 정책으로 허용됨 {allowed_exec_writable_paths} — 엔진 컴파일 캐시(torch inductor .so)를 위해 쓰기·실행이 모두 가능한 영역이 필요하다.
- 이 점검은 컨테이너 설정(docker inspect)과 컨테이너 안 프로세스 권한만 본다. 호스트·VM 쪽 집행(LSM 정책, 호스트 파일 권한)은 보지 않으며, 실험실 결과는 Docker Desktop의 리눅스 VM 기준이다.
