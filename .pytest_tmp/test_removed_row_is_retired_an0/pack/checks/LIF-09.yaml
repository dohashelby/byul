area: LIF
purpose: 실패 감지·전파
secondary_purposes: []
question: 초기화·모델 준비의 부분 실패가 성공으로 처리되지 않는가?
scope: 기본; Ray actor/DAG 단계는 선택
risk_category: 일반 장애·복구 점검
risk_summary: 일부 worker 초기화·로딩 실패를 성공으로 처리하면 불완전 모델로 응답하거나 장애가 반복될 수 있음. 공격자의 유발 능력은 별도 확인.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 기본; Ray actor/DAG 단계는 선택
policy_params: []
policy_prose:
  policy_to_decide: 초기화 실패·접수 제한·복귀 방침
  enterprise_decisions: 실패 유형별 감지·전달·중단·복구 절차와 책임자, 영향 요청 오류 처리·알림 경로.
normal_control: 모든 준비 단계가 성공한 정상 기동만 완료 상태가 된다.
challenge_steps:
- 시험 모델 파일·rank 준비 한 곳만 실패
- 상위 기동·readiness·진행 작업 상태 확인
- 수정 후 재기동
required_observations: []
required_observations_prose:
- 실패 단계
- 집계 기동 상태
- 임시 자원·재기동
satisfied_if: 부분 준비를 성공으로 보고 서비스하지 않는다.
fail_criteria: 부분 준비 실패가 전체 성공으로 표시되거나 서비스에 들어간다.
unknown_criteria: 실패한 구성요소와 집계 상태의 대응을 확인하지 못했다.
remediation: 실패 시 수용 보류와 그룹별 준비 확인을 배포 절차에 연결한다 승인 인계·수용 차단·실제 준비 확인을 배포 도구에 구현한다
method_and_evidence: '설정·로딩·worker 준비 단계별 제한 실패에서 접수 gate·오류·남은 객체를 기록한다. 【F32】기본 재배포는 외부 gateway/LB와 실제 승인 모델 준비 확인. live/keep/collective_rpc는 선택 구성에서만 도달성·상태 보존 확인; snapshot 경로와 일반기동 혼동 금지. 기본 재배포: 정상 로딩 완료·불완전 적재와 외부 요청 gate를 대조한다. 선택 live 변경을 사용하는 경우에만 abort/wait/keep의 요청·weights·cache 세대를 시험한다. 정상 대조: 기본: 정상 로딩 완료 후 요청과 실패 시 외부 gate 확인. 선택 live 활성 시에만 abort/wait/keep 및 모델·cache·요청 세대 추적.'
remaining_setup: 작은 준비 실패 fixture·단계별 상태 계측
