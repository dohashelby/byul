id: PLT-04
framework_id: CHK-PLT-004
mechanism_ids:
- mechanism-11
revision: 4
retired: false
area: PLT
purpose: 자격 제공·사용 제한
secondary_purposes: []
question: worker에 필요 없는 자격·비밀정보를 넘기지 않는가?
scope: 기본 환경 전달 확인; Ray 원격 전달은 선택
risk_category: 보안 위협 점검
risk_summary: 침해된 worker가 불필요하게 상속받은 secret·자격을 이용해 저장소 등 다른 서비스의 자료에 접근할 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  always: true
  prose: 기본 worker 환경·자격 상속을 확인한다. Ray/원격 worker 전달은 해당 실행기를 사용할 때 추가한다.
policy_params:
- key: forbidden_env_names
  type: list[str]
  required: true
- key: forbidden_mount_paths
  type: list[str]
  required: true
- key: credential_candidate_paths
  type: list[str]
  required: false
policy_prose:
  policy_to_decide: worker별 필요한 자격·전달 범위
  enterprise_decisions: 역할별 저장소·객체 범위, 자격 공급·갱신 방식과 실제 필요한 worker 자격, 허용 대체 경로. 비밀 원문 대신 참조·수신자·범위를 기록한다.
normal_control: worker가 필요한 최소 자격으로 정상 실행한다.
challenge_steps:
- 컨테이너 프로세스의 환경변수 이름 수집
- 명시한 금지 마운트 조건과 자격 후보 메타데이터를 구분하여 확인
- 정상 추론 확인
required_observations:
- key: process_scan_complete
  type: bool
- key: worker_env_names
  type: list[str]
- key: forbidden_mount_violations
  type: list[str]
- key: credential_candidate_results
  type: dict[str, outcome]
- key: credential_candidates_complete
  type: bool
- key: credential_candidates_planned
  type: list[str]
- key: functional_probes_planned
  type: list[str]
- key: functional_probe_results
  type: dict[str, outcome]
required_observations_prose:
- env·mount·credential provider/rank별 유효 자격/정상 기능 결과
satisfied_if: 필요하지 않은 소비자에게 자격을 노출하지 않는다.
fail_criteria: 불필요한 자격이 worker에 전달되어 접근에 사용 가능하다.
unknown_criteria: env만 확인하고 파일·provider·상속 자격 경로를 확인하지 못했다.
remediation: '- driver·부모 프로세스의 환경변수·Secret·파일·mount에서 worker로 전달할 자격을 필요한 것만 명시한다. worker가 받은 자격과 실제 접근 가능한 저장소·서비스를 대조하고 불필요한 전달을 제거한다.'
method_and_evidence: driver→worker의 변수 이름·출처·consumer를 대조하고 canary 변수로 추가/제외 및 손상 제외 설정의 처리를 확인한다.
remaining_setup: 비밀 원문을 남기지 않는 자격 식별 수집기와 최소 목록
executor: credential_exposure
judge:
  plugin: rule_table
  params:
    declared_pass_ceiling: true
    pass_when_all:
    - obs: process_scan_complete
      op: eq
      value: true
    - obs: worker_env_names
      op: none_in
      value_policy: forbidden_env_names
    - obs: forbidden_mount_violations
      op: eq
      value: []
    - obs: credential_candidates_complete
      op: eq
      value: true
    - obs: credential_candidates_planned
      op: eq
      value_policy: credential_candidate_paths
    - obs: credential_candidate_results
      op: superset_of
      value_obs: credential_candidates_planned
    - obs: credential_candidate_results
      op: subset_of
      value_policy: credential_candidate_paths
    - obs: credential_candidate_results
      op: all_in
      value:
      - absent
      - denied
    fail_when_any:
    - obs: worker_env_names
      op: any_in
      value_policy: forbidden_env_names
    - obs: forbidden_mount_violations
      op: nonempty
    - obs: credential_candidate_results
      op: any_in
      value:
      - candidate_readable
    axes:
      functional:
        pass_when_all:
        - obs: functional_probe_results
          op: superset_of
          value_obs: functional_probes_planned
        - obs: functional_probe_results
          op: nonempty
        - obs: functional_probe_results
          op: all_in
          value:
          - pass
        fail_when_any:
        - obs: functional_probe_results
          op: any_in
          value:
          - fail
legacy:
  q_ids:
  - Q-C10
  - Q-C07
  scenario_ids:
  - SC-14-03
  subtest_ids:
  - Q-C10/SC-14-03
source:
  array: platform_assessment_draft
functional_probes:
- method: POST
  path: /v1/completions
  body:
    model: '{model}'
    prompt: ping
    max_tokens: 1
  expect:
  - 200
  via: engine
limitations:
- PLT-04 revision 3의 forbidden_mount_paths는 명시적인 마운트 금지 정책이다. 상·하위 포함 위반은 forbidden_mount_violations로 기록하며 실제 자격 파일 존재·접근의 증명으로 표현하지 않는다.
- credential_candidate_paths는 별도로 신고한 자격 후보 경로다. 누락하면 미수집 UNKNOWN이며 명시적인 빈 목록은 시험할 후보를 지정하지 않은 제한 범위다. 후보 부재·거부는 같은 worker 주체와 안정된 경로 관측이 있을 때만 확인한다.
- candidate_readable은 동일 worker 주체에서 신고한 후보의 읽기 권한을 관측한 것이며 자격 내용·실제 서비스 사용을 인증하지 않는다. 비밀 원문은 읽지 않는다. symlink·중첩 가림·주체 불일치·부분 수집은 UNKNOWN이다. 파일/provider/상속 자격 전체·호스트 권한·기업 승인 진위는 검증하지 않는다.
