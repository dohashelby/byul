id: REQ-18
framework_id: CHK-REQ-018
mechanism_ids:
- mechanism-04
revision: 2
retired: false
area: REQ
purpose: 실행 상태·버퍼 수명
secondary_purposes: []
question: batch slot을 옮기거나 재사용할 때 이전 요청의 제한 상태가 남지 않는가?
scope: 선택한 runner를 먼저 확인. V1 condense CPU mask 할당 분기에만 기존 mask 시험 적용; V2는 별도 입력·상태 경로
risk_category: 보안 위협·일반 장애 함께 점검
risk_summary: 호출자가 batch slot 재사용 조건을 유발할 때 이전 요청의 제한 상태가 남으면 자기 요청의 제한을 벗어나거나 타 요청 결과를 바꿀 수 있음.
review_order: implementation_path_first
impact: null
applies_when:
  prose: 실제 runner의 batch 자리 이동·재사용 경로를 확인한다. V1 CPU mask 시험과 V2 상태/count 시험을 구분한다.
policy_params: []
policy_prose:
  policy_to_decide: 요청별 제한 의미·정상 대조
  enterprise_decisions: 지원 GPU·runner·mode·shape/입력 범위, 정상 대조 방식·수치 오차·성능·장애 처리 기준과 실제 peer. 범위 밖 접근·타 요청 혼입·유출은 정책이나 허용 수치 오차로 완화할 수 없다.
normal_control: 서로 다른 sampling 제한의 A·B를 새 실행 자리에서 각각 처리해 요청별 상태와 정상 출력 범위를 확보한다.
challenge_steps:
- 활성 runner 확인
- A 종료 후 B가 같은 slot 사용하도록 작은 배치 실행
- B의 실제 제한 상태와 출력 대조
required_observations: []
required_observations_prose:
- 실제 실행기·요청 ID·재사용 단위/생성 세대와 현재 요청의 sampling 제한
- 이동·초기화·갱신 전후 상태, 최종 계산에 사용된 상태와 B 단독/재사용 시 결과
satisfied_if: 다른 요청의 mask·sampling 제한을 상속하지 않는다.
fail_criteria: A의 제한 상태가 B에 남거나 B의 현행 상태가 누락되어 출력이 달라진다.
unknown_criteria: slot 재사용 또는 해당 runner 상태 갱신을 계측하지 못했다.
remediation: '- 실제 runner가 관리하는 요청별 제한 상태를 batch slot 이동·교환·완료·재사용에 맞춰 갱신한다. V1 CPU mask 등 선택한 구현 경로의 이전 상태를 초기화하고 최종 sampling에 사용되는 상태가 현재 요청의 것인지 확인한다.'
method_and_evidence: 선정 실행기가 관리하는 요청별 sampling 제한 상태와 재사용 단위를 식별한다. A의 종료·자리 이동 뒤 B가 같은 단위를 쓸 때 현재 B의 상태가 최종 계산에 반영되는지, B의 단독 정상 대조와 상태·허용 출력 범위를 비교한다.
remaining_setup: 선정 실행기의 실제 sampling 상태와 자리 재사용·최종 소비를 확인할 수단; 제한 없는 B의 단독 대조 포함
