unknown_criteria: 생성 완료 기준이나 중단 지점·재기동 소비를 확인하지 못했다.
remediation: 대체 공급원에도 같은 승인 검사를 적용하고 불필요 fallback을 차단한다 실패 시 수용 보류와 그룹별 준비 확인을 배포 절차에 연결한다 원자적 완료 표시·불완전 파일 격리·재시도 예산과 정리를 둔다
method_and_evidence: 단계별 중단 뒤 완료 표시·실제 소비·재생성 및 후속 정상 처리를 대조한다.
