executor: engine_sensor
collection_profile: engine-sensor-communication-buffer-v1
policy_params: []
required_observations:
- key: engine_sensor_violation
  type: bool
- key: engine_sensor_full_scope
  type: bool
judge:
  plugin: rule_table
  params:
    pass_when_all:
    - obs: engine_sensor_full_scope
      op: eq
      value: true
    - obs: engine_sensor_violation
      op: eq
      value: false
    fail_when_any:
    - obs: engine_sensor_violation
      op: eq
      value: true

impact: MEDIUM
