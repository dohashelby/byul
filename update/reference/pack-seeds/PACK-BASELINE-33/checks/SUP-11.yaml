limitations:
- '구현 분기: 기존 표식 판정을 재사용해 일반 실행과 최적화 모드의 import 허용 차이를 찾으면 FAIL이다.'
- '미구현 분기: 기록 생산자 인증이 없어 PASS에 도달하지 않는다. 지원 모드 목록은 fixture 범위다.'
- kubernetes 구현만 있다. 실행기는 엔진을 만들거나 바꾸지 않는다. 정상·변경 기동은 준비 절차가 만들고 target·prepared로 받으며, 두 세션을 각각 수집해 합치지 않는다.
