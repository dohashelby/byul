id: OBS-01
revision: 1
retired: false
area: OBS
purpose: 필요한 사건의 기록
secondary_purposes: []
question: 필수 접근·관리·승인 사건을 주체·대상·실행과 연결할 수 있는가?
scope: 기본 접근·관리·공급물·배포; 필수 사건은 정책으로 선정
risk_category: 증거·판정 신뢰성 점검
risk_summary: 기록 누락·귀속 오류가 있으면 누가 승인·변경했는지 확인하지 못해 비승인 사용·권한 남용을 발견하거나 책임을 추적하기 어려움.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 기본 접근·관리·공급물·배포; 필수 사건은 정책으로 선정
policy_params: []
policy_prose:
  policy_to_decide: 필수 사건·식별값·책임 역할
  enterprise_decisions: 사건별 생성 집행점·필수 필드·수집 위치·책임자·증거 전달 방식. 요청 접수/응답 종료와 실제 실행 완료의 의미를 나눈다.
normal_control: 정상 접근·관리·승인 사건이 시험 ID로 서로 연결된다.
challenge_steps:
- 작은 허용·거부 사건을 각각 발생
- Gateway·배포·엔진·승인 기록 수집
- 주체·대상·실행·정책판 연결
required_observations: []
required_observations_prose:
- 사건별 필수 필드
- 원 기록·수집 시각
- 실행·정책·승인 ID 연결
satisfied_if: 필수 관계가 증거로 연결된다. 로그 수신만으로 승인 일치를 판정하지 않는다.
fail_criteria: 발생이 확인된 필수 사건에 필수 기록이 없거나 잘못된 주체·대상으로 연결된다.
unknown_criteria: 필수 사건·필드가 미정이거나 사건 발생·수집 경로를 확인하지 못했다.
remediation: 공통 식별자와 오류/수집 상태를 연결하고 민감값 대신 참조를 저장한다 필드 최소화·권한/보존·opt-out·송신통제·수집장애 표시를 실제 경로에 적용한다
method_and_evidence: 접근 허용/거부, 권한·정책 변경/철회, 관리 작업, 승인·검사·실제 소비 중 정책상 필수 사건을 선정한다. 각 사건의 주체·대상·결과·시각·승인/실행 ID와 원 동작을 대조한다. 요청 본문 전체 수집을 요구하지 않는다.
remaining_setup: 필수 사건 목록·기록 주체와 실제 correlation 수집
