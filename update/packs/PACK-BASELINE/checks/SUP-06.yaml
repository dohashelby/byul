framework_purpose: 실제 사용의 무결성
mechanism_ids:
- mechanism-08
secondary_purposes: []
question: 각 worker가 배정받은 승인 모델 파일·shard를 실제로 메모리에 올리는가?
scope: null
risk_category: 보안 위협·일반 장애 함께 점검
risk_summary: 공급물·공유 weights 변경권자가 잘못된 shard·모델 세대를 제공하거나 적재 오류가 발생해 비승인·불완전 모델로 응답할 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 기본 worker 적재는 항상 확인한다. 공유·원격 weights를 사용하면 publisher·model·rank·generation·layout·payload 대응을 추가한다.
policy_params: []
policy_prose:
  policy_to_decide: null
  enterprise_decisions: 변경을 허용할 주체, 불변 저장소·쓰기 제한·읽기 전 검증의 적용 방법, 각 rank가 읽은 파일·담당 shard·변환 결과의 증거와 기록 위치.
normal_control: 완전한 checkpoint로 필요한 모든 TP rank가 자신에게 배정된 부분을 로딩한다.
challenge_steps:
- rank별 정상 적재 기록
- 필수 tensor 일부가 없는 별도 fixture로 기동
- 누락 처리와 준비 상태 확인
required_observations: []
required_observations_prose:
- rank·shard·mapper·변환 설정/필수 tensor 정의·tracking 반환/로딩 완료 또는 거부. 공유·원격 weights 사용 시 publisher·세대·layout·payload와 실제 적재의 대응도 확보한다.
satisfied_if: 필요한 worker의 실제 적재 대상이 승인 내용과 일치한다. 공유·원격 weights를 사용하면 승인된 model·rank·generation·layout의 payload가 실제 적재돼야 한다. 전체 접수 재개는 C09에서 별도 판정한다.
fail_criteria: 필수 배정 부분이 없거나 승인과 다른데 정상 적재로 인정한다.
unknown_criteria: 모델별 필수 tensor·의도된 후처리 생성값 또는 rank 소비 기록을 알 수 없다. 공유·원격 weights에서 key·header만 확인하고 payload의 실제 적재를 확인하지 못한 경우도 포함한다.
remediation: '- 각 worker·rank가 읽을 승인 파일과 담당 shard를 기록하고 실제 적재 결과와 대조한다. 필수 부분이 없거나 다른 모델·버전이 적재되면 준비 완료로 처리하지 않고 원인을 해소한 뒤 정상 추론을 확인한다.'
method_and_evidence: 'node/rank·실제 파일·mapper·변환 설정·shard/layer 범위를 연결한다. 동일 경로명이나 canary 성공만으로 실물 일치를 판정하지 않는다. 【F33】선정 model.load_weights 반환,quantization,enable_weights_track 유효값. live reload는 선택환경이며 해당 V1 runner 경로. 선정 모델의 필수 tensor 일부 누락 fixture와 완전 fixture 비교. tracking 반환·양자화·명시옵션별 실제 누락 탐지와 서비스 준비/차단 확인. 의도된 양자화 후처리 생성 scale과 필수 누락은 구분. 정상 대조: 완전 checkpoint가 정상 기동·추론하며 의도한 후처리 param은 허용. 【F34】VLLM_MODEL_REDIRECT_PATH가 설정되고 매핑 파일·대상 키가 존재할 때. 유효 env·redirect 파일 내용/digest·변경권한·resolved model/tokenizer 경로를 승인 묶음에 포함. 같은 표시명에 다른 무해 모델 경로를 넣어 승인 불일치 탐지 확인. 정상 대조: 승인한 redirect 매핑과 실제 파일로 정상 적재.'
remaining_setup: 모델·양자화별 필수 tensor 기준과 rank 계측
