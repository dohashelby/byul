apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: serving-lab
resources:
  - ../gpu-lab
  - engine.yaml
patches:
  - path: backend-config.patch.yaml
  - target:
      kind: Deployment
      name: serving-gateway
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args/2
        value: sglang
