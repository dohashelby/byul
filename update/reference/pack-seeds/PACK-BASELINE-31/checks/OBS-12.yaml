id: OBS-12
framework_id: CHK-OBS-012
mechanism_ids:
- mechanism-14
revision: 3
retired: false
area: OBS
purpose: 보존·삭제
secondary_purposes: []
question: 로그·사용 통계·진단의 원본·사본과 모델·입력·캐시 사본이 각각 정한 보존·삭제 범위를 지키는가?
scope: '5.7 주 판정: 관측 자료 원본·사본; Q-C12 연결: 비관측 자산별 사본의 별도 보존·삭제 결과'
risk_category: 보안 위협 점검
risk_summary: 보존이 끝난 로그·usage·진단 사본에 접근한 주체가 삭제됐다고 여긴 민감정보를 계속 조회·반출할 수 있음.
review_order: reference_baseline_first
impact: null
applies_when:
  prose: 로그·사용 통계·진단의 원본과 실제 생성·저장·반출·백업 사본을 기본 확인한다. Q-C12로 연결된 모델·입력·임시 파일·cache·backup 사본도 자산별 적용 정책에 따라 별도로 확인한다. 사본별 적용 정책·기한·허용 예외 또는 필요한 증거가 미정인 부분은 미확인으로 남긴다.
policy_params: []
policy_prose:
  policy_to_decide: 보존 기간·법적/업무 예외·삭제 확인 수준
  enterprise_decisions: 자료별 사본 위치·보존 목적·업무상 예외·승인자·삭제 확인 수준, 저장소 version/잠금·백업·소유자. 비관측 사본은 R13 결과와 연결한다.
normal_control: 관측 자료와 별도 자산별 사본은 허용 보존 기간 동안 각 정책에서 정한 승인 위치·독자가 정상 조회할 수 있다.
challenge_steps:
- 관측 자료의 원본·사본과 Q-C12 연결 비관측 사본을 구분하고 위치·owner·보존 이유·적용 정책·기한·허용 예외의 inventory를 확보
- 선정한 시험 사본의 만료·삭제를 실행하고 원본·version·backup·원격 sink의 처리 기록을 확인
- 각 사본의 실제 조회·재사용·복구 가능성과 허용 보존 예외의 접근 제한을 대조
- 관측 자료의5.7 결과와 비관측 자산별 보존·삭제 결과를 따로 기록하고 관련 항목의 관측 참조를 연결
required_observations: []
required_observations_prose:
- 관측/비관측 구분, 자산·사본별 위치·owner·보존 이유·적용 정책·기한·허용 예외
- 사본별 만료·삭제 작업과 실제 조회·재사용·복구 가능성, 관측 자료의5.7 결과와 Q-C12 자산별 결과의 연결
satisfied_if: 관측 자료의 원본·사본은 정한 보존·삭제 기간과 범위를 지키며 그 결과를5.7에 반영한다. Q-C12로 연결된 비관측 사본은 자산별 적용 정책·기한·허용 예외를 지키는지 별도 결과로 남기며 그 결과를5.7의 충족으로 대신 표시하지 않는다. POST 시도나 파일 unlink만으로 모든 사본 삭제를 확정하지 않는다. 잔존 bytes 자체를 무조건 실패로 보지 않고 사본 수명과 실제 금지 접근·참조·재사용/복구 가능성을 해당 정책과 대조한다.
fail_criteria: 관측 자료 또는 자산별 비관측 사본이 각각 적용되는 보존·삭제 요구를 위반해 노출·잔존하거나 조기 삭제된다.
unknown_criteria: 사본별 적용 정책·보존/삭제 기한·허용 예외가 미정이거나 원본·원격·backup 사본의 실제 조회·재사용·복구 가능성과 필요한 처리 증거를 확인하지 못했다. 해당 부분은 관측/비관측 범위와 사본별로 미확인으로 남긴다.
remediation: '- 로그·usage·진단의 원본·사본·백업 위치와 보존·삭제 기한·예외를 관리한다. 만료 후 조회·복구 가능 여부를 사본별로 확인하고 삭제 지연·미관측 사본을 별도 상태로 기록한다.'
method_and_evidence: 로그·사용 통계·진단의 원본·회전파일·collector·원격 sink·backup 사본과 Q-C12로 연결된 모델·입력·임시 파일·cache·backup 사본을 inventory에서 구분한다. 사본별 위치·소유자·consumer·보존 이유·적용 정책·기한·허용 예외를 기록하고, 만료·삭제 작업 뒤 실제 조회·재사용·복구 가능성을 대조한다. 원격 수신·삭제는 해당 사본의 별도 증거로 확인한다. 관측 자료의 결과는 주 보호 요구5.7에, 비관측 사본은 Q-C12의 자산별 별도 결과에 연결한다. 같은 사본의 접근·암호화는 CHK-OBS-006의 관측 자료 범위에서, 파생 결과의 호환 재사용은 CHK-SUP-015, 요청 cache의 문맥 구별은 CHK-REQ-016, 진행 작업·참조·자원 종결은 CHK-LIF-010·CHK-LIF-011, 폐기 자격 사본의 금지 접근은 CHK-PLT-012에서 각각 판정한다. 이들 시험의 사본 식별·정책·처리·조회 관측은 공유하되 작업 종료나 cache 재사용 거부만으로 저장 사본의 삭제를 확정하지 않는다. 합법적으로 보존하는 사본은 보존 이유와 접근 제한을 남기며, 잔존 bytes만으로 실패를 판정하거나 모든 자산에 물리 소거를 요구하지 않는다.
remaining_setup: 자료별 기간·예외·삭제 확인 수준; unlink만으로 전체 삭제 판단 금지
